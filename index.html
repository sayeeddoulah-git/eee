<script>
(function(){
const S = window.SITE, L = S.links;
const esc = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const txt = s => esc(s).replace(/\[([^\]]*to be added[^\]]*)\]/gi,'<span class="todo">[$1]</span>');
const bold = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
const paras = d => (Array.isArray(d) ? d : String(d||"").split(/\n\s*\n/)).filter(x=>String(x).trim()).map(p=>`<p>${txt(p)}</p>`).join("");
const newTab = 'target="_blank" rel="noopener"';
const cvHref = L.cvPdf ? `href="${esc(L.cvPdf)}" ${newTab}` : 'href="#home/cv"';
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

const ICON = {
  pin:'<path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/>',
  mail:'<path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm9 7.2L4.4 7H4v.6l8 5.6 8-5.6V7h-.4L12 12.2z"/>',
  scholar:'<path d="M12 3 1 9l11 6 9-4.9V17h2V9L12 3zm-6.5 9.6V16c0 1.9 3 3.5 6.5 3.5s6.5-1.6 6.5-3.5v-3.4L12 16.2l-6.5-3.6z"/>',
  orcid:'<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM8.3 17H6.7V9.4h1.6V17zM7.5 8.3a1 1 0 1 1 0-2 1 1 0 0 1 0 2zM10.2 9.4h3c2.6 0 4.2 1.8 4.2 3.8 0 2.1-1.6 3.8-4.2 3.8h-3V9.4zm1.6 1.4v4.8h1.3c1.7 0 2.6-1.1 2.6-2.4s-.9-2.4-2.6-2.4h-1.3z"/>',
  rg:'<path d="M3 3h18v18H3V3zm5.2 4.5c-1.6 0-2.7 1.1-2.7 2.9v3.3c0 1.8 1.1 2.8 2.7 2.8 1.5 0 2.5-.9 2.6-2.4v-1.6H8.2v1.1h1.2v.5c0 .8-.5 1.2-1.2 1.2-.8 0-1.2-.6-1.2-1.6v-3.3c0-1 .5-1.7 1.2-1.7.6 0 1.1.4 1.1 1.2h1.4c0-1.4-1.1-2.4-2.5-2.4zm5.3.1V16h1.4v-3.3h.8l1.4 3.3h1.6l-1.6-3.6c.8-.4 1.3-1.1 1.3-2.1 0-1.6-1-2.7-2.7-2.7h-2.2zm1.4 1.2h.8c.8 0 1.2.5 1.2 1.5 0 .9-.4 1.4-1.2 1.4h-.8V8.8z"/>',
  li:'<path d="M3 3h18v18H3V3zm4.3 7.3H5.4V18h1.9v-7.7zM6.4 6.5a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2zM18.6 13.5c0-2.1-1.1-3.3-2.8-3.3-1 0-1.7.5-2 1.1v-1H12V18h1.9v-4.1c0-1.1.3-2 1.5-2 1.1 0 1.3 1 1.3 2.1V18h1.9v-4.5z"/>',
  cv:'<path d="M6 2h8l6 6v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zm7 1.5V9h5.5L13 3.5zM8 13v1.5h8V13H8zm0 3v1.5h8V16H8z"/>'
};
const ic = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>`;

const ALL_PAGES = [["home","Home"],["research","Research"],["publications","Publications"],["funding","Funding"],["teaching","Teaching"],["training",(window.SITE.training&&window.SITE.training.menuLabel)||"Training"],["service","Service"],["students","Students"],["gallery","Gallery"]];
const TR = S.training || {};
const PAGES = ALL_PAGES.filter(p => (p[0] !== "gallery" || (S.gallery && S.gallery.length)) && (p[0] !== "training" || TR.enabled));

function figure(im, cls){
  const alt = im.alt || im.caption || "";
  return `<figure class="${cls||""}"><a href="${esc(im.src)}" ${newTab}><img src="${esc(im.src)}" alt="${esc(alt)}" loading="lazy" data-check></a>${im.caption?`<figcaption>${txt(im.caption)}</figcaption>`:""}</figure>`;
}
function cite(p){
  const doi = p.doi ? ` <a href="https://doi.org/${esc(p.doi)}" ${newTab}>doi:${esc(p.doi)}</a>` : "";
  return `<li>${bold(p.authors)}, “${esc(p.title)},” <span class="v">${esc(p.venue)}</span>, ${esc(p.year)}.${doi}</li>`;
}
function project(p){
  return `<div class="proj"><h3>${esc(p.title)}</h3><p>${esc(p.desc)}</p>
   <dl><dt>Role</dt><dd>${esc(p.role)}</dd><dt>Funding</dt><dd>${esc(p.funder)}${p.amount?`, ${esc(p.amount)}`:""}</dd>
   <dt>Period</dt><dd>${txt(p.period)}</dd><dt>Status</dt><dd><span class="status">${esc(p.status)}</span></dd></dl></div>`;
}
const topics = () => (S.researchTopics||[]).map(t => Object.assign({}, t, {id: t.id || slug(t.title)}));

const views = {
home(){
  const sel = S.publications.filter(p=>p.selected).sort((a,b)=>b.year-a.year);
  return `<h1>Home</h1>
  <section><p class="lead">${esc(S.intro)}</p></section>
  ${TR.enabled?`<section><div class="callout"><p><b>${esc(TR.title)}.</b> Free interactive training on OBE, Bloom's Taxonomy and Complex Engineering Problems for engineering faculty. <a href="#training">Open the training</a></p></div></section>`:""}
  <section><h2>Prospective students</h2><div class="callout"><p>${esc(S.students.prospective)} Write to <a href="mailto:${esc(L.email)}">${esc(L.email)}</a>.</p></div></section>
  <section><h2>Research interests</h2><p>${esc(S.statement.text)}</p>
   <ol class="list">${topics().map(t=>`<li><a href="#research/${esc(t.id)}">${esc(t.title)}</a></li>`).join("")}</ol></section>
  <section><h2>Education</h2><ul class="list">${S.education.map(e=>`<li>${esc(e.degree)}, ${esc(e.inst)}, ${esc(e.years.split(/[–-]/).pop())}.</li>`).join("")}</ul></section>
  <section><h2>Work experience</h2><ul class="list">${S.appointments.map(a=>`<li>${esc(a[1])}, ${esc(a[2])}, ${esc(a[0])}.</li>`).join("")}</ul></section>
  <section><h2>Selected publications</h2><ul class="pubs">${sel.map(cite).join("")}</ul><p style="margin-top:10px"><a class="more" href="#publications">All publications</a></p></section>
  <section><h2>Awards</h2><ul class="list">${S.awards.map(a=>`<li>${txt(a)}</li>`).join("")}</ul></section>
  <section><h2>Professional affiliations</h2><ul class="list">${S.affiliations.map(a=>`<li>${esc(a)}</li>`).join("")}</ul></section>
  <section><h2 id="cv">CV</h2>${L.cvPdf?`<a class="btn" ${cvHref}>Download CV (PDF)</a>`:`<span class="btn disabled" aria-disabled="true">Download CV (PDF)</span> <span class="todo">[CV PDF to be added]</span>`}</section>
  <section><h2 id="contact">Contact</h2><p><b>Email:</b><br><a href="mailto:${esc(L.email)}">${esc(L.email)}</a></p>
   <p><b>Address:</b><br>${S.contact.lines.map(esc).join("<br>")}<br>Office: ${txt(S.contact.office)}</p></section>`;
},
research(){
  const T = topics();
  return `<h1>Research</h1>
  <section><p class="lead">${esc(S.vision)}</p></section>
  <section><h2>Research topics</h2><ul class="topic-index">${T.map(t=>`<li><a href="#research/${esc(t.id)}">${esc(t.title)}</a></li>`).join("")}</ul></section>
  ${T.map(t=>{
    const imgs = t.images||[];
    const first = imgs[0], rest = imgs.slice(1);
    return `<section class="topic" id="t-${esc(t.id)}"><h2>${esc(t.title)}</h2>
      <div class="topic-row${first?"":" no-img"}"><div>${t.summary?`<p class="summary">${txt(t.summary)}</p>`:""}${paras(t.description)}</div>${first?figure(first):""}</div>
      ${rest.length?`<div class="topic-gallery">${rest.map(i=>figure(i)).join("")}</div>`:""}</section>`;}).join("")}
  <section><h2>Ongoing research directions</h2><ul class="list">${S.directions.map(d=>`<li>${esc(d)}</li>`).join("")}</ul></section>
  <section><h2>Collaborations</h2><ul class="list">${S.collaborations.map(c=>`<li>${c}</li>`).join("")}</ul></section>
  <section><h2>Past research</h2><ul class="list">${S.pastResearch.map(d=>`<li>${esc(d)}</li>`).join("")}</ul></section>`;
},
publications(){
  return `<h1>Publications</h1><section><p>Journal articles, conference papers and abstracts, newest first. Full texts and citation metrics are on
   <a href="${esc(L.scholar)}" ${newTab}>Google Scholar</a>, <a href="${esc(L.orcid)}" ${newTab}>ORCID</a> and <a href="${esc(L.researchgate)}" ${newTab}>ResearchGate</a>.</p>
   <div class="filters"><input id="q" type="search" placeholder="Search titles, authors or venues" aria-label="Search publications">
   <div class="seg" role="group" aria-label="Publication type"><button data-t="all" aria-pressed="true">All</button><button data-t="journal" aria-pressed="false">Journal</button><button data-t="conference" aria-pressed="false">Conference</button><button data-t="abstract" aria-pressed="false">Abstracts</button><button data-t="review" aria-pressed="false">Under review</button></div></div>
   <div id="publist"></div></section>`;
},
funding(){
  return `<h1>Funding</h1><section><p>Research grants received as principal investigator or co-investigator.</p>${S.projects.map(project).join("")}</section>`;
},
teaching(){
  return `<h1>Teaching</h1><section><h2>Teaching philosophy</h2>${S.teachingPhilosophy.map(p=>`<p>${esc(p)}</p>`).join("")}</section>
  <section><h2>Courses and laboratories</h2><p class="meta">Taught at Southeast University, ULAB and MIST.</p>
   ${S.courses.map(c=>`<h3>${esc(c.area)}</h3><ul class="list">${c.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`).join("")}</section>
  <section><h2>Workshops and seminars delivered</h2><ul class="list">${S.workshops.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></section>
  ${TR.enabled?`<section><h2>Self-paced training</h2><p>${esc(TR.title)}: <a href="#training">open the training page</a>.</p></section>`:""}`;
},
training(){
  return `<h1>${esc(TR.title)}</h1>
  <section><p class="lead">${esc(TR.intro)}</p>
   <p><a class="btn" href="${esc(TR.file)}" ${newTab}>${esc(TR.buttonText||"Start the training")}</a></p></section>
  <section><h2>What the training covers</h2>${(TR.modules||[]).map(m=>`<div class="proj"><h3>${esc(m.title)}</h3><p class="meta">${esc(m.lessons)}</p><p>${esc(m.topics)}</p></div>`).join("")}</section>
  <section><h2>How it works</h2><ol class="list">${(TR.howItWorks||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
   <p><a class="btn" href="${esc(TR.file)}" ${newTab}>${esc(TR.buttonText||"Start the training")}</a></p></section>`;
},
service(){
  return `<h1>Academic service</h1><section><p>${esc(S.serviceIntro)}</p></section>`
   + S.service.map(g=>`<section><h2>${esc(g.group)}</h2><ul class="tl">${g.items.map(i=>`<li><span class="when">${esc(i[1]||"")}</span><div><b>${esc(i[0])}</b>${i[2]?`<br>${esc(i[2])}`:""}</div></li>`).join("")}</ul></section>`).join("");
},
students(){
  const s=S.students;
  return `<h1>Students</h1><section><h2>Supervision and mentoring</h2><p>${esc(s.intro)}</p></section>
   <section><h2>Current students</h2><p>${txt(s.current)}</p></section>
   <section><h2>Completed students</h2><p>${txt(s.completed)}</p></section>
   <section><h2>Join the group</h2><div class="callout"><p>${esc(s.prospective)}</p></div><p style="margin-top:14px"><a class="btn" href="mailto:${esc(L.email)}">Email Dr. Sayeed Ud Doulah</a></p></section>`;
},
gallery(){
  return `<h1>Gallery</h1><div class="gallery">${(S.gallery||[]).map(i=>figure(i)).join("")}</div>`;
}
};

function renderPubs(){
  const box=document.getElementById("publist"); if(!box) return;
  const q=(document.getElementById("q").value||"").toLowerCase().trim();
  const t=document.querySelector('.seg button[aria-pressed="true"]').dataset.t;
  const names={journal:"Journal articles",conference:"Conference papers",abstract:"Abstracts and workshop presentations",review:"Manuscripts under review"};
  const list=S.publications.filter(p=>(t==="all"||p.type===t)&&(!q||(p.title+" "+p.authors+" "+p.venue+" "+p.year).toLowerCase().includes(q)));
  let h=`<p class="count" aria-live="polite">${list.length} ${list.length===1?"item":"items"}</p>`;
  for(const type of ["journal","conference","abstract","review"]){
    const g=list.filter(p=>p.type===type).sort((a,b)=>b.year-a.year); if(!g.length) continue;
    h+=`<h2>${names[type]}</h2>`; let yr=null, buf="";
    g.forEach(p=>{ if(p.year!==yr){ if(buf) h+=`<ul class="pubs">${buf}</ul>`; buf=""; yr=p.year; h+=`<p class="year">${yr}</p>`; } buf+=cite(p); });
    h+=`<ul class="pubs">${buf}</ul>`;
  }
  if(!list.length) h+=`<p>No publications match. Clear the search box or choose All.</p>`;
  box.innerHTML=h;
}

const nav=document.getElementById("nav"), toggle=document.querySelector(".nav-toggle");
function show(){
  const [id, sub] = (location.hash||"#home").slice(1).split("/");
  const page = views[id] && PAGES.some(p=>p[0]===id) ? id : "home";
  document.getElementById("content").innerHTML = views[page]();
  document.querySelectorAll("#navlist a").forEach(a=>{ if(a.dataset.p===page) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  const label = PAGES.find(p=>p[0]===page)[1];
  document.title = page==="home" ? `${S.name} | EEE, Southeast University` : `${label} | ${S.name}`;
  if(page==="publications"){
    document.getElementById("q").addEventListener("input",renderPubs);
    document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");renderPubs();}));
    renderPubs();
  }
  document.querySelectorAll("img[data-check]").forEach(img=>{
    const fail=()=>{ const f=img.closest("figure"); if(!f) return; const d=document.createElement("div"); d.className="img-missing"; d.textContent="Picture not found: "+img.getAttribute("src")+". Upload this file to the repository."; f.replaceWith(d); };
    if(img.complete && img.naturalWidth===0) fail(); else img.addEventListener("error",fail,{once:true});
  });
  nav.classList.remove("open"); toggle.setAttribute("aria-expanded","false");
  const target = sub && (document.getElementById("t-"+sub) || document.getElementById(sub));
  if(target) target.scrollIntoView(); else window.scrollTo(0,0);
}

document.getElementById("site-title").innerHTML = `<span class="full">${esc(S.name)}</span><span class="short">Dr. ${esc(S.shortName)}</span>`;
document.getElementById("navlist").innerHTML = PAGES.map(p=>`<li><a href="#${p[0]}" data-p="${p[0]}">${p[1]}</a></li>`).join("");
document.getElementById("sidebar").innerHTML = `<img class="avatar" src="photo.jpg" alt="${esc(S.photoAlt)}">
  <h2 class="sb-name">${esc(S.name.replace(/^Dr\.\s*/,"Dr. "))}</h2>
  <p class="sb-role">${(S.sidebarLines||[]).map(esc).join("<br>")}</p>
  <ul class="sb-links">
   <li>${ic("pin")}<span>${esc(S.location)}</span></li>
   <li>${ic("mail")}<a href="mailto:${esc(L.email)}">Email</a></li>
   ${L.scholar?`<li>${ic("scholar")}<a href="${esc(L.scholar)}" ${newTab}>Google Scholar</a></li>`:""}
   ${L.orcid?`<li>${ic("orcid")}<a href="${esc(L.orcid)}" ${newTab}>ORCID</a></li>`:""}
   ${L.researchgate?`<li>${ic("rg")}<a href="${esc(L.researchgate)}" ${newTab}>ResearchGate</a></li>`:""}
   ${L.linkedin?`<li>${ic("li")}<a href="${esc(L.linkedin)}" ${newTab}>LinkedIn</a></li>`:""}
   <li>${ic("cv")}<a ${cvHref}>CV</a></li>
  </ul>`;
document.getElementById("footer").innerHTML = `<span>© ${new Date().getFullYear()} ${esc(S.name)}</span><span>Department of EEE, Southeast University, Dhaka, Bangladesh</span>`;
toggle.addEventListener("click",()=>{const o=nav.classList.toggle("open");toggle.setAttribute("aria-expanded",o);});
window.addEventListener("hashchange",show);
show();
})();
</script>
