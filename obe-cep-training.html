<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basic OBE and CEP Self-Paced Training</title>
<style>
:root{
  --navy:#13294B; --navy-2:#1F3D6B; --ink:#1B2433; --blue:#2C67B0; --blue-soft:#E7EFF9; --blue-line:#C9D8EC;
  --gray:#5E6978; --gray-soft:#F3F5F8; --line:#D6DDE7; --white:#FFFFFF;
  --ok:#1D7348; --ok-soft:#E5F3EB; --bad:#AE2A21; --bad-soft:#FBEAE8; --warn:#8A5A00; --warn-soft:#FFF4DC;
  --serif:"Palatino Linotype","Book Antiqua",Palatino,"Iowan Old Style","URW Palladio L",Georgia,serif;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --r-sm:4px; --r:8px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--sans);font-size:1rem;line-height:1.6;color:var(--ink);background:var(--gray-soft);overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--serif);color:var(--navy);line-height:1.25;font-weight:700}
h1{font-size:clamp(1.6rem,4vw,2.25rem);margin:.2em 0 .5em}
h2{font-size:clamp(1.3rem,3vw,1.6rem);margin:1.6em 0 .5em}
h3{font-size:1.15rem;margin:1.3em 0 .4em}
p,li{max-width:72ch}
a{color:var(--blue)}
:focus-visible{outline:3px solid #F2B705;outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:-999px;top:0;background:var(--navy);color:#fff;padding:.5rem 1rem;z-index:50}
.skip:focus{left:8px;top:8px}

/* Header */
.app-header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.08)}
.app-header .bar{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem 1.25rem;padding:.65rem clamp(.8rem,3vw,1.5rem);max-width:1280px;margin:0 auto}
.brand{font-family:var(--serif);font-size:1.08rem;font-weight:700;letter-spacing:.01em;margin-right:auto}
.meta{display:flex;flex-wrap:wrap;gap:.3rem .9rem;font-size:.86rem;color:#D5E1F2}
.meta strong{color:#fff;font-weight:600}
.progress-wrap{max-width:1280px;margin:0 auto;padding:0 clamp(.8rem,3vw,1.5rem) .6rem;display:flex;align-items:center;gap:.75rem}
.progress{flex:1;height:8px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;background:#8EC1FF;width:0;transition:width .3s ease}
.progress-label{font-size:.8rem;color:#D5E1F2;min-width:7.5em;text-align:right}

/* Layout */
.layout{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:270px minmax(0,1fr);gap:1.5rem;padding:1.25rem clamp(.8rem,3vw,1.5rem) 7rem}
.outline{align-self:start;position:sticky;top:6.2rem;max-height:calc(100vh - 7rem);overflow:auto;background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:.75rem}
.outline-toggle{display:none}
.outline h2{font-size:.95rem;margin:.6rem .3rem .3rem;color:var(--gray);font-family:var(--sans);font-weight:600}
.outline ol{list-style:none;margin:0;padding:0}
.outline li{max-width:none}
.outline button{display:flex;gap:.5rem;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:.35rem .4rem;border-radius:var(--r-sm);font:inherit;font-size:.86rem;line-height:1.35;color:var(--ink);cursor:pointer}
.outline button:hover:not(:disabled){background:var(--blue-soft)}
.outline button:disabled{color:#98A1AD;cursor:not-allowed}
.outline button[aria-current="step"]{background:var(--blue-soft);font-weight:600;color:var(--navy)}
.outline .mark{flex:0 0 1.1rem;text-align:center;font-size:.8rem;line-height:1.35rem}
.outline .mark.done{color:var(--ok)}
.outline .mod-lock{font-size:.75rem;color:var(--gray);font-weight:400;display:block}

main{min-width:0}
.panel{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:clamp(1rem,3.5vw,2.25rem)}
.crumb{font-size:.85rem;color:var(--gray);margin:0}
.lead{font-size:1.08rem;color:#2F3A4B}
.banner{border-left:4px solid var(--ok);background:var(--ok-soft);padding:.7rem 1rem;border-radius:0 var(--r-sm) var(--r-sm) 0;margin:0 0 1.2rem}
.principle{border:2px solid var(--navy);border-radius:var(--r);padding:1rem 1.2rem;margin:1.2rem 0;background:#fff}
.principle p{margin:.2rem 0;font-family:var(--serif);font-size:1.15rem;color:var(--navy);max-width:none}
.principle small{display:block;color:var(--gray);margin-top:.35rem;font-family:var(--sans)}
.note{background:var(--blue-soft);border:1px solid var(--blue-line);border-radius:var(--r);padding:.8rem 1rem;margin:1rem 0}
.caution{background:var(--warn-soft);border:1px solid #F0D79A;border-radius:var(--r);padding:.8rem 1rem;margin:1rem 0}
.caution strong,.note strong{color:var(--navy)}
.verbatim{font-family:var(--serif);font-size:1.08rem;border-left:4px solid var(--blue);padding:.6rem 1rem;margin:1rem 0;background:#FAFCFF;max-width:72ch}
.verbatim .src{display:block;font-family:var(--sans);font-size:.8rem;color:var(--gray);margin-top:.35rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:1rem;margin:1rem 0}
.box{border:1px solid var(--line);border-radius:var(--r);padding:1rem;background:#fff}
.box h3{margin-top:0}
.tag{display:inline-block;font-size:.78rem;font-weight:600;padding:.05rem .45rem;border-radius:3px;background:var(--blue-soft);color:var(--navy);border:1px solid var(--blue-line);white-space:nowrap}
.tag.wk{background:#EEF3E6;border-color:#C9D9B3;color:#3A5420}
.tag.wp{background:var(--blue-soft)}
.tag.ea{background:#F1EAF6;border-color:#D9C8E6;color:#4F2D6B}
ul.ticks{padding-left:1.2rem}
.table-scroll{overflow-x:auto;margin:1rem 0;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.95rem;background:#fff}
th,td{text-align:left;padding:.6rem .75rem;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--navy);color:#fff;font-weight:600}
tr:last-child td{border-bottom:0}

/* Hierarchy ladder */
.ladder{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:.8rem 0 1.4rem;border:1px solid var(--blue-line);border-radius:var(--r);overflow:hidden}
.ladder div{padding:.55rem .7rem;background:#fff;border-right:1px solid var(--blue-line);position:relative}
.ladder div:last-child{border-right:0}
.ladder b{display:block;font-family:var(--serif);font-size:1.15rem;color:var(--navy)}
.ladder span{display:block;font-size:.78rem;color:var(--gray);line-height:1.3}
.ladder .on{background:var(--navy)}
.ladder .on b{color:#fff}.ladder .on span{color:#CFDDF2}
.ladder .on::after{content:"You are here";position:absolute;right:.5rem;top:.5rem;font-size:.7rem;color:#8EC1FF}

/* Big hierarchy (fundamentals) */
.hier{display:grid;gap:.6rem;margin:1rem 0}
.hier button{display:grid;grid-template-columns:4.5rem 1fr;gap:.9rem;align-items:center;text-align:left;width:100%;font:inherit;border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:.8rem 1rem;cursor:pointer;color:var(--ink)}
.hier button:hover{border-color:var(--blue)}
.hier .code{font-family:var(--serif);font-size:1.6rem;font-weight:700;color:var(--navy)}
.hier .reveal{display:none;color:#2F3A4B;font-size:.95rem}
.hier button[aria-expanded="true"]{border-color:var(--navy);background:#FAFCFF}
.hier button[aria-expanded="true"] .reveal{display:block}
.hier .q{font-weight:600}
.hier .arrow{text-align:center;color:var(--gray);font-size:1.2rem;line-height:1}

/* WP rule */
.rule{display:flex;flex-wrap:wrap;align-items:stretch;gap:.6rem;margin:1.2rem 0}
.rule .req{flex:1 1 200px;background:var(--navy);color:#fff;border-radius:var(--r);padding:1rem}
.rule .req b,.rule .opt b{font-family:var(--serif);font-size:1.6rem;display:block}
.rule .plus{align-self:center;font-size:2rem;color:var(--navy);font-family:var(--serif)}
.rule .opt{flex:2 1 280px;border:2px dashed var(--blue);border-radius:var(--r);padding:1rem;background:#FAFCFF}
.rule .chips{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.4rem}
.rule .chips span{border:1px solid var(--blue-line);background:#fff;border-radius:3px;padding:.05rem .45rem;font-weight:600;color:var(--navy);font-size:.9rem}

/* WK cards */
.wk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:.75rem;margin:1rem 0}
.wk-card{border:1px solid var(--line);border-radius:var(--r);background:#fff;overflow:hidden}
.wk-card>button{display:block;width:100%;text-align:left;font:inherit;background:none;border:0;padding:.85rem 1rem;cursor:pointer;color:var(--ink)}
.wk-card>button:hover{background:var(--gray-soft)}
.wk-card .code{font-family:var(--serif);font-weight:700;font-size:1.25rem;color:#3A5420}
.wk-card .short{display:block;font-size:.92rem;color:#2F3A4B}
.wk-card .state{float:right;font-size:.78rem;color:var(--gray)}
.wk-card .body{padding:0 1rem 1rem;display:none}
.wk-card.open{grid-column:1/-1;border-color:#9FBA7F}
.wk-card.open .body{display:block}
.wk-card .body .verbatim{border-left-color:#7FA457}
.counter{font-size:.9rem;color:var(--gray)}

/* Matrix rows */
.mx td:first-child{width:7.5rem}
.mx button.rowbtn{font:inherit;font-weight:700;background:none;border:1px solid var(--blue-line);border-radius:var(--r-sm);padding:.15rem .5rem;cursor:pointer;color:var(--navy);display:inline-flex;gap:.35rem;align-items:center}
.mx button.rowbtn:hover{background:var(--blue-soft)}
.mx tr.detail td{background:#FAFCFF}
.mx tr.detail[hidden]{display:none}

/* Trade-off */
.trade{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));margin:1rem 0}
.slider{margin:.6rem 0}
.slider label{display:flex;justify-content:space-between;font-weight:600;font-size:.95rem}
.slider output{font-weight:400;color:var(--gray)}
.slider input{width:100%;accent-color:var(--navy)}
.tension{border:1px solid var(--line);border-radius:var(--r);padding:1rem;background:#fff}
.tension h3{margin-top:0}
.tension ul{padding-left:1.1rem;margin:.4rem 0}
.meter{display:flex;gap:4px;margin:.4rem 0 .8rem}
.meter i{flex:1;height:10px;border-radius:2px;background:var(--line)}
.meter i.on{background:var(--navy)}

/* Stakeholder ring */
.ring-wrap{display:grid;gap:1rem;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:start;margin:1rem 0}
.ring{position:relative;width:100%;max-width:520px;aspect-ratio:1/1;margin:0 auto}
.ring svg{position:absolute;inset:0;width:100%;height:100%}
.ring .hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:30%;aspect-ratio:1/1;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--serif);font-size:.85rem;padding:.5rem;line-height:1.2}
.ring .sh{position:absolute;transform:translate(-50%,-50%);font:inherit;font-size:.8rem;font-weight:600;line-height:1.2;max-width:8.5rem;border:1px solid var(--blue-line);background:#fff;color:var(--navy);border-radius:var(--r-sm);padding:.35rem .5rem;cursor:pointer}
.ring .sh:hover,.ring .sh[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.detail-card{border:1px solid var(--line);border-radius:var(--r);padding:1rem;background:#fff;min-height:9rem}
.detail-card h3{margin-top:0}

/* Systems grid */
.sys{display:grid;gap:.6rem;margin:1rem 0}
.sys .layer{display:grid;grid-template-columns:8.5rem 1fr;gap:.6rem;align-items:center}
.sys .layer-name{font-size:.82rem;color:var(--gray);font-weight:600}
.sys .nodes{display:flex;flex-wrap:wrap;gap:.5rem}
.sys .node{font:inherit;font-size:.9rem;border:1px solid var(--line);background:#fff;border-radius:var(--r-sm);padding:.45rem .7rem;cursor:pointer;color:var(--ink)}
.sys .node:hover{border-color:var(--blue)}
.sys .node.sel{background:var(--navy);color:#fff;border-color:var(--navy)}
.sys .node.link{border:2px solid var(--blue);background:var(--blue-soft)}
.sys .node.link::after{content:" linked";font-size:.72rem;color:var(--blue);font-weight:600}

/* Consequence explorer */
.conseq{display:flex;flex-wrap:wrap;gap:.5rem;margin:.8rem 0}
.conseq button{font:inherit;font-size:.92rem;border:1px solid var(--line);background:#fff;border-radius:var(--r-sm);padding:.45rem .75rem;cursor:pointer;color:var(--ink)}
.conseq button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.chain{display:grid;gap:.5rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.chain div{border:1px solid var(--line);border-radius:var(--r);padding:.7rem;background:#fff}
.chain b{display:block;color:var(--navy);font-size:.9rem}

details.doc{border:1px solid var(--line);border-radius:var(--r);background:#fff;margin:.5rem 0}
details.doc summary{cursor:pointer;padding:.7rem 1rem;font-weight:600;color:var(--navy)}
details.doc>div{padding:0 1rem .8rem}
details.doc .eg{border-left:3px solid var(--blue-line);padding-left:.75rem;color:#2F3A4B}

/* Questions */
.checks{margin-top:2rem;border-top:2px solid var(--navy);padding-top:1rem}
.checks>h2{margin-top:.2rem}
.q{border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem;margin:1rem 0;background:#fff}
.q.solved{border-color:#9BC9AE}
.q fieldset{border:0;margin:0;padding:0;min-width:0}
.q legend{font-weight:600;padding:0;margin-bottom:.5rem;max-width:72ch}
.q .qtype{display:block;font-size:.8rem;color:var(--gray);font-weight:400;margin-bottom:.15rem}
.q .scenario{background:var(--gray-soft);border-radius:var(--r-sm);padding:.7rem .9rem;margin:.2rem 0 .7rem;font-size:.95rem}
.q .scenario ul{margin:.3rem 0;padding-left:1.2rem}
.opt{display:flex;gap:.6rem;align-items:flex-start;padding:.45rem .6rem;border:1px solid transparent;border-radius:var(--r-sm);cursor:pointer;margin:.15rem 0}
.opt:hover{background:var(--gray-soft)}
.opt input{margin-top:.3rem;flex:0 0 auto;width:1.05rem;height:1.05rem;accent-color:var(--navy)}
.opt.picked-ok{border-color:#9BC9AE;background:var(--ok-soft)}
.chips-row{display:flex;flex-wrap:wrap;gap:.4rem}
.chips-row .opt{border:1px solid var(--line);padding:.35rem .65rem;margin:0}
.chips-row .opt input{margin-top:.2rem}
.match-row{display:grid;grid-template-columns:1fr minmax(9rem,13rem);gap:.6rem;align-items:center;padding:.45rem 0;border-bottom:1px solid var(--gray-soft)}
.match-row:last-child{border-bottom:0}
select{font:inherit;padding:.35rem .5rem;border:1px solid #9AA6B5;border-radius:var(--r-sm);background:#fff;width:100%;color:var(--ink)}
.q-actions{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-top:.7rem}
.attempts{font-size:.82rem;color:var(--gray)}
.fb{margin-top:.7rem;border-radius:var(--r-sm);padding:.6rem .8rem;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-soft);border:1px solid #9BC9AE}
.fb.bad{background:var(--bad-soft);border:1px solid #E8B2AC}
.fb.info{background:var(--warn-soft);border:1px solid #F0D79A}
.fb .verdict{font-weight:700;display:block}
.fb.ok .verdict{color:var(--ok)}.fb.bad .verdict{color:var(--bad)}
.fb p{margin:.25rem 0 0}

/* Buttons */
.btn{font:inherit;font-weight:600;border-radius:var(--r-sm);padding:.6rem 1.15rem;cursor:pointer;border:1px solid var(--navy);background:var(--navy);color:#fff;min-height:44px}
.btn:hover:not(:disabled){background:var(--navy-2)}
.btn:disabled{background:#B7C0CC;border-color:#B7C0CC;color:#F4F6F9;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--navy)}
.btn.ghost:hover:not(:disabled){background:var(--blue-soft)}
.btn.ghost:disabled{color:#98A1AD;background:#fff;border-color:var(--line)}
.btn.small{padding:.35rem .8rem;min-height:36px;font-size:.92rem}
.btn.danger{background:#fff;color:var(--bad);border-color:#D9A39D}

/* Footer */
.app-footer{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);box-shadow:0 -2px 8px rgba(19,41,75,.06)}
.app-footer .bar{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:.6rem;padding:.6rem clamp(.8rem,3vw,1.5rem)}
.app-footer .hint{flex:1;font-size:.85rem;color:var(--gray);text-align:right;min-width:0}

/* Forms */
.field{margin:1rem 0;max-width:30rem}
.field label{display:block;font-weight:600;margin-bottom:.3rem}
.field input,.field select{font:inherit;width:100%;padding:.6rem .7rem;border:1px solid #9AA6B5;border-radius:var(--r-sm)}
.field .help{font-size:.85rem;color:var(--gray);margin-top:.25rem}
.field .err{font-size:.88rem;color:var(--bad);margin-top:.25rem}

/* Welcome */
.welcome-top{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:1.5rem;align-items:start}
.path{list-style:none;padding:0;margin:0;border-left:3px solid var(--blue-line)}
.path li{padding:.3rem 0 .3rem 1rem;position:relative;font-size:.95rem}
.path li::before{content:"";position:absolute;left:-7px;top:.75rem;width:11px;height:11px;border-radius:50%;background:#fff;border:2px solid var(--navy)}
.path li.mod{font-weight:700;color:var(--navy);font-family:var(--serif);font-size:1.02rem}

/* Final */
.score{font-family:var(--serif);font-size:2.4rem;color:var(--navy);margin:.2rem 0}
.result{border-radius:var(--r);padding:1rem 1.2rem;margin:1rem 0}
.result.pass{background:var(--ok-soft);border:1px solid #9BC9AE}
.result.fail{background:var(--bad-soft);border:1px solid #E8B2AC}
.review-list li{margin:.25rem 0}
.exam-q .qnum{font-size:.8rem;color:var(--gray)}
.exam-q.missing{border-color:var(--bad)}
.exam-q .mark-res{font-weight:700;font-size:.9rem;margin-top:.4rem}
.exam-q .mark-res.r-ok{color:var(--ok)}.exam-q .mark-res.r-bad{color:var(--bad)}

/* Certificate */
.cert{position:relative;background:#fff;border:10px solid var(--navy);outline:2px solid var(--navy);outline-offset:-18px;padding:clamp(1.2rem,5vw,3rem) clamp(1rem,5vw,3.5rem);text-align:center;margin:1rem auto;max-width:960px;font-family:var(--serif)}
.cert .inst{font-family:var(--sans);font-size:.85rem;color:var(--gray);letter-spacing:.04em}
.cert h1{font-size:clamp(1.5rem,5vw,2.6rem);letter-spacing:.08em;margin:.4rem 0 .6rem}
.cert p{max-width:none}
.cert .lbl{font-style:italic;color:#3B4656;margin:.3rem 0}
.cert .name{font-size:clamp(1.6rem,6vw,2.6rem);color:var(--navy);border-bottom:1px solid var(--navy);display:inline-block;padding:0 1.5rem .2rem;margin:.3rem 0 .6rem;max-width:100%;overflow-wrap:anywhere}
.cert .course{font-size:clamp(1.05rem,3vw,1.4rem);font-weight:700;color:var(--navy);margin:.3rem 0 .8rem}
.cert .incl{display:flex;flex-wrap:wrap;justify-content:center;gap:.4rem 1.4rem;font-size:.98rem;margin:.4rem 0 1rem}
.cert .facts{display:flex;flex-wrap:wrap;justify-content:center;gap:.6rem 2.2rem;font-family:var(--sans);font-size:.9rem;margin-top:1rem}
.cert .facts div span{display:block;color:var(--gray);font-size:.78rem}
.cert .facts code{font-family:Consolas,"Courier New",monospace;font-size:.92rem}
.cert .disc{font-family:var(--sans);font-size:.72rem;color:var(--gray);margin:1.2rem auto 0;max-width:60ch}
.cert .ladder-mini{display:inline-flex;gap:.4rem;align-items:center;font-family:var(--sans);font-size:.85rem;color:var(--navy);margin:.2rem 0}
.cert .ladder-mini b{border:1px solid var(--navy);padding:0 .45rem;border-radius:3px}

dialog{border:1px solid var(--line);border-radius:var(--r);padding:1.4rem;max-width:26rem;width:calc(100% - 2rem)}
dialog::backdrop{background:rgba(19,41,75,.45)}
dialog h2{margin-top:0}
.dlg-actions{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1rem;flex-wrap:wrap}

@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .outline{position:static;max-height:none;display:none}
  .outline.open{display:block}
  .outline-toggle{display:inline-flex;margin-bottom:.75rem}
  .welcome-top{grid-template-columns:1fr}
  .ring-wrap{grid-template-columns:1fr}
}
@media (max-width:560px){
  .ring{aspect-ratio:auto;max-width:none}
  .ring svg,.ring .hub{display:none}
  .ring .sh{position:static;transform:none;max-width:none;width:100%;text-align:left}

.dept-card input{margin-top:.3rem;width:1.1rem;height:1.1rem;accent-color:var(--navy)}
.dept-card:has(input:checked){border-color:var(--navy);background:var(--blue-soft)}
.dept-card b{display:block;color:var(--navy)}
.dept-card span{font-size:.85rem;color:var(--gray)}
fieldset.plain{border:0;padding:0;margin:1rem 0}
fieldset.plain legend{font-weight:600;padding:0;margin-bottom:.2rem}

/* Dashboard */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:1rem;margin-top:1rem}
.mod-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:1.1rem 1.2rem}
.mod-card h2{margin:.1rem 0 .3rem;font-size:1.3rem}
.bigbar{height:12px;background:var(--gray-soft);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin:.3rem 0 .2rem}
.bigbar span{display:block;height:100%;background:var(--navy)}
.pct{font-weight:700;color:var(--navy)}
.lesson-list{list-style:none;margin:.8rem 0;padding:0;border-top:1px solid var(--line)}
.lesson-list li{display:grid;grid-template-columns:1.3rem 1fr auto;gap:.5rem;align-items:center;padding:.45rem 0;border-bottom:1px solid var(--gray-soft);font-size:.92rem;max-width:none}
.lesson-list .st{text-align:center}
.lesson-list .st.done{color:var(--ok);font-weight:700}
.lesson-list button.linkish{font:inherit;text-align:left;background:none;border:0;padding:0;color:var(--ink);cursor:pointer}
.lesson-list button.linkish:hover:not(:disabled){color:var(--blue);text-decoration:underline}
.lesson-list button.linkish:disabled{color:#98A1AD;cursor:not-allowed}
.score-chip{font-size:.8rem;color:var(--gray);white-space:nowrap}
.btn-row{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.6rem}
.stats{display:flex;flex-wrap:wrap;gap:.6rem 2rem;margin:.6rem 0}
.stats div span{display:block;font-size:.8rem;color:var(--gray)}
.stats div b{font-size:1.05rem;color:var(--navy)}
.profile-line{display:flex;flex-wrap:wrap;gap:.3rem 1.2rem;color:#2F3A4B}
.cert-list{display:flex;flex-wrap:wrap;gap:.5rem}

/* Lesson layout */
.outline .mod-title{font-family:var(--serif);color:var(--navy);font-size:1rem;margin:.2rem .3rem .5rem}
.perf{border:1px solid var(--line);border-radius:var(--r);padding:.8rem 1rem;margin-top:1rem;background:var(--gray-soft)}
.perf.pass{background:var(--ok-soft);border-color:#9BC9AE}
.perf.fail{background:var(--bad-soft);border-color:#E8B2AC}
.perf p{margin:.2rem 0}
.fb .reason{margin-top:.35rem}
.fb .reason b{color:var(--navy)}

/* Widgets new */
.snap{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;margin:1rem 0}
.snap button{font:inherit;font-weight:600;border:1px solid var(--blue-line);background:#fff;color:var(--navy);border-radius:var(--r-sm);padding:.5rem .8rem;cursor:pointer}
.snap button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.snap .arr{color:var(--gray)}
.bloom-ladder{display:grid;gap:.3rem;margin:1rem 0}
.bloom-ladder button{display:grid;grid-template-columns:3rem 8rem 1fr auto;gap:.6rem;align-items:center;text-align:left;font:inherit;border:1px solid var(--line);background:#fff;border-radius:var(--r-sm);padding:.5rem .8rem;cursor:pointer;color:var(--ink)}
.bloom-ladder button:hover{border-color:var(--blue)}
.bloom-ladder button[aria-pressed="true"]{border-color:var(--navy);background:var(--blue-soft)}
.bloom-ladder .lv{font-family:var(--serif);font-weight:700;color:var(--navy)}
.bloom-ladder .nm{font-weight:700}
.bloom-ladder .df{font-size:.9rem;color:#2F3A4B}
.bloom-ladder .ord{font-size:.75rem;color:var(--gray);text-align:right}
.verb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:.6rem;margin:1rem 0}
.verb-grid div{border:1px solid var(--line);border-radius:var(--r-sm);padding:.6rem .7rem;background:#fff}
.verb-grid b{display:block;color:var(--navy);font-family:var(--serif)}
.verb-grid span{font-size:.88rem;color:#2F3A4B}
.tool{border:1px solid var(--blue-line);background:#FAFCFF;border-radius:var(--r);padding:1rem;margin:1rem 0}
.tool .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:.7rem}
.tool label{display:block;font-weight:600;font-size:.9rem;margin-bottom:.2rem}
.tool input[type=text],.tool input[type=number],.tool textarea,.tool select{font:inherit;width:100%;padding:.45rem .55rem;border:1px solid #9AA6B5;border-radius:var(--r-sm);background:#fff}
.tool .out{margin-top:.8rem;background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);padding:.7rem .9rem}
.tool .out p{margin:.25rem 0}
.warnlist{margin:.3rem 0;padding-left:1.1rem}
.chainx{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin:1rem 0}
.chainx button{font:inherit;font-weight:600;text-align:left;border:1px solid var(--line);background:#fff;border-radius:var(--r-sm);padding:.6rem .7rem;cursor:pointer;color:var(--navy);position:relative}
.chainx button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.chainx small{display:block;font-weight:400;color:inherit;opacity:.8}
.nest{margin:1rem 0}
.nest .loop{border:2px solid var(--blue-line);border-radius:var(--r);padding:.6rem .8rem .8rem;background:#fff}
.nest .loop .loop{margin-top:.6rem;background:#FAFCFF}
.nest button{font:inherit;font-weight:700;border:1px solid var(--blue-line);background:#fff;color:var(--navy);border-radius:var(--r-sm);padding:.3rem .7rem;cursor:pointer}

.nest .freq{font-size:.8rem;color:var(--gray);margin-left:.4rem}
.anchor{display:inline-block;margin-bottom:.5rem;font-size:.85rem;font-weight:600;color:var(--navy);border:1px dashed var(--navy);border-radius:3px;padding:.15rem .5rem}

.checklist input{margin-top:.3rem;width:1.05rem;height:1.05rem;accent-color:var(--navy)}
.case-card{border:2px solid var(--navy);border-radius:var(--r);padding:1rem 1.2rem;background:#fff;margin:1rem 0}
.case-card h3{margin-top:0}
.ex-dept{font-size:.92rem;border-top:1px solid var(--line);padding-top:.5rem;margin-top:.5rem}
.ex-dept b{color:var(--navy)}
.tslider{margin:1rem 0;border:1px solid var(--line);border-radius:var(--r);padding:.8rem 1rem;background:#fff}

.sh-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:.4rem;margin:.8rem 0}

.sh-list button[aria-pressed="true"]{background:var(--navy);color:#fff}

/* Admin */
.tabs{display:flex;flex-wrap:wrap;gap:.3rem;border-bottom:2px solid var(--navy);margin:1rem 0}
.tabs button{font:inherit;font-weight:600;font-size:.92rem;border:1px solid var(--line);border-bottom:0;background:var(--gray-soft);color:var(--ink);border-radius:var(--r-sm) var(--r-sm) 0 0;padding:.45rem .8rem;cursor:pointer}

.form{display:grid;gap:.8rem}
.form label{display:block;font-weight:600;font-size:.9rem;margin-bottom:.2rem}
.form input[type=text],.form input[type=number],.form input[type=password],.form select,.form textarea{font:inherit;width:100%;padding:.45rem .55rem;border:1px solid #9AA6B5;border-radius:var(--r-sm);background:#fff}

.qrow .qt{font-size:.9rem}
.qrow .qa{display:flex;gap:.3rem;flex-wrap:wrap}
.qedit{border:2px solid var(--navy);border-radius:var(--r);padding:1rem;background:#FAFCFF;margin:.6rem 0}
.toast{position:fixed;left:50%;bottom:5.5rem;transform:translateX(-50%);width:max-content;max-width:calc(100% - 2rem);background:var(--ink);color:#fff;padding:.55rem 1rem;border-radius:var(--r-sm);font-size:.92rem;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.err-text{color:var(--bad);font-size:.88rem}
.adm-note{font-size:.85rem;color:var(--gray)}
.cert .dept{font-family:var(--sans);font-size:.95rem;color:#3B4656;margin:-.2rem 0 .5rem}
.cert .sig{margin-top:1rem;font-family:var(--sans);font-size:.85rem}
.cert .sig .line{display:inline-block;border-top:1px solid var(--ink);padding-top:.2rem;min-width:14rem}
.cert .devline{font-family:var(--sans);font-size:.78rem;color:var(--gray);margin-top:.6rem}
.cert-pick{display:flex;flex-wrap:wrap;gap:.5rem;margin:.6rem 0}

@media (max-width:900px){

  .mini-prog,.preview-banner,.toast{display:none!important}

concepts, that supports engineering design and operations in a practice area","ex":{"EEE":"Energy efficiency, lifecycle cost and environmental impact of a photovoltaic system.","CSE":"Energy use of data centres and model training; e-waste and hardware lifecycle.","TE":"Water, energy and chemical consumption in dyeing; recycled fibres; effluent treatment cost."}},{"code":"WK6","short":"Engineering practice (technology)","text":"Knowledge of engineering practice (technology) in the practice areas in the engineering discipline","ex":{"EEE":"Sensors, embedded systems, power electronics, communication systems and test equipment.","CSE":"Version control, CI/CD pipelines, cloud platforms, testing frameworks.","TE":"Spinning, weaving, knitting and dyeing machinery; laboratory testing standards practice."}},{"code":"WK7","short":"Engineering and society","text":"Knowledge of the role of engineering in society and identified issues in engineering practice in the discipline, such as professional responsibility of an engineer to public safety and sustainable development","ex":{"EEE":"Electrical safety, energy access, environmental impact and sustainable development.","CSE":"Data privacy, algorithmic bias, digital inclusion and critical-infrastructure security.","TE":"Worker safety, chemical exposure, river pollution and sustainable development of the RMG sector."}},{"code":"WK8","short":"Research literature, critical thinking and emerging issues","text":"Engagement with selected knowledge in the current research literature of the discipline, awareness of the power of critical thinking and creative approaches to evaluate emerging issues","ex":{"EEE":"Using recent research to develop an AI-based fault detection method.","CSE":"Reviewing recent papers on explainable AI before choosing a diagnostic model.","TE":"Using recent research on enzymatic or waterless dyeing to reduce effluent."}},{"code":"WK9","short":"Ethics, inclusive behavior and conduct","text":"Ethics, inclusive behavior and conduct. Knowledge of professional ethics, responsibilities, and norms of engineering practice. Awareness of the need for diversity by reason of ethnicity, gender, age, physical ability etc. with mutual understanding and respect, and of inclusive attitudes","ex":{"EEE":"Designing safe, accessible technology appropriate for diverse users.","CSE":"Fair, accessible software; honest reporting of model limitations.","TE":"Fair labour practices, safe workplaces and inclusive garment sizing."}}],"WP":[{"code":"WP1","name":"Depth of knowledge required","core":"Depth of knowledge","text":"Cannot be resolved without in-depth engineering knowledge at the level of one or more of WK3, WK4, WK5, WK6 or WK8 which allows a fundamentals-based, first principles analytical approach","plain":"The problem cannot be solved by routine procedure or by running a tool. It needs deep engineering knowledge, reasoned from fundamentals and first principles.","key":"Required in every CEP. Software use alone is not evidence; fundamentals-based analysis is.","ex":{"EEE":"Protection coordination for a campus distribution network needs fault analysis and protection engineering from first principles.","CSE":"Designing a fault-tolerant distributed database needs consistency models, networking and failure analysis from first principles.","TE":"Designing a low-liquor-ratio reactive dyeing process needs dye-fibre chemistry and mass-transfer reasoning, not just a supplier recipe."}},{"code":"WP2","name":"Range of conflicting requirements","core":"Conflicting requirements","text":"Involve wide-ranging or conflicting technical, non-technical issues (such as ethical, sustainability, legal, political, economic, societal) and consideration of future requirements","plain":"Several requirements pull in different directions, including non-technical ones, and future needs must be considered.","key":"Includes non-technical issues and future requirements. Document the conflict and how it was resolved.","ex":{"EEE":"Cost vs reliability vs cybersecurity vs future expansion in a smart-grid design.","CSE":"Model accuracy vs patient privacy vs explainability vs cloud cost in a healthcare AI system.","TE":"Shade quality vs water use vs chemical cost vs buyer compliance in a dyeing process."}},{"code":"WP3","name":"Depth of analysis required","core":"No obvious solution","text":"Have no obvious solution and require abstract thinking, creativity and originality in analysis to formulate suitable models","plain":"There is no ready-made model to apply. The team must formulate a suitable model using abstraction, creativity and judgment.","key":"Long calculations are not enough. A suitable model must be formulated where none is obvious.","ex":{"EEE":"Formulating a model of abnormal load behaviour that existing models do not capture.","CSE":"Formulating a threat model and detection features for a new class of attack.","TE":"Formulating a model linking machine settings to fabric defect rates where no published model fits the mill."}},{"code":"WP4","name":"Familiarity of issues","core":"Novel or infrequent issue","text":"Involve infrequently encountered issues or novel problems","plain":"The situation is new, unusual, emerging or infrequently encountered in engineering practice.","key":"Novel or infrequent in engineering practice, not just new to the student.","ex":{"EEE":"Protection of a network with many vehicle-to-grid chargers whose fault behaviour is not well established.","CSE":"Securing large language model features against prompt-injection attacks, an emerging threat.","TE":"Processing a new bio-based fibre whose dyeing behaviour is not documented."}},{"code":"WP5","name":"Extent of applicable codes","core":"Beyond applicable codes","text":"Address problems not encompassed by standards and codes of practice for professional engineering","plain":"Existing standards and codes do not adequately encompass the problem, so engineers must reason beyond them.","key":"Lack of a standard alone does not create complexity. The problem must extend beyond what codes encompass.","ex":{"EEE":"Wireless sensing that triggers protective actions, a configuration codes do not fully address.","CSE":"Regulation and standards that do not yet cover AI-assisted clinical decisions in this setting.","TE":"Recycled-blend fabrics where existing test standards do not fully cover the material behaviour."}},{"code":"WP6","name":"Stakeholder involvement and conflicting requirements","core":"Multiple stakeholders","text":"Involve collaboration across engineering disciplines, other fields, and/or diverse groups of stakeholders with widely varying needs","plain":"Solving the problem requires working across disciplines and with groups whose needs differ widely.","key":"Collaboration across disciplines or with stakeholders whose needs vary widely.","ex":{"EEE":"EEE, CSE/IT, facility management, finance, students and the utility on a smart-campus system.","CSE":"Doctors, nurses, patients, hospital IT, regulators and data scientists on a triage system.","TE":"Buyers, compliance auditors, dyeing masters, environmental engineers, workers and the local community."}},{"code":"WP7","name":"Interdependence","core":"Interdependent subsystems","text":"Address high level problems including many components or sub-problems that may require a systems approach","plain":"The problem consists of many interacting components or sub-problems, so it must be treated as a system.","key":"Many interacting components; decisions in one subsystem affect others.","ex":{"EEE":"Sensors, communication, analytics, control and distribution that constrain each other.","CSE":"Data pipeline, model, API, front end, security and monitoring that must work as one system.","TE":"Dyeing machine, chemical dosing, heat recovery and effluent treatment plant that affect each other."}}],"EA":[{"code":"EA1","name":"Range of resources","core":"Diverse resources","text":"Involve the use of diverse resources including people, data and information, natural, financial and physical resources and appropriate technologies including analytical and/or design software","key":"People, data, money, materials, equipment and software brought together.","ex":{"EEE":"Engineers, budget, sensors, test equipment, datasets and simulation software.","CSE":"Developers, clinicians, labelled datasets, cloud credits, GPUs and testing tools.","TE":"Dyeing masters, chemists, water, chemicals, lab equipment, ETP capacity and process software."}},{"code":"EA2","name":"Level of interactions","core":"Interactions","text":"Require optimal resolution of interactions between wide-ranging and/or conflicting technical, non-technical, and engineering issues","key":"Not just conflicting issues, but their optimal resolution.","ex":{"EEE":"Balancing performance, economics, environment and grid constraints in a renewable system.","CSE":"Resolving latency, cost, privacy and accuracy together in a cloud deployment.","TE":"Resolving shade quality, throughput, water use and compliance together."}},{"code":"EA3","name":"Innovation","core":"Innovation","text":"Involve creative use of engineering principles, innovative solutions for a conscious purpose, and research-based knowledge","key":"Innovation with a conscious engineering purpose, grounded in research. New technology alone is not enough.","ex":{"EEE":"A research-based predictive maintenance method for transformers.","CSE":"Adapting a published anomaly-detection method to detect fraud in a specific bank's data.","TE":"Adapting published enzymatic pretreatment research to cut energy use in a mill."}},{"code":"EA4","name":"Consequences to society and the environment","core":"Consequences","text":"Have significant consequences in a range of contexts, characterized by difficulty of prediction and mitigation","key":"Ask: what happens if the decision is wrong? Consequences are significant and hard to predict or mitigate.","ex":{"EEE":"Power failure, electrical safety risk and critical-infrastructure outages.","CSE":"Misdiagnosis, data breach or biased decisions affecting thousands of people.","TE":"River pollution, worker health and loss of export compliance."}},{"code":"EA5","name":"Familiarity","core":"Beyond previous experience","text":"Can extend beyond previous experiences by applying principles-based approaches","key":"Established principles applied beyond previous experience.","ex":{"EEE":"Applying control and signal-processing principles to a new type of monitoring.","CSE":"Applying established security principles to a platform the team has never built.","TE":"Applying colour-science principles to a fibre blend the mill has never processed."}}],"bloom":{"levels":[{"level":1,"name":"Remember","def":"Recalling from memory previously learned material.","verbs":["Define","List","State","Recall","Name","Identify","Outline","Tabulate","Recognize","Enumerate"]},{"level":2,"name":"Understand","def":"Explaining ideas or concepts.","verbs":["Explain","Describe","Summarize","Interpret","Classify","Paraphrase","Compare","Contrast","Demonstrate","Clarify"]},{"level":3,"name":"Apply","def":"Using information in another familiar situation.","verbs":["Apply","Calculate","Solve","Compute","Implement","Use","Execute","Find","Predict"]},{"level":4,"name":"Analyze","def":"Breaking information into parts to explore understandings and relationships.","verbs":["Analyze","Differentiate","Examine","Investigate","Categorize","Compare","Contrast"]},{"level":5,"name":"Evaluate","def":"Justifying a decision or course of action.","verbs":["Evaluate","Judge","Assess","Critique","Justify","Validate","Argue"]},{"level":6,"name":"Create","def":"Generating new ideas, products or new ways of viewing things.","verbs":["Design","Create","Develop","Construct","Generate","Invent","Compose","Synthesize"]}],"kvl":["Define Kirchhoff's Voltage Law.","Explain the significance of Kirchhoff's Voltage Law.","Calculate an unknown voltage using KVL.","Analyze a multi-loop circuit using KVL.","Evaluate two circuit designs and justify which is more appropriate.","Design a circuit that satisfies a specified set of requirements."],"examples":{"EEE":["State the per-unit system formula for base impedance.","Explain why reactive power affects voltage regulation.","Calculate the efficiency of a transformer from open- and short-circuit test data.","Analyze an unsymmetrical fault using sequence networks.","Evaluate two protection schemes for a feeder and justify the better one.","Design a solar-powered battery charging system for a remote monitoring device."],"CSE":["List the operations of a stack ADT.","Explain why a hash table gives average O(1) lookup.","Implement Dijkstra's algorithm for a given weighted graph.","Analyze the time complexity of a recursive algorithm.","Critique two ML models using precision, recall and fairness and recommend one.","Design a scalable cloud-based hospital appointment system."],"TE":["Define yarn count in the Ne system.","Explain how twist affects yarn strength.","Calculate the GSM of a fabric sample from its weight and dimensions.","Analyze the causes of shade variation across dyeing batches.","Assess three sustainable fibre options and justify one for a T-shirt line.","Design an energy-efficient dyeing process that reduces water use by 30%."]},"weakVerbs":["know","understand","learn","appreciate","be aware","be familiar","gain knowledge","be exposed","realize","comprehend"]},"coTables":{"EEE":{"course":"EEE317: Power Systems I (3 credits)","rows":[["CO1","Demonstrate basic aspects of power systems: per-unit representation, real and reactive power, voltage and frequency control techniques.","PO2","Cognitive / L3","Lecture, discussion, class participation","Midterm exam, quiz"],["CO2","Apply numerical methods for the load flow study of a power system.","PO2","Cognitive / L3","Lecture, discussion, group work","Midterm, final exam, quiz, assignment"],["CO3","Analyze symmetrical and unsymmetrical faults in a power system.","PO2","Cognitive / L4","Lecture, discussion, group work","Final exam, quiz, assignment"],["CO4","Analyze the stability of a power system.","PO2","Cognitive / L4","Lecture, discussion","Final exam, quiz"]]},"CSE":{"course":"CSE: Data Structures","rows":[["CO1","Apply basic data structures such as arrays, stacks, queues and linked lists in solving problems.","PO1","Cognitive / L3","Lecture, coding demonstrations, lab","Quiz, midterm, lab test"],["CO2","Analyze the time and space complexity of algorithms.","PO2","Cognitive / L4","Lecture, problem-solving sessions","Midterm, final exam"],["CO3","Implement tree and graph algorithms for real-world applications.","PO3","Cognitive / L3","Lab, mini project","Assignment, course project, final exam"]]},"TE":{"course":"TE: Textile Wet Processing","rows":[["CO1","Explain the chemistry of pretreatment, dyeing and finishing of cellulosic fibres.","PO1","Cognitive / L2","Lecture, discussion","Quiz, midterm"],["CO2","Calculate dye and chemical recipes for a specified shade and liquor ratio.","PO1","Cognitive / L3","Lecture, lab demonstration","Quiz, lab test, final exam"],["CO3","Analyze the causes of dyeing faults from process and test data.","PO2","Cognitive / L4","Case discussion, lab","Final exam, assignment"],["CO4","Evaluate the environmental impact of a dyeing process and propose improvements.","PO7","Cognitive / L5","Group project, industry visit","Course project report, presentation"]]}},"alignment":{"EEE":{"co":"Analyze symmetrical and unsymmetrical faults in a power system (L4).","tl":"Worked examples on sequence networks; group problem-solving; simulation lab on fault studies.","assess":"Final-exam question: determine fault current for an SLG fault at bus 3 of a given network and identify the most severe fault location.","attain":"CO3-tagged marks analysed per student; 64% reached the threshold against a 60% target."},"CSE":{"co":"Analyze the time and space complexity of algorithms (L4).","tl":"Lectures on asymptotic analysis; recurrence-solving workshop; peer review of complexity derivations.","assess":"Midterm question: derive the time complexity of two given algorithms and determine which scales better for n = 10^6, with reasons.","attain":"CO2-tagged marks analysed per student; 55% reached the threshold against a 60% target, triggering a CQI action."},"TE":{"co":"Analyze the causes of dyeing faults from process and test data (L4).","tl":"Case discussions using mill fault records; lab exercise reproducing uneven dyeing.","assess":"Assignment: from shade-variation data for three batches, identify probable causes (liquor ratio, temperature profile, pH) and justify.","attain":"CO3-tagged marks analysed per student; 70% reached the threshold against a 60% target."}},"cqiLoops":[{"name":"CO loop","freq":"Each semester","what":"CO assessment, analysis, then CQI action on CO setting and teaching-learning activities. Evidence: CO attainment sheet and faculty feedback report.","feedback":"Student feedback (course level)"},{"name":"PO loop","freq":"Every year","what":"PO assessment from mapped CO attainment and exit surveys, analysis, then CQI action on PO coverage and teaching-learning across courses.","feedback":"Faculty feedback (program level)"},{"name":"PEO loop","freq":"Every 3 years","what":"PEO assessment from graduates' real-field performance, analysis, then review of PEOs in light of the vision and mission.","feedback":"Alumni and employer feedback (job and field level)"}],"courseFile":["Course outline with CO statements, CO–PO mapping and assessment tools","Lecture plan and teaching-learning activities per CO","Question papers with each question tagged by CO and Bloom level","Marking schemes, model answers and rubrics","Sample answer scripts (best, average, weak)","CO-wise marks sheet","CO attainment calculation against the target","Lab, project or assignment reports with rubrics","Student course-end feedback summary","Faculty end-of-semester feedback with CQI actions","Follow-up on the previous semester's CQI actions"],"stakeholders":{"EEE":[["EEE engineers","Safe, accurate measurement and protection.","Want redundancy that finance sees as cost."],["CSE / IT staff","Secure, maintainable network and software.","Resist hundreds of new wireless devices on the campus network."],["Facility management","Low maintenance, easy fault location.","Prefer simple hardware over sophisticated sensing."],["Finance","Acceptable capital cost and payback.","Push to cut redundancy and security features."],["Students","Comfort, dashboards, no outages.","Want open data that conflicts with privacy."],["Safety personnel","No new electrical hazards.","Require conservative designs that raise cost."],["External utility","Power quality and approval of grid interaction.","Approval rules limit export and control options."]],"CSE":[["Doctors","Accurate, explainable recommendations.","Distrust black-box models that data scientists prefer for accuracy."],["Nurses","Fast, simple interface during busy shifts.","Want fewer fields than data quality requires."],["Patients","Privacy, fairness, safety.","Object to data sharing needed for model training."],["Hospital IT","Security, integration with existing records system.","Restrict cloud use that developers need."],["Hospital management","Cost control and liability protection.","Budget limits on GPUs and monitoring."],["Regulator / ethics board","Consent, auditability, data protection.","Approval timelines constrain release dates."],["Data scientists","Large, well-labelled datasets.","Labelling burden falls on clinicians."]],"TE":[["International buyer","Consistent shade, delivery time, compliance.","Tight lead times conflict with slower low-impact processes."],["Compliance auditor","Restricted-substance and wastewater compliance.","Require chemicals and testing that raise cost."],["Dyeing master","Right-first-time shade, simple process.","Resists recipe changes that risk reprocessing."],["Environmental engineer","Lower water, energy and effluent load.","Changes affect shade reproducibility."],["Workers","Safe handling of chemicals and heat.","Safety measures slow throughput."],["Mill management","Profit and capacity utilisation.","Capital limits on heat recovery and ETP upgrades."],["Local community","Clean river water and air.","Little direct voice in production decisions."]]},"tradeoffs":{"EEE":[["Low capital cost","High reliability","Redundant feeders, better sensors and backup communication all add cost."],["Fast sampling","Long battery life","Higher sampling and transmission drain sensor batteries quickly."],["Open data dashboards","Strong cybersecurity","Every exposed interface widens the attack surface."]],"CSE":[["Model accuracy","Explainability","The most accurate deep models are hardest for clinicians to interpret."],["Low cloud cost","Low latency","Edge or high-tier instances reduce latency but cost more."],["Rich data collection","Patient privacy","More features improve prediction but increase privacy risk."]],"TE":[["Right-first-time shade","Low water use","Lower liquor ratios save water but raise unlevel-dyeing risk."],["High throughput","Low energy use","Faster cycles need higher temperatures and more energy."],["Low chemical cost","Buyer compliance","Cheaper auxiliaries may contain restricted substances."]]},"cases":{"EEE":{"title":"Smart Campus Electrical Energy Monitoring System","html":"\u003cp>A university wants a system covering 10 buildings with real-time voltage and current monitoring, energy estimation, fault and anomaly detection, wireless communication, secure data access, low maintenance, acceptable cost, scalability and environmental robustness.\u003c/p>\u003cp>The team must integrate sensors, embedded systems, communication networks, signal processing, databases, analytics, electrical safety, power quality and cybersecurity.\u003c/p>"},"CSE":{"title":"AI/ML-Based Emergency Triage Support System","html":"\u003cp>A hospital wants a system that predicts patient urgency from vital signs and symptoms at the emergency desk, integrates with the existing patient-records system, runs on a cloud platform, protects patient data, explains its recommendations to clinicians, and stays available 24/7.\u003c/p>\u003cp>The team must integrate data pipelines, ML models, APIs, a clinician interface, security controls and monitoring, working with doctors, nurses, IT and an ethics board.\u003c/p>"},"TE":{"title":"Sustainable Knit Dyeing and Wastewater Reduction","html":"\u003cp>A knit-dyeing mill must cut water use by 30% and energy by 20% while keeping right-first-time shade above 90%, meeting buyer restricted-substance requirements, and keeping effluent within discharge limits.\u003c/p>\u003cp>The team must integrate dyeing-machine settings, recipe chemistry, chemical dosing, heat recovery and the effluent treatment plant, working with buyers, auditors, dyeing masters and management.\u003c/p>"}},"cepScenarios":{"EEE":{"title":"Wearable biomedical monitoring system","html":"\u003cp>A team proposes a wrist-worn monitor that detects irregular heart rhythm in elderly patients in rural clinics and alerts a health worker.\u003c/p>\u003cul>\u003cli>Biomedical signal processing must be developed from first principles because motion artefacts in field data are not handled by existing filters.\u003c/li>\u003cli>Battery life, detection accuracy and device cost conflict; a trade-off study is documented.\u003c/li>\u003cli>Clinicians, patients, health workers and an ethics committee are consulted.\u003c/li>\u003cli>Sensor, low-power wireless link, embedded firmware and cloud analytics must work together.\u003c/li>\u003cli>A missed alert could harm a patient; false alarms could overload health workers.\u003c/li>\u003c/ul>"},"CSE":{"title":"Intrusion detection for a bank's cloud platform","html":"\u003cp>A team must design an intrusion detection system for a mid-sized bank moving its services to a cloud platform.\u003c/p>\u003cul>\u003cli>Detection must handle attack patterns not present in public datasets, so the team formulates its own features and models.\u003c/li>\u003cli>Detection sensitivity, false-alarm rate, latency, cloud cost and customer privacy conflict.\u003c/li>\u003cli>Bank security staff, compliance officers, cloud provider, developers and customers have different needs.\u003c/li>\u003cli>Log collection, streaming pipeline, ML detector, alerting and incident response must work together.\u003c/li>\u003cli>A missed intrusion could expose thousands of customers' financial data.\u003c/li>\u003c/ul>"},"TE":{"title":"Computer-vision garment quality-control system","html":"\u003cp>A garment factory wants an automated inspection system that detects fabric and sewing defects on the production line.\u003c/p>\u003cul>\u003cli>Defect appearance varies with fabric type, colour and lighting, so the team must formulate an inspection model; existing inspection standards assume manual inspection.\u003c/li>\u003cli>Inspection speed, detection accuracy, line throughput and system cost conflict.\u003c/li>\u003cli>Quality managers, line supervisors, operators, buyers' QA teams and IT staff are involved.\u003c/li>\u003cli>Cameras, lighting, conveyor timing, the vision model and the factory's quality records must work together.\u003c/li>\u003cli>Missed defects risk shipment rejection; false rejects waste good garments.\u003c/li>\u003c/ul>"}},"evidenceDocs":[["Problem context","What is the real engineering problem?",{"EEE":"Ten buildings lack visibility of energy use and faults; outages are found only after complaints.","CSE":"Emergency desk triage is slow and inconsistent during peak hours.","TE":"The mill uses far more water and energy per kg of fabric than buyer targets allow."}],["Engineering knowledge","Which WK attributes are required?",{"EEE":"WK2, WK3, WK4, WK6, WK8.","CSE":"WK2, WK3, WK4, WK6, WK8, WK9.","TE":"WK1, WK3, WK4, WK5, WK6."}],["Complexity characteristics","Which WP attributes are present?",{"EEE":"WP1 (required) with WP2, WP6, WP7 evidenced.","CSE":"WP1 with WP2, WP3, WP5, WP6, WP7 evidenced.","TE":"WP1 with WP2, WP6, WP7 evidenced."}],["Activity characteristics","Which EA attributes are present?",{"EEE":"EA1, EA3, EA4.","CSE":"EA1, EA2, EA4.","TE":"EA1, EA2, EA3, EA4."}],["Requirements","What must the solution achieve?",{"EEE":"Real-time monitoring, anomaly detection within a defined time, secure access.","CSE":"Urgency prediction within 2 seconds, explanation for each prediction, 99.9% availability.","TE":"30% less water, 20% less energy, at least 90% right-first-time shade."}],["Constraints","What limits the solution?",{"EEE":"Fixed budget, campus IT policy, limited maintenance staff.","CSE":"Data-protection rules, existing records system, cloud budget.","TE":"Existing machines, capital budget, buyer chemical restrictions."}],["Trade-offs","Which requirements conflict?",{"EEE":"Sampling rate vs bandwidth and battery life; redundancy vs cost.","CSE":"Accuracy vs explainability; latency vs cost.","TE":"Lower liquor ratio vs levelness; speed vs energy."}],["Stakeholders","Who is affected?",{"EEE":"EEE, IT, facilities, finance, students, safety staff, utility.","CSE":"Doctors, nurses, patients, IT, management, ethics board.","TE":"Buyers, auditors, dyeing masters, workers, management, community."}],["Uncertainty","What is unknown or hard to predict?",{"EEE":"Load behaviour during partial outages; wireless reliability indoors.","CSE":"Model behaviour on patient groups under-represented in training data.","TE":"Effluent load variation with dye batch; shade response at low liquor ratio."}],["Alternatives","What solutions were considered?",{"EEE":"Wired metering, wireless nodes, hybrid design.","CSE":"Rule-based scoring, gradient boosting, deep learning.","TE":"Low-liquor-ratio machines, cold pad-batch, enzymatic pretreatment."}],["Engineering judgment","Why was one solution selected?",{"EEE":"Hybrid chosen for reliability on critical feeders at acceptable cost; recorded in a decision matrix.","CSE":"Gradient boosting with explanations chosen: near-best accuracy and interpretable for clinicians.","TE":"Enzymatic pretreatment plus heat recovery chosen: largest saving with least shade risk."}],["Validation","How was the solution tested?",{"EEE":"Pilot in two buildings; detection compared with logged events.","CSE":"Tested on held-out data from a second hospital; clinician review of explanations.","TE":"Pilot batches measured for water, energy, shade (ΔE) and fastness."}],["Consequences","What happens if it fails?",{"EEE":"Missed faults risk fire and outages; false alarms cause needless shutdowns.","CSE":"Under-triage could delay critical care; data breach harms patients.","TE":"Effluent breach pollutes the river; failed shade risks order cancellation."}]],"evidenceTable":[["Requires in-depth specialist engineering knowledge","WP1"],["Documented cost vs reliability trade-off","WP2"],["Novel modelling approach","WP3"],["Emerging application","WP4"],["Existing standards do not fully cover the configuration","WP5"],["Multiple disciplines and stakeholders","WP6"],["Multiple interconnected subsystems","WP7"],["Diverse people, data, equipment and software","EA1"],["Optimal resolution of conflicting issues","EA2"],["Research-based innovative solution","EA3"],["Safety, social or environmental consequences","EA4"],["New application of established principles","EA5"]],"modules":[{"id":"m1","number":1,"title":"Basic OBE and Bloom’s Taxonomy","description":"OBE fundamentals, PEOs, POs, COs, Bloom's Taxonomy, CO–PO mapping, assessment, attainment, CQI and documentation.","lessons":[{"id":"m1-l1","title":"What is Outcome-Based Education?","summary":"OBE designs curriculum, teaching and assessment around what students must be able to do.","body":"\u003cp class=\"lead\">Outcome-Based Education (OBE) starts from one question: \u003cstrong>what should students be able to do\u003c/strong> at the end of a course, at graduation, and a few years into their careers? Curriculum, teaching and assessment are then designed to produce those abilities, and to prove them with evidence.\u003c/p>\n\u003ch3>A snapshot of OBE\u003c/h3>\n\u003cp>Select each element to see how it fits.\u003c/p>\n\u003cdiv data-widget=\"obeSnapshot\">\u003c/div>\n\u003ch3>How outcomes are assessed\u003c/h3>\n\u003cdiv class=\"cols\">\u003cdiv class=\"box\">\u003ch4>Direct methods\u003c/h4>\u003cul>\u003cli>Course Outcomes (CO): each semester\u003c/li>\u003cli>Program Outcomes (PO): each semester, aggregated from COs\u003c/li>\u003cli>Program Educational Objectives (PEO): once in a cycle, from the real field performance of graduates\u003c/li>\u003c/ul>\u003c/div>\n\u003cdiv class=\"box\">\u003ch4>Indirect methods\u003c/h4>\u003cul>\u003cli>Surveys among stakeholders: students, alumni, employers and faculty\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\n\u003ch3>What this looks like in your department\u003c/h3>{{DEPT}}","dept":{"EEE":"\u003cp>An EEE program does not stop at \"we taught Power Systems\". It asks whether students can, for example, \u003cem>analyze a fault in a distribution network\u003c/em>, and keeps marked scripts, CO-wise marks and attainment results as proof.\u003c/p>","CSE":"\u003cp>A CSE program does not stop at \"we taught Data Structures\". It asks whether students can, for example, \u003cem>implement and analyze graph algorithms for a real application\u003c/em>, and keeps code, test results and CO-wise marks as proof.\u003c/p>","TE":"\u003cp>A Textile Engineering program does not stop at \"we taught Wet Processing\". It asks whether students can, for example, \u003cem>calculate a dye recipe for a specified shade and diagnose dyeing faults\u003c/em>, and keeps lab reports, test results and CO-wise marks as proof.\u003c/p>"},"questions":[{"id":"m1l1-a","dept":"ALL","type":"mcq","question":"Which statement best describes Outcome-Based Education?","options":["Teaching is organised around completing the textbook","Curriculum, teaching and assessment are designed around what students must be able to demonstrate","Students are ranked against each other each semester","Course content is decided by available lab equipment"],"correctAnswer":1,"explanation":"OBE begins with intended outcomes and designs curriculum, teaching and assessment backwards from them.","topic":"OBE fundamentals"},{"id":"m1l1-b","dept":"ALL","type":"mcq","question":"According to the OBE assessment cycle, how is PEO attainment assessed?","options":["Every quiz, using CO marks","Once in a cycle, using the real field performance of graduates","Only through the final examination","It is never assessed"],"correctAnswer":1,"explanation":"PEOs describe graduates' accomplishments in their careers, so they are assessed once in a cycle using field performance, typically through alumni and employer feedback.","topic":"OBE fundamentals"},{"id":"m1l1-c","dept":"ALL","type":"tf","question":"True or false: a survey of alumni and employers is an indirect method of outcome assessment.","options":["True","False"],"correctAnswer":0,"explanation":"Surveys collect perceptions from stakeholders, so they are indirect. Direct methods examine students' actual work.","topic":"Assessment"},{"id":"m1l1-eee","dept":"EEE","type":"mcq","question":"An EEE department reports: “We covered all chapters of the power systems syllabus this semester, so our goals were achieved.” What is the OBE response?","options":["Agree: full coverage proves achievement","Coverage is an input; OBE asks whether students can demonstrate abilities such as fault analysis, shown by CO-wise assessment evidence","Ask for more chapters to be added","Ask for the textbook to be changed"],"correctAnswer":1,"explanation":"OBE judges success by demonstrated outcomes with evidence, not by syllabus coverage.","topic":"OBE fundamentals"},{"id":"m1l1-cse","dept":"CSE","type":"mcq","question":"A CSE department measures its success by the number of programming languages taught. Which evidence would OBE prefer?","options":["A longer list of languages","Assessed evidence that graduates can design, implement and test software solutions, such as project code, test reports and CO attainment","The number of computers in the lab","Student attendance rates"],"correctAnswer":1,"explanation":"OBE values evidence of what students can do, such as assessed project work, over counts of inputs.","topic":"OBE fundamentals"},{"id":"m1l1-te","dept":"TE","type":"mcq","question":"A Textile Engineering department reports the number of hours students spent in the dyeing lab. Which would better show an OBE outcome?","options":["More lab hours next semester","Rubric-assessed evidence that students can formulate a dye recipe that meets a specified shade and fastness requirement","A list of machines in the lab","The number of lab manuals printed"],"correctAnswer":1,"explanation":"Lab hours are inputs; a rubric-assessed recipe that meets specifications demonstrates the outcome.","topic":"OBE fundamentals"}]},{"id":"m1-l2","title":"Traditional education vs OBE, and why OBE matters","summary":"OBE shifts the focus from teaching content to demonstrating student learning.","body":"\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">Aspect\u003c/th>\u003cth scope=\"col\">Traditional education\u003c/th>\u003cth scope=\"col\">Outcome-Based Education\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Starting point\u003c/td>\u003ctd>Syllabus and textbook\u003c/td>\u003ctd>Intended outcomes\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>What the teacher covers\u003c/td>\u003ctd>What the student can do\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Success measured by\u003c/td>\u003ctd>Marks and syllabus completion\u003c/td>\u003ctd>Attainment of COs, POs and PEOs\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Assessment\u003c/td>\u003ctd>Mostly end-of-term exams\u003c/td>\u003ctd>Varied tools aligned with outcomes and Bloom levels\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Improvement\u003c/td>\u003ctd>Occasional, informal\u003c/td>\u003ctd>Continuous Quality Improvement (CQI) with evidence\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Accountability\u003c/td>\u003ctd>Limited documentation\u003c/td>\u003ctd>Course files, mapping, attainment records\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>Why OBE is important\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Accreditation and recognition:\u003c/strong> BAETE accreditation is outcome-based, and outcome-based accreditation underpins international recognition of engineering degrees through the Washington Accord.\u003c/li>\n\u003cli>\u003cstrong>Employability:\u003c/strong> outcomes are set with input from employers and alumni, so graduates develop abilities the profession needs.\u003c/li>\n\u003cli>\u003cstrong>Clarity for students:\u003c/strong> students know what they are expected to be able to do and how it will be assessed.\u003c/li>\n\u003cli>\u003cstrong>Improvement with evidence:\u003c/strong> attainment data shows where teaching works and where it needs to change.\u003c/li>\u003c/ul>\n\u003ch3>Good practice in your department\u003c/h3>{{DEPT}}","dept":{"EEE":"\u003cp>In Electrical Machines, instead of only examining derivations, a course states the CO \"Analyze the performance of an induction motor from no-load and blocked-rotor test data\", runs the lab test, and assesses with both a lab report rubric and an exam question requiring analysis of test data.\u003c/p>","CSE":"\u003cp>In Software Engineering, instead of only examining process definitions, a course states the CO \"Develop and test a web application following a documented design\", and assesses with code review, automated test results and a rubric for the design document.\u003c/p>","TE":"\u003cp>In Textile Testing, instead of only examining test definitions, a course states the CO \"Evaluate the colour fastness of dyed samples against standard test results\", and assesses with a lab report scored on a rubric and grey-scale ratings recorded for each sample.\u003c/p>"},"questions":[{"id":"m1l2-a","dept":"ALL","type":"match","question":"Match each feature to the approach it belongs to.","options":["Traditional","OBE"],"correctAnswer":null,"explanation":"Coverage and marks reflect a traditional approach; outcomes, evidence and CQI reflect OBE.","topic":"OBE fundamentals","items":[{"prompt":"Success measured by syllabus completion","answer":0},{"prompt":"Assessment aligned with Bloom level of each CO","answer":1},{"prompt":"Improvement driven by attainment evidence","answer":1},{"prompt":"Teacher-centred delivery of content","answer":0}]},{"id":"m1l2-b","dept":"ALL","type":"tf","question":"True or false: in OBE, the teacher's main responsibility is to finish the syllabus on time.","options":["True","False"],"correctAnswer":1,"explanation":"Covering content matters, but OBE's responsibility is ensuring students attain the outcomes and showing evidence of it.","topic":"OBE fundamentals"},{"id":"m1l2-c","dept":"ALL","type":"mcq","question":"Which is the strongest reason OBE matters for an engineering program in Bangladesh?","options":["It reduces the number of exams","BAETE accreditation is outcome-based, which supports national and international recognition of the degree","It removes the need for course files","It allows teachers to skip difficult topics"],"correctAnswer":1,"explanation":"Outcome-based accreditation is the basis for program recognition, including through the Washington Accord.","topic":"OBE fundamentals"},{"id":"m1l2-eee","dept":"EEE","type":"mcq","question":"Which Electrical Machines practice is most consistent with OBE?","options":["Teach induction motor theory and examine only derivations","State a CO to analyze induction motor performance from test data, then assess it with a lab-report rubric and an exam question requiring analysis of test data","Skip the lab because the theory exam is enough","Grade students only on attendance"],"correctAnswer":1,"explanation":"The CO is measurable and the assessments directly test the stated ability.","topic":"Assessment"},{"id":"m1l2-cse","dept":"CSE","type":"mcq","question":"Which Software Engineering practice is most consistent with OBE?","options":["Lecture on process models and set a definitions exam","State a CO to develop and test a web application from a documented design, assessed by code review, test results and a design rubric","Give marks only for the final demo","Let students choose any topic with no criteria"],"correctAnswer":1,"explanation":"The CO is measurable and assessed through aligned evidence of the ability.","topic":"Assessment"},{"id":"m1l2-te","dept":"TE","type":"mcq","question":"Which Textile Testing practice is most consistent with OBE?","options":["Ask students to memorise the names of fastness tests","State a CO to evaluate colour fastness against standard results, assessed by a rubric-scored lab report with recorded grey-scale ratings","Skip testing because it is time-consuming","Assess only by a viva with no criteria"],"correctAnswer":1,"explanation":"The CO names an observable ability and the assessment records evidence of it.","topic":"Assessment"}]},{"id":"m1-l3","title":"Vision, Mission and Program Educational Objectives (PEOs)","summary":"PEOs describe what graduates achieve a few years after graduation, consistent with the mission.","body":"\u003cdiv class=\"cols\">\u003cdiv class=\"box\">\u003ch4>Vision\u003c/h4>\u003cp>Where the institution or program aspires to be in the long term.\u003c/p>\u003c/div>\n\u003cdiv class=\"box\">\u003ch4>Mission\u003c/h4>\u003cp>How the institution or program will work towards the vision: its purpose, priorities and approach.\u003c/p>\u003c/div>\n\u003cdiv class=\"box\">\u003ch4>Program Educational Objectives (PEOs)\u003c/h4>\u003cp>Broad statements of the career and professional accomplishments graduates are expected to attain within a few years of graduation.\u003c/p>\u003c/div>\u003c/div>\n\u003ch3>PEO, PO and CO compared\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">Level\u003c/th>\u003cth scope=\"col\">Describes\u003c/th>\u003cth scope=\"col\">Time horizon\u003c/th>\u003cth scope=\"col\">Typical evidence\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>PEO\u003c/td>\u003ctd>Career accomplishments\u003c/td>\u003ctd>A few years after graduation\u003c/td>\u003ctd>Alumni and employer feedback; career progress\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>PO\u003c/td>\u003ctd>Abilities at graduation\u003c/td>\u003ctd>End of the program\u003c/td>\u003ctd>Aggregated CO attainment; exit surveys\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>CO\u003c/td>\u003ctd>Abilities after one course\u003c/td>\u003ctd>End of the course\u003c/td>\u003ctd>CO-tagged assessments\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>Good PEOs\u003c/h3>\n\u003cul>\u003cli>are consistent with the mission and the needs of stakeholders;\u003c/li>\u003cli>are developed and reviewed with alumni, employers, faculty and students;\u003c/li>\u003cli>describe accomplishments, not course-level skills;\u003c/li>\u003cli>are reviewed once in a cycle (for example every 3 years).\u003c/li>\u003c/ul>\n\u003ch3>Example PEOs for your department\u003c/h3>{{DEPT}}","dept":{"EEE":"\u003cul>\u003cli>Graduates will practise as competent engineers in power, electronics, telecommunication or ICT sectors, solving real problems responsibly.\u003c/li>\u003cli>Graduates will pursue higher studies, research or professional development.\u003c/li>\u003cli>Graduates will take leadership roles and contribute to sustainable development of the energy and technology sectors.\u003c/li>\u003c/ul>","CSE":"\u003cul>\u003cli>Graduates will build successful careers in software, data, security or research organisations.\u003c/li>\u003cli>Graduates will continue learning to keep pace with rapidly changing computing technologies.\u003c/li>\u003cli>Graduates will act ethically and contribute to digital inclusion and society.\u003c/li>\u003c/ul>","TE":"\u003cul>\u003cli>Graduates will hold technical and managerial roles in the textile and apparel industry.\u003c/li>\u003cli>Graduates will lead the adoption of sustainable and compliant manufacturing practices.\u003c/li>\u003cli>Graduates will pursue higher studies, research or entrepreneurship in textiles.\u003c/li>\u003c/ul>"},"questions":[{"id":"m1l3-a","dept":"ALL","type":"mcq","question":"What do Program Educational Objectives (PEOs) describe?","options":["What students can do after one course","Career and professional accomplishments graduates are expected to attain within a few years of graduation","The topics in the syllabus","The number of credits in the program"],"correctAnswer":1,"explanation":"PEOs look beyond graduation to graduates' accomplishments in their careers.","topic":"PEO"},{"id":"m1l3-b","dept":"ALL","type":"match","question":"Match each statement to its level.","options":["Vision","Mission","PEO"],"correctAnswer":null,"explanation":"Vision is the long-term aspiration, mission is how it will be pursued, PEOs are graduates' career accomplishments.","topic":"PEO","items":[{"prompt":"To be a leading centre of engineering education in the region","answer":0},{"prompt":"To provide quality education through outcome-based curricula, research and industry partnership","answer":1},{"prompt":"Graduates will hold leadership roles in industry within five years","answer":2}]},{"id":"m1l3-c","dept":"ALL","type":"mcq","question":"Which is the best source of evidence for PEO attainment?","options":["Midterm marks","Alumni and employer feedback on graduates' career performance","Attendance sheets","Course outlines"],"correctAnswer":1,"explanation":"PEO evidence comes from the field: alumni and employer feedback and graduates' career progress.","topic":"PEO"},{"id":"m1l3-eee","dept":"EEE","type":"mcq","question":"Which statement is a properly written PEO for an EEE program?","options":["Graduates will be able to calculate per-unit impedance","Within a few years of graduation, graduates will practise as competent engineers in power, electronics or ICT sectors, or pursue higher studies","Students will understand transformers","Students will complete 160 credits"],"correctAnswer":1,"explanation":"The other options are course-level abilities or requirements, not career accomplishments.","topic":"PEO"},{"id":"m1l3-cse","dept":"CSE","type":"mcq","question":"Which statement is a properly written PEO for a CSE program?","options":["Graduates will write SQL queries","Graduates will build successful careers in software, data or security organisations and continue learning new technologies","Students will pass Data Structures","Students will use Python"],"correctAnswer":1,"explanation":"Writing SQL queries is a course-level skill; PEOs describe career accomplishments.","topic":"PEO"},{"id":"m1l3-te","dept":"TE","type":"mcq","question":"Which statement is a properly written PEO for a Textile Engineering program?","options":["Graduates will calculate yarn count","Graduates will hold technical and managerial roles in the textile and apparel industry and lead sustainable manufacturing practices","Students will attend the weaving lab","Students will define GSM"],"correctAnswer":1,"explanation":"Calculating yarn count is a CO-level ability; PEOs describe career accomplishments.","topic":"PEO"}]},{"id":"m1-l4","title":"Program Outcomes (POs)","summary":"POs state what students must be able to do by the time they graduate.","body":"\u003cp class=\"lead\">Program Outcomes (POs) describe the knowledge, skills and attitudes students must attain by graduation. BAETE defines the PO set, based on the International Engineering Alliance graduate attributes.\u003c/p>\n\u003cp>PO areas include engineering knowledge, problem analysis, design and development of solutions, investigation, modern tool usage, the engineer and society, environment and sustainability, ethics, individual and team work, communication, project management and finance, and lifelong learning. Check the current BAETE manual for the exact wording and numbering used by your program.\u003c/p>\n\u003cdiv class=\"cols\">\u003cdiv class=\"box\">\u003ch4>How POs are attained\u003c/h4>\u003cp>No single course delivers all POs. Each course contributes through its COs, and the program checks that every PO is developed and assessed across the curriculum.\u003c/p>\u003c/div>\n\u003cdiv class=\"box\">\u003ch4>How POs are assessed\u003c/h4>\u003cp>Directly, by aggregating the attainment of COs mapped to each PO (each semester). Indirectly, through exit, alumni and employer surveys.\u003c/p>\u003c/div>\u003c/div>\n\u003ch3>PO examples from your department\u003c/h3>{{DEPT}}","dept":{"EEE":"\u003cul>\u003cli>\u003cstrong>Problem analysis:\u003c/strong> EEE317 Power Systems I maps all four COs, such as fault and stability analysis, to PO2.\u003c/li>\u003cli>\u003cstrong>Investigation:\u003c/strong> a power-quality lab where students design experiments on harmonic distortion and interpret data.\u003c/li>\u003cli>\u003cstrong>Design:\u003c/strong> the final-year design project.\u003c/li>\u003c/ul>","CSE":"\u003cul>\u003cli>\u003cstrong>Problem analysis:\u003c/strong> Data Structures CO2, analyzing time and space complexity.\u003c/li>\u003cli>\u003cstrong>Individual and team work:\u003c/strong> a mobile app project with assigned roles and peer evaluation.\u003c/li>\u003cli>\u003cstrong>Modern tool usage:\u003c/strong> version control, testing frameworks and profiling tools.\u003c/li>\u003c/ul>","TE":"\u003cul>\u003cli>\u003cstrong>Problem analysis:\u003c/strong> analyzing causes of dyeing faults from process data.\u003c/li>\u003cli>\u003cstrong>Environment and sustainability:\u003c/strong> assessing the effluent impact of reactive dyeing and proposing reductions.\u003c/li>\u003cli>\u003cstrong>Investigation:\u003c/strong> designing experiments to compare fabric shrinkage under different finishes.\u003c/li>\u003c/ul>"},"questions":[{"id":"m1l4-a","dept":"ALL","type":"mcq","question":"What do Program Outcomes describe?","options":["What students should be able to do by graduation","Topics in one course","Graduates' careers five years later","Faculty qualifications"],"correctAnswer":0,"explanation":"POs are attained by graduation; PEOs describe later career accomplishments.","topic":"PO"},{"id":"m1l4-b","dept":"ALL","type":"tf","question":"True or false: every course should map to and assess all POs.","options":["True","False"],"correctAnswer":1,"explanation":"Each course contributes to the POs it genuinely develops. Program-level mapping ensures all POs are covered across the curriculum.","topic":"PO"},{"id":"m1l4-c","dept":"ALL","type":"mcq","question":"How is PO attainment usually computed directly?","options":["From attendance","By aggregating attainment of the COs mapped to that PO across courses","From the number of courses offered","From faculty publications"],"correctAnswer":1,"explanation":"Direct PO attainment is built up from mapped CO attainment.","topic":"PO"},{"id":"m1l4-eee","dept":"EEE","type":"mcq","question":"In a power-quality lab, students design experiments on harmonic distortion, collect data and interpret the results. Which PO area is most directly developed?","options":["Engineering knowledge","Problem analysis","Design/development of solutions","Investigation","Modern tool usage","Environment and sustainability","Individual and team work","Communication"],"correctAnswer":3,"explanation":"Designing experiments and interpreting data is investigation.","topic":"PO"},{"id":"m1l4-cse","dept":"CSE","type":"mcq","question":"Students build a mobile app in teams of four, with assigned roles and peer evaluation of each member's contribution. Which PO area is most directly developed?","options":["Engineering knowledge","Problem analysis","Design/development of solutions","Investigation","Modern tool usage","E
