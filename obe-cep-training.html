nvironment and sustainability","Individual and team work","Communication"],"correctAnswer":6,"explanation":"Assigned roles with peer evaluation directly develop and evidence individual and team work.","topic":"PO"},{"id":"m1l4-te","dept":"TE","type":"mcq","question":"Students assess the effluent impact of a reactive dyeing process and propose ways to reduce water and chemical load. Which PO area is most directly developed?","options":["Engineering knowledge","Problem analysis","Design/development of solutions","Investigation","Modern tool usage","Environment and sustainability","Individual and team work","Communication"],"correctAnswer":5,"explanation":"Assessing environmental impact and proposing reductions is environment and sustainability.","topic":"PO"}]},{"id":"m1-l5","title":"Bloom’s Taxonomy for OBE","summary":"Six cognitive levels, from Remember to Create, used to write COs and set assessments.","body":"\u003cp class=\"lead\">Bloom's Taxonomy is a tool for describing the level of thinking a learning outcome or question requires. It was proposed in 1956 by a group led by educational psychologist Benjamin Bloom; the revised version, published in 2001 by Anderson and Krathwohl, is used today.\u003c/p>\n\u003cdiv class=\"cols\">\u003cdiv class=\"box\">\u003ch4>Cognitive domain\u003c/h4>\u003cp>Knowledge-based: thinking and reasoning. Most COs in engineering courses sit here.\u003c/p>\u003c/div>\n\u003cdiv class=\"box\">\u003ch4>Psychomotor domain\u003c/h4>\u003cp>Action-based (hard skills): handling instruments, machines and tools in labs and workshops.\u003c/p>\u003c/div>\n\u003cdiv class=\"box\">\u003ch4>Affective domain\u003c/h4>\u003cp>Emotion-based (soft skills): values, attitudes, ethics, teamwork.\u003c/p>\u003c/div>\u003c/div>\n\u003ch3>The revised cognitive levels\u003c/h3>\n\u003cp>The revision changed the level names from nouns to verbs (Knowledge became Remember; Synthesis became Create and moved to the top). Select a level to see its meaning, typical verbs and examples. L1 to L3 are often called lower-order and L4 to L6 higher-order thinking.\u003c/p>\n\u003cdiv data-widget=\"bloomLadder\">\u003c/div>\n\u003cdiv class=\"note\">\u003cstrong>Tip:\u003c/strong> the level is decided by the thinking required, not by the verb alone. \"Compare\" can be Understand (state differences) or Analyze (examine causes and relationships). Always ask what the student has to do.\u003c/div>","dept":{"EEE":"","CSE":"","TE":""},"questions":[{"id":"m1l5-a","dept":"ALL","type":"mcq","question":"Which Bloom level is defined as “justifying a decision or course of action”?","options":["Remember","Understand","Apply","Analyze","Evaluate","Create"],"correctAnswer":4,"explanation":"Evaluate means making and justifying judgments against criteria.","topic":"Bloom's Taxonomy"},{"id":"m1l5-b","dept":"ALL","type":"match","question":"Match each KVL task to its Bloom level.","options":["Remember","Understand","Apply","Analyze","Evaluate","Create"],"correctAnswer":null,"explanation":"Define is Remember, Explain is Understand, Calculate is Apply, Analyze a multi-loop circuit is Analyze, Evaluate and justify is Evaluate, Design is Create.","topic":"Bloom's Taxonomy","items":[{"prompt":"Define Kirchhoff's Voltage Law","answer":0},{"prompt":"Explain the significance of KVL","answer":1},{"prompt":"Calculate an unknown voltage using KVL","answer":2},{"prompt":"Analyze a multi-loop circuit using KVL","answer":3},{"prompt":"Evaluate two circuit designs and justify the more appropriate one","answer":4},{"prompt":"Design a circuit that meets a specified set of requirements","answer":5}]},{"id":"m1l5-c","dept":"ALL","type":"tf","question":"True or false: the affective domain is concerned with values, attitudes and soft skills such as ethics and teamwork.","options":["True","False"],"correctAnswer":0,"explanation":"The affective domain is emotion-based; the psychomotor domain covers hands-on skills.","topic":"Bloom's Taxonomy"},{"id":"m1l5-eee","dept":"EEE","type":"pick","question":"“Calculate the voltage across R3 in the given circuit using KVL.” Which Bloom level is this?","options":["Remember","Understand","Apply","Analyze","Evaluate","Create"],"correctAnswer":2,"explanation":"Using a known law in a familiar situation to compute a value is Apply.","topic":"Bloom's Taxonomy"},{"id":"m1l5-cse","dept":"CSE","type":"pick","question":"“Explain why a hash table offers average O(1) lookup time.” Which Bloom level is this?","options":["Remember","Understand","Apply","Analyze","Evaluate","Create"],"correctAnswer":1,"explanation":"Explaining an idea is Understand; no new problem is being solved.","topic":"Bloom's Taxonomy"},{"id":"m1l5-te","dept":"TE","type":"pick","question":"“Compare ring-spun and rotor-spun yarns and examine why their strength and evenness differ.” Which Bloom level is this?","options":["Remember","Understand","Apply","Analyze","Evaluate","Create"],"correctAnswer":3,"explanation":"Examining causes and relationships, not just listing differences, is Analyze.","topic":"Bloom's Taxonomy"}]},{"id":"m1-l6","title":"Course Outcomes (COs)","summary":"COs are specific, measurable statements of what students can do after a course.","body":"\u003cblockquote class=\"verbatim\">A Course Outcome (CO) is a specific statement that describes what a student is expected to learn or be able to do after completing a course. Outcomes are typically measurable and aligned with program outcomes.\u003c/blockquote>\n\u003cul>\u003cli>\u003cstrong>Specific and documentable:\u003c/strong> clear enough to assess, and recorded in the course outline.\u003c/li>\u003cli>\u003cstrong>Skill-oriented:\u003c/strong> knowledge gained, skills developed or attitudes formed.\u003c/li>\u003cli>\u003cstrong>Measurable:\u003c/strong> begins with an observable action verb at a stated Bloom level.\u003c/li>\u003cli>\u003cstrong>Aligned:\u003c/strong> mapped to one or more POs and assessed at least once.\u003c/li>\u003c/ul>\n\u003ch3>Anatomy of a CO\u003c/h3>\n\u003cp>\u003cspan class=\"tag\">Action verb\u003c/span> + \u003cspan class=\"tag\">Content\u003c/span> + \u003cspan class=\"tag\">Condition (optional)\u003c/span> + \u003cspan class=\"tag\">Standard (optional)\u003c/span>\u003c/p>\n\u003cp>Example: \u003cem>\u003cstrong>Calculate\u003c/strong> the dye and chemical recipe \u003cstrong>for a specified shade and liquor ratio\u003c/strong> \u003cstrong>within ±5% of the target quantities\u003c/strong>.\u003c/em>\u003c/p>\n\u003cp>Most courses have 3 to 6 COs. Try building one:\u003c/p>\n\u003cdiv data-widget=\"coBuilder\">\u003c/div>\n\u003ch3>Course outcomes from your department\u003c/h3>{{DEPT}}","dept":{"EEE":"\u003cp>\u003cstrong>EEE317 Power Systems I\u003c/strong>\u003c/p>\u003cul>\u003cli>CO2: Apply numerical methods for the load flow study in power systems.\u003c/li>\u003cli>CO3: Analyze symmetrical and unsymmetrical faults in power systems.\u003c/li>\u003cli>CO4: Analyze the stability of power systems.\u003c/li>\u003c/ul>","CSE":"\u003cp>\u003cstrong>Data Structures\u003c/strong>\u003c/p>\u003cul>\u003cli>CO1: Apply basic data structures like arrays, stacks, queues and linked lists in solving problems.\u003c/li>\u003cli>CO2: Analyze the time and space complexity of algorithms.\u003c/li>\u003cli>CO3: Implement tree and graph algorithms for real-world applications.\u003c/li>\u003c/ul>","TE":"\u003cp>\u003cstrong>Textile Wet Processing\u003c/strong>\u003c/p>\u003cul>\u003cli>CO2: Calculate dye and chemical recipes for a specified shade and liquor ratio.\u003c/li>\u003cli>CO3: Analyze the causes of dyeing faults from process and test data.\u003c/li>\u003cli>CO4: Evaluate the environmental impact of a dyeing process and propose improvements.\u003c/li>\u003c/ul>"},"questions":[{"id":"m1l6-a","dept":"ALL","type":"mcq","question":"Which is the best description of a Course Outcome?","options":["A list of chapters in the course","A specific, measurable statement of what a student can do after completing the course","The teacher's lesson plan","The grading policy"],"correctAnswer":1,"explanation":"A CO describes student ability after the course, measurably.","topic":"CO"},{"id":"m1l6-b","dept":"ALL","type":"mcq","question":"“Students will learn about transformers.” What is the main weakness of this CO?","options":["It is too short","It has no measurable action verb, so attainment cannot be assessed","It mentions a topic","It should say 'motors' instead"],"correctAnswer":1,"explanation":"\"Learn about\" is not observable. Replace it with a verb such as calculate, analyze or design.","topic":"CO"},{"id":"m1l6-c","dept":"ALL","type":"tf","question":"True or false: each CO should be mapped to at least one PO and assessed at least once.","options":["True","False"],"correctAnswer":0,"explanation":"An unmapped or unassessed CO cannot contribute evidence to attainment.","topic":"CO"},{"id":"m1l6-eee","dept":"EEE","type":"mcq","question":"Which is the best CO for Power Systems I?","options":["Know load flow","Apply the Newton-Raphson method to solve the load-flow problem of a power network","Understand power systems","Learn about faults"],"correctAnswer":1,"explanation":"It has a measurable verb (Apply) and specific content.","topic":"CO"},{"id":"m1l6-cse","dept":"CSE","type":"mcq","question":"Which is the best CO for Data Structures?","options":["Be familiar with trees","Know about graphs","Analyze the time and space complexity of algorithms","Learn sorting"],"correctAnswer":2,"explanation":"\"Analyze the time and space complexity of algorithms\" is measurable and specific.","topic":"CO"},{"id":"m1l6-te","dept":"TE","type":"mcq","question":"Which is the best CO for Yarn Manufacturing?","options":["Know about spinning","Calculate the draft and twist required to produce a yarn of a specified count","Understand ring frames","Be aware of yarn faults"],"correctAnswer":1,"explanation":"It names an observable action, specific content and a condition (specified count).","topic":"CO"}]},{"id":"m1-l7","title":"Writing COs with Bloom’s verbs: weak vs strong","summary":"Choose observable verbs at the right level, and avoid the common mistakes.","body":"\u003ch3>Action verbs by level (examples)\u003c/h3>\u003cdiv data-widget=\"verbTable\">\u003c/div>\n\u003cdiv class=\"cols\">\u003cdiv class=\"box\">\u003ch4>Weak CO\u003c/h4>\u003cp>\"Students will \u003cstrong>understand\u003c/strong> motor control.\"\u003c/p>\u003cp>Not observable; no level; no clear assessment.\u003c/p>\u003c/div>\n\u003cdiv class=\"box\">\u003ch4>Strong CO\u003c/h4>\u003cp>\"\u003cstrong>Design\u003c/strong> a closed-loop speed controller for a DC motor that meets a specified settling time.\"\u003c/p>\u003cp>Observable; Create level; points directly to a design assessment.\u003c/p>\u003c/div>\u003c/div>\n\u003ch3>Common mistakes in selecting Bloom's verbs\u003c/h3>\n\u003col>\u003cli>\u003cstrong>Unmeasurable verbs:\u003c/strong> know, understand, learn, appreciate, be familiar with.\u003c/li>\n\u003cli>\u003cstrong>Several verbs at different levels in one CO:\u003c/strong> \"Understand and design a filter\" cannot be assessed cleanly. Use one main verb.\u003c/li>\n\u003cli>\u003cstrong>Level mismatch with assessment:\u003c/strong> the CO says Design, the exam asks Define.\u003c/li>\n\u003cli>\u003cstrong>Level too low for the course stage:\u003c/strong> a final-year design course with only Remember-level COs.\u003c/li>\n\u003cli>\u003cstrong>Level inflation:\u003c/strong> a first-year course claiming Create for every CO.\u003c/li>\n\u003cli>\u003cstrong>Verbs that appear at more than one level\u003c/strong> (Compare, Contrast, Demonstrate) used without stating the intended level. State the level and make the assessment match it.\u003c/li>\n\u003cli>\u003cstrong>Topic lists instead of outcomes:\u003c/strong> \"Load flow, faults, stability.\"\u003c/li>\u003c/ol>\n\u003ch3>Check a CO\u003c/h3>\u003cp>Type or paste a CO. The checker looks for Bloom verbs and common problems. It is a guide, not a judge: the level depends on what students actually do.\u003c/p>\n\u003cdiv data-widget=\"coChecker\">\u003c/div>","dept":{"EEE":"","CSE":"","TE":""},"questions":[{"id":"m1l7-a","dept":"ALL","type":"multi","question":"Which verbs are hard to measure and should be avoided as the main verb of a CO? Select all that apply.","options":["Understand","Calculate","Know","Design","Appreciate","Analyze"],"correctAnswer":[0,2,4],"explanation":"Understand, know and appreciate describe internal states that cannot be observed directly.","topic":"CO"},{"id":"m1l7-b","dept":"ALL","type":"mcq","question":"A CO reads: “Understand and design an active filter.” What is the main problem?","options":["It is too specific","It combines two verbs at different Bloom levels, so it cannot be assessed cleanly","Filters are not allowed in COs","It should use 'know' instead"],"correctAnswer":1,"explanation":"Use one main verb at the intended level, here Design (Create).","topic":"Bloom's Taxonomy"},{"id":"m1l7-c","dept":"ALL","type":"tf","question":"True or false: verbs such as “compare” can sit at more than one Bloom level, so the intended level should be stated and the assessment designed to match.","options":["True","False"],"correctAnswer":0,"explanation":"Compare can be Understand or Analyze depending on depth.","topic":"Bloom's Taxonomy"},{"id":"m1l7-eee","dept":"EEE","type":"mcq","question":"Which is the best rewrite of “Students will understand motor control” for a final-year course?","options":["Students will know motor control","Design a closed-loop speed controller for a DC motor that meets a specified settling time","Students will appreciate motors","List types of motors"],"correctAnswer":1,"explanation":"It is observable, at an appropriate level for a final-year course, and points to a design assessment.","topic":"CO"},{"id":"m1l7-cse","dept":"CSE","type":"mcq","question":"Which is the best rewrite of “Students will know cybersecurity”?","options":["Students will be aware of hackers","Analyze a web application for common vulnerabilities and recommend mitigations","Students will learn security","Define the word 'malware'"],"correctAnswer":1,"explanation":"\"Analyze ... and recommend\" is observable, specific and assessable.","topic":"CO"},{"id":"m1l7-te","dept":"TE","type":"mcq","question":"Which is the best rewrite of “Students will learn about garment quality”?","options":["Students will be familiar with defects","Evaluate garment defects against AQL sampling plans and justify accept or reject decisions","Students will understand quality","Name three defects"],"correctAnswer":1,"explanation":"\"Evaluate ... and justify\" is observable, at Evaluate level, and specific.","topic":"CO"}]},{"id":"m1-l8","title":"Bloom level, assessment and alignment","summary":"Assessment questions must match the Bloom level of the CO they claim to measure.","body":"\u003ch3>Choosing assessment tools by level\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">Bloom level\u003c/th>\u003cth scope=\"col\">Appropriate assessment tools\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Higher order: Create, Evaluate, Analyze\u003c/td>\u003ctd>Lab projects, mini projects, Final Year Design Project, assignments, case studies, internship\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Lower order: Apply, Understand, Remember\u003c/td>\u003ctd>Time-bound exams: quiz/class test, midterm, final\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Assessment tools fall into two groups: \u003cstrong>time-bound\u003c/strong> (quiz/CT, midterm, final) and \u003cstrong>open-ended\u003c/strong> (assignment, course project, term paper, case study, FYDP). Higher-order outcomes usually need open-ended work, though well-designed exam questions can test Analyze.\u003c/p>\n\u003cdiv class=\"principle\">\u003cp>Positive alignment: each CO statement and the questions that assess it should use action verbs at the same level.\u003c/p>\u003c/div>\n\u003ch3>The alignment chain\u003c/h3>\u003cp>Select each stage to see an example from your department.\u003c/p>\n\u003cdiv data-widget=\"alignmentChain\">\u003c/div>\n\u003cdiv class=\"caution\">\u003cstrong>Misalignment:\u003c/strong> a CO says \"Analyze faults\", but every exam question asks students to \"Define\" or \"List\". The marks cannot show the Analyze-level ability was attained.\u003c/div>","dept":{"EEE":"","CSE":"","TE":""},"questions":[{"id":"m1l8-a","dept":"ALL","type":"mcq","question":"Which assessment tool is most appropriate for a Create-level CO?","options":["A 10-minute recall quiz","A mini project or design project assessed with a rubric","A true/false test","Attendance"],"correctAnswer":1,"explanation":"Create-level outcomes need open-ended work where students produce a design.","topic":"Assessment"},{"id":"m1l8-b","dept":"ALL","type":"tf","question":"True or false: a Remember-level quiz question can provide valid evidence for a Create-level CO.","options":["True","False"],"correctAnswer":1,"explanation":"The question must require the thinking the CO claims. Recall cannot show design ability.","topic":"Assessment"},{"id":"m1l8-c","dept":"ALL","type":"match","question":"Put the alignment chain in order by matching each stage to its position.","options":["1st","2nd","3rd","4th"],"correctAnswer":null,"explanation":"CO first, then teaching-learning, then assessment, then attainment.","topic":"Assessment","items":[{"prompt":"Course Outcome","answer":0},{"prompt":"Teaching-learning activities","answer":1},{"prompt":"Assessment","answer":2},{"prompt":"Attainment","answer":3}]},{"id":"m1l8-eee","dept":"EEE","type":"mcq","question":"CO3 of Power Systems I is “Analyze symmetrical and unsymmetrical faults.” Which exam question is aligned?","options":["Define symmetrical components","List the types of faults","For the given network, determine the fault current for an SLG fault at bus 3 and identify the most severe fault location","State the swing equation"],"correctAnswer":2,"explanation":"Only this question requires Analyze-level work on faults.","topic":"Assessment"},{"id":"m1l8-cse","dept":"CSE","type":"mcq","question":"CO2 of Data Structures is “Analyze the time and space complexity of algorithms.” Which question is aligned?","options":["Define Big-O notation","List three sorting algorithms","Derive the time complexity of the two given algorithms and determine which scales better for n = 10^6, with reasons","Write the definition of a stack"],"correctAnswer":2,"explanation":"Deriving and comparing complexity with reasons is Analyze-level work.","topic":"Assessment"},{"id":"m1l8-te","dept":"TE","type":"mcq","question":"A Wet Processing CO is “Analyze the causes of dyeing faults from process data.” Which question is aligned?","options":["List five dyeing faults","Define liquor ratio","Using the shade-variation data for three batches, identify the probable causes (liquor ratio, temperature profile, pH) and justify your answer","Name the dye classes for cotton"],"correctAnswer":2,"explanation":"Diagnosing causes from data is Analyze-level work.","topic":"Assessment"}]},{"id":"m1-l9","title":"Bloom’s Taxonomy practice: identify the level","summary":"Apply Bloom levels to outcomes and questions from your discipline.","body":"\u003cp class=\"lead\">Read each outcome or question and decide which Bloom level is \u003cstrong>primarily\u003c/strong> represented. Ask yourself: what does the student actually have to do?\u003c/p>\n\u003cdiv class=\"cols\">\u003cdiv class=\"box\">\u003ch4>Quick guide\u003c/h4>\u003cul>\u003cli>Recall a fact: Remember\u003c/li>\u003cli>Explain in own words: Understand\u003c/li>\u003cli>Use a known method: Apply\u003c/li>\u003cli>Break down, find causes: Analyze\u003c/li>\u003cli>Judge with criteria: Evaluate\u003c/li>\u003cli>Produce something new: Create\u003c/li>\u003c/ul>\u003c/div>\n\u003cdiv class=\"box\">\u003ch4>Watch out\u003c/h4>\u003cp>A long or difficult calculation is still Apply if the method is known. Design is Create only if students generate a solution to requirements, not when they copy a given design.\u003c/p>\u003c/div>\u003c/div>","dept":{"EEE":"","CSE":"","TE":""},"questions":[{"id":"m1l9-a","dept":"ALL","type":"pick","question":"“Recall the definition of a Course Outcome.”","options":["Remember","Understand","Apply","Analyze","Evaluate","Create"],"correctAnswer":0,"explanation":"Recalling a definition is Remember.","topic":"Bloom's Taxonomy"},{"id":"m1l9-b","dept":"ALL","type":"pick","question":"“Justify the choice of assessment tools for a capstone design course.”","options":["Remember","Understand","Apply","Analyze","Evaluate","Create"],"correctAnswer":4,"explanation":"Justifying a decision against criteria is Evaluate.","topic":"Bloom's Taxonomy"},{"id":"m1l9-c","dept":"ALL","type":"pick","question":"“Explain the difference between a PO and a PEO.”","options":["Remember","Understand","Apply","Analyze","Evaluate","Create"],"correctAnswer":1,"explanation":"Explaining a concept is Understand.","topic":"Bloom's Taxonomy"},{"id":"m1l9-eee1","dept":"EEE","type":"mcq","question":"“Design a solar-powered battery charging system for a remote monitoring device.” Which Bloom level is primarily represented?","options":["Remember","Understand","Apply","Create"],"correctAnswer":3,"explanation":"Students must generate a new system that meets requirements, which is Create.","topic":"Bloom's Taxonomy"},{"id":"m1l9-eee2","dept":"EEE","type":"mcq","question":"“Evaluate two protection schemes for a distribution feeder and justify the more appropriate one.”","options":["Apply","Analyze","Evaluate","Create"],"correctAnswer":2,"explanation":"Judging between options with justification is Evaluate.","topic":"Bloom's Taxonomy"},{"id":"m1l9-eee3","dept":"EEE","type":"pick","question":"“Compute the efficiency of a transformer from open-circuit and short-circuit test data.”","options":["Remember","Understand","Apply","Analyze","Evaluate","Create"],"correctAnswer":2,"explanation":"A known method applied to given data is Apply.","topic":"Bloom's Taxonomy"},{"id":"m1l9-cse1","dept":"CSE","type":"mcq","question":"“Design a scalable cloud-based appointment system for a hospital.” Which Bloom level is primarily represented?","options":["Remember","Understand","Apply","Create"],"correctAnswer":3,"explanation":"Producing a new system design for requirements is Create.","topic":"Bloom's Taxonomy"},{"id":"m1l9-cse2","dept":"CSE","type":"mcq","question":"“Critique two machine-learning models for disease prediction using precision, recall and fairness, and recommend one.”","options":["Apply","Analyze","Evaluate","Create"],"correctAnswer":2,"explanation":"Critiquing against criteria and recommending is Evaluate.","topic":"Bloom's Taxonomy"},{"id":"m1l9-cse3","dept":"CSE","type":"pick","question":"“Differentiate the behaviour of two CPU scheduling algorithms from the given trace data and explain the cause of the difference.”","options":["Remember","Understand","Apply","Analyze","Evaluate","Create"],"correctAnswer":3,"explanation":"Differentiating and finding causes from data is Analyze.","topic":"Bloom's Taxonomy"},{"id":"m1l9-te1","dept":"TE","type":"mcq","question":"“Design an energy-efficient dyeing process for cotton knit fabric that reduces water use by 30%.” Which Bloom level is primarily represented?","options":["Remember","Understand","Apply","Create"],"correctAnswer":3,"explanation":"Generating a new process to meet targets is Create.","topic":"Bloom's Taxonomy"},{"id":"m1l9-te2","dept":"TE","type":"mcq","question":"“Assess three sustainable fibre options for a T-shirt line and justify your choice.”","options":["Apply","Analyze","Evaluate","Create"],"correctAnswer":2,"explanation":"Assessing options and justifying a choice is Evaluate.","topic":"Bloom's Taxonomy"},{"id":"m1l9-te3","dept":"TE","type":"pick","question":"“Calculate the GSM of a fabric sample from its weight and dimensions.”","options":["Remember","Understand","Apply","Analyze","Evaluate","Create"],"correctAnswer":2,"explanation":"Using a known formula on given data is Apply.","topic":"Bloom's Taxonomy"}]},{"id":"m1-l10","title":"CO–PO mapping","summary":"Map each CO to the POs it genuinely develops, with Bloom level, delivery and assessment.","body":"\u003cp class=\"lead\">A CO–PO mapping shows which program outcomes each course outcome contributes to. A complete course outline records, for each CO, the PO, the Bloom domain and level, delivery methods and assessment tools.\u003c/p>\n\u003cdiv data-widget=\"coPoTable\">\u003c/div>\n\u003ch3>Rules of good mapping\u003c/h3>\n\u003cul>\u003cli>Map a CO only to POs it genuinely develops \u003cstrong>and assesses\u003c/strong>.\u003c/li>\u003cli>Avoid mapping every CO to every PO; over-mapping weakens evidence.\u003c/li>\u003cli>Many programs indicate strength (for example 1 = low, 2 = medium, 3 = high). Justify high strengths with assessment weight.\u003c/li>\u003cli>At program level, a curriculum matrix shows that every PO is developed and assessed in several courses.\u003c/li>\u003c/ul>","dept":{"EEE":"","CSE":"","TE":""},"questions":[{"id":"m1l10-a","dept":"ALL","type":"tf","question":"True or false: mapping every CO to every PO makes the course look comprehensive and is good practice.","options":["True","False"],"correctAnswer":1,"explanation":"Over-mapping claims contributions that are not assessed and weakens the evidence.","topic":"CO-PO mapping"},{"id":"m1l10-b","dept":"ALL","type":"mcq","question":"What must support a claim that a CO contributes to a PO?","options":["The teacher's opinion","Assessment of that CO, with results used in attainment","The course title","The number of lectures"],"correctAnswer":1,"explanation":"Mapping is credible only when the CO is assessed and its results feed PO attainment.","topic":"CO-PO mapping"},{"id":"m1l10-c","dept":"ALL","type":"mcq","question":"What is the main purpose of a program-level curriculum matrix?","options":["To list teachers' names","To show that each PO is developed and assessed across several courses","To schedule classrooms","To calculate GPA"],"correctAnswer":1,"explanation":"It demonstrates coverage of every PO across the curriculum.","topic":"CO-PO mapping"},{"id":"m1l10-eee","dept":"EEE","type":"mcq","question":"“Analyze the stability of a power system using the equal area criterion.” Which PO area does this CO most directly address?","options":["Engineering knowledge","Problem analysis","Design/development of solutions","Investigation","Modern tool usage","Environment and sustainability","Individual and team work","Communication"],"correctAnswer":1,"explanation":"Analysis of a defined engineering problem from principles is problem analysis (mapped to PO2 in EEE317).","topic":"CO-PO mapping"},{"id":"m1l10-cse","dept":"CSE","type":"mcq","question":"“Use version control, automated testing frameworks and profiling tools to develop and optimise software.” Which PO area does this CO most directly address?","options":["Engineering knowledge","Problem analysis","Design/development of solutions","Investigation","Modern tool usage","Environment and sustainability","Individual and team work","Communication"],"correctAnswer":4,"explanation":"Selecting and using modern engineering and IT tools is modern tool usage.","topic":"CO-PO mapping"},{"id":"m1l10-te","dept":"TE","type":"mcq","question":"“Evaluate the environmental impact of a dyeing process and propose reductions in water and chemical use.” Which PO area does this CO most directly address?","options":["Engineering knowledge","Problem analysis","Design/development of solutions","Investigation","Modern tool usage","Environment and sustainability","Individual and team work","Communication"],"correctAnswer":5,"explanation":"This CO is about environment and sustainability.","topic":"CO-PO mapping"}]},{"id":"m1-l11","title":"Assessment and attainment","summary":"Attainment compares student performance on CO-tagged assessments with a set target.","body":"\u003ch3>Direct and indirect assessment\u003c/h3>\n\u003cdiv class=\"cols\">\u003cdiv class=\"box\">\u003ch4>Direct\u003c/h4>\u003cp>Examines student work: quizzes, exams, assignments, projects and labs, with each question or criterion tagged to a CO.\u003c/p>\u003c/div>\n\u003cdiv class=\"box\">\u003ch4>Indirect\u003c/h4>\u003cp>Gathers perceptions: course-end, exit, alumni and employer surveys.\u003c/p>\u003c/div>\u003c/div>\n\u003ch3>How CO attainment works\u003c/h3>\n\u003col>\u003cli>Tag each assessment item to a CO.\u003c/li>\u003cli>For each student, compute the percentage of marks obtained on that CO's items.\u003c/li>\u003cli>A student attains the CO if the percentage meets the \u003cstrong>threshold\u003c/strong> (set by the program, for example 50% or 60%).\u003c/li>\u003cli>The course attains the CO if the share of students who attained it meets the \u003cstrong>target\u003c/strong> (for example 60% of students).\u003c/li>\u003c/ol>\n\u003cp>PO attainment is then aggregated from the attainment of mapped COs, often weighted by mapping strength, and supplemented with indirect results. Thresholds and targets are set and justified by each program.\u003c/p>\n\u003ch3>Try it\u003c/h3>\u003cdiv data-widget=\"attainmentCalc\">\u003c/div>","dept":{"EEE":"","CSE":"","TE":""},"questions":[{"id":"m1l11-a","dept":"ALL","type":"mcq","question":"In a class of 40, 26 students reached the CO threshold. The target is 70% of students. What is the result?","options":["65%, target achieved","65%, target not achieved","70%, target achieved","26%, not achieved"],"correctAnswer":1,"explanation":"26 / 40 = 65%, which is below the 70% target, so a CQI action is needed.","topic":"Attainment"},{"id":"m1l11-b","dept":"ALL","type":"match","question":"Classify each as a direct or indirect assessment.","options":["Direct","Indirect"],"correctAnswer":null,"explanation":"Student work is direct evidence; perceptions are indirect.","topic":"Assessment","items":[{"prompt":"CO-tagged final exam question","answer":0},{"prompt":"Employer satisfaction survey","answer":1},{"prompt":"Rubric-scored project report","answer":0},{"prompt":"Course-end student feedback","answer":1}]},{"id":"m1l11-c","dept":"ALL","type":"tf","question":"True or false: a high class average on the final exam guarantees that every CO was attained.","options":["True","False"],"correctAnswer":1,"explanation":"Averages hide CO-wise weaknesses. Attainment must be calculated per CO from tagged items.","topic":"Attainment"},{"id":"m1l11-eee","dept":"EEE","type":"mcq","question":"Only 48% of students attained “Analyze unsymmetrical faults” against a 60% target. Script analysis shows errors in building sequence networks. What is the best CQI action?","options":["Lower the target to 45%","Remove the CO","Add tutorials and practice on sequence networks, then re-measure attainment next semester","Make the exam easier"],"correctAnswer":2,"explanation":"An action that addresses the identified cause, with follow-up measurement, closes the loop.","topic":"CQI"},{"id":"m1l11-cse","dept":"CSE","type":"mcq","question":"Only 52% attained “Analyze the time complexity of algorithms” against a 60% target. Most errors involve solving recurrence relations. What is the best CQI action?","options":["Drop recurrences from the syllabus","Lower the threshold","Add a recurrence-solving workshop with graded practice, and track attainment next semester","Change the grading curve"],"correctAnswer":2,"explanation":"Target the diagnosed weakness and verify the effect next time.","topic":"CQI"},{"id":"m1l11-te","dept":"TE","type":"mcq","question":"Only 45% attained “Calculate dye recipes for a specified shade” against a 60% target. Most errors are in percentage-shade and liquor-ratio calculations. What is the best CQI action?","options":["Remove calculations from the exam","Add worked examples and lab practice on recipe calculation, then re-measure next semester","Lower the target","Give extra marks for attendance"],"correctAnswer":1,"explanation":"An action aimed at the cause, with follow-up measurement, closes the loop.","topic":"CQI"}]},{"id":"m1-l12","title":"Continuous Quality Improvement (CQI)","summary":"CQI is the heart of OBE: assess, analyse, act and follow up at CO, PO and PEO level.","body":"\u003cp class=\"lead\">CQI closes the loop: assessment results are analysed, actions are taken, and the effect of the actions is checked. Three loops run at different speeds, all anchored in the vision and mission.\u003c/p>\n\u003cdiv data-widget=\"cqiLoops\">\u003c/div>\n\u003ch3>Feedback from stakeholders\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">Feedback from\u003c/th>\u003cth scope=\"col\">Informs\u003c/th>\u003cth scope=\"col\">Level\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Students\u003c/td>\u003ctd>CO\u003c/td>\u003ctd>Course level\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Faculty\u003c/td>\u003ctd>PO\u003c/td>\u003ctd>Program level\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Alumni and employers\u003c/td>\u003ctd>PEO\u003c/td>\u003ctd>Job and field level\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>Faculty feedback at the end of the semester\u003c/h3>\n\u003cp>Each teacher records: CO attainment results against targets; reasons for any shortfall; proposed actions for the next offering; and the effect of actions taken last time. This report is the key CQI evidence at course level.\u003c/p>\n\u003ch3>A CQI example from your department\u003c/h3>{{DEPT}}","dept":{"EEE":"\u003cp>Last year CO2 (load flow) missed its target. This year the teacher added a MATLAB lab on the Newton-Raphson method. Attainment rose from 52% to 71%, recorded in the faculty feedback report with the before-and-after data.\u003c/p>","CSE":"\u003cp>Employer feedback reported that graduates were weak in software testing. The program added unit-testing assignments to two courses and will track attainment of the related PO next year.\u003c/p>","TE":"\u003cp>Alumni feedback reported limited knowledge of sustainability compliance in the RMG sector. At the PEO review, the program added a course on sustainable textiles and compliance.\u003c/p>"},"questions":[{"id":"m1l12-a","dept":"ALL","type":"mcq","question":"In the CQI cycle described in this lesson, how often is the PEO loop run?","options":["Each semester","Every year","Every 3 years","Never"],"correctAnswer":2,"explanation":"CO: each semester; PO: every year; PEO: every 3 years.","topic":"CQI"},{"id":"m1l12-b","dept":"ALL","type":"match","question":"Match each feedback source to the level it mainly informs.","options":["CO (course level)","PO (program level)","PEO (job and field level)"],"correctAnswer":null,"explanation":"Students inform COs, faculty inform POs, alumni and employers inform PEOs.","topic":"CQI","items":[{"prompt":"Student feedback","answer":0},{"prompt":"Faculty feedback","answer":1},{"prompt":"Alumni feedback","answer":2},{"prompt":"Employer feedback","answer":2}]},{"id":"m1l12-c","dept":"ALL","type":"tf","question":"True or false: CQI is complete once CO attainment has been calculated.","options":["True","False"],"correctAnswer":1,"explanation":"Calculation is only the start; CQI requires action and checking the effect of the action.","topic":"CQI"},{"id":"m1l12-eee","dept":"EEE","type":"mcq","question":"Which record best shows a closed CQI loop for an EEE course?","options":["Attainment for CO2 was 52%","CO2 missed its target; a MATLAB load-flow lab was added; next year attainment rose to 71%, recorded in the faculty feedback report","The course used a new textbook","Students said the course was hard"],"correctAnswer":1,"explanation":"It shows the result, the action and the measured effect.","topic":"CQI"},{"id":"m1l12-cse","dept":"CSE","type":"mcq","question":"Employer feedback says CSE graduates are weak in software testing. The program adds testing assignments in two courses. Which CQI loop does this action mainly belong to?","options":["CO loop of one course only","PO (program-level) loop","No loop; feedback is ignored","Admission policy"],"correctAnswer":1,"explanation":"Employer feedback acted on across several courses is a program-level (PO) action.","topic":"CQI"},{"id":"m1l12-te","dept":"TE","type":"mcq","question":"Alumni report gaps in sustainability compliance knowledge, and the program adds a new course after review. Which CQI loop does this mainly reflect?","options":["CO loop","PO loop","PEO loop, informed by alumni feedback","None"],"correctAnswer":2,"explanation":"Alumni feedback on graduates' field performance feeds the PEO-level review.","topic":"CQI"}]},{"id":"m1-l13","title":"Evidence and documentation in OBE","summary":"The semester course file is the core evidence of outcomes, attainment and improvement.","body":"\u003ch3>Why keep a semester course file?\u003c/h3>\n\u003cdiv class=\"cols\">\u003cdiv class=\"box\">\u003cul>\u003cli>Quality assurance\u003c/li>\u003cli>Accountability\u003c/li>\u003cli>Transparency and integrity\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"box\">\u003cul>\u003cli>Consistency\u003c/li>\u003cli>Continuous improvement\u003c/li>\u003cli>Accreditation\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\n\u003ch3>Course file checklist\u003c/h3>\u003cp>Tick items to check a course file you maintain. Ticks are only for your own use and are not scored.\u003c/p>\n\u003cdiv data-widget=\"courseFile\">\u003c/div>\n\u003ch3>Evidence examples from your department\u003c/h3>{{DEPT}}\n\u003cdiv class=\"principle\">\u003cp>Claiming is not demonstrating.\u003c/p>\u003csmall>Every statement in a self-assessment report should trace back to documents in course files.\u003c/small>\u003c/div>","dept":{"EEE":"\u003cul>\u003cli>Lab reports with measured data and rubric scores.\u003c/li>\u003cli>Design reports, circuit schematics, PCB layouts and test results for project courses.\u003c/li>\u003cli>Simulation files for load-flow or fault studies, with marking criteria.\u003c/li>\u003c/ul>","CSE":"\u003cul>\u003cli>Code repositories with commit history showing individual contributions.\u003c/li>\u003cli>Test reports, code-review records and demo rubrics.\u003c/li>\u003cli>Design documents (requirements, architecture) with marking criteria.\u003c/li>\u003c/ul>","TE":"\u003cul>\u003cli>Lab test reports (for example colour fastness, GSM, shrinkage) referencing the standard test method used.\u003c/li>\u003cli>Fabric or yarn sample records and recipe sheets.\u003c/li>\u003cli>Industrial attachment reports with supervisor assessment.\u003c/li>\u003c/ul>"},"questions":[{"id":"m1l13-a","dept":"ALL","type":"multi","question":"Which items belong in a semester course file? Select all that apply.","options":["Question papers tagged by CO and Bloom level","CO attainment calculation","Faculty feedback with CQI actions","The teacher's personal social media posts","Sample scripts (best, average, weak)"],"correctAnswer":[0,1,2,4],"explanation":"All except personal posts are standard course-file evidence.","topic":"Evidence"},{"id":"m1l13-b","dept":"ALL","type":"mcq","question":"Why include best, average and weak sample scripts?","options":["To fill the file","To show the range of attainment and how marking was applied","To identify students publicly","Because exams are too long"],"correctAnswer":1,"explanation":"Samples across the range let reviewers see standards and marking consistency.","topic":"Evidence"},{"id":"m1l13-c","dept":"ALL","type":"tf","question":"True or false: preparing course files in the month before an accreditation visit is acceptable as long as they look complete.","options":["True","False"],"correctAnswer":1,"explanation":"Course files should be maintained every semester; retrospective files lack genuine CQI evidence.","topic":"Evidence"},{"id":"m1l13-eee","dept":"EEE","type":"mcq","question":"A CO states “Design a regulated DC power supply and verify its performance.” Which evidence best supports its attainment?","options":["Attendance sheet","Design report with schematic, measured test results and rubric scores","Lecture slides","The lab equipment list"],"correctAnswer":1,"explanation":"Design and measured verification, scored with a rubric, evidence the CO directly.","topic":"Evidence"},{"id":"m1l13-cse","dept":"CSE","type":"mcq","question":"A team project CO states “Develop a web application in a team following a documented design.” Which evidence best supports individual attainment?","options":["Only the final demo video","Repository commit history, design document, test report, demo rubric and peer evaluation","The project title","A screenshot of the login page"],"correctAnswer":1,"explanation":"Commits and peer evaluation show individual contribution; documents and rubrics show quality.","topic":"Evidence"},{"id":"m1l13-te","dept":"TE","type":"mcq","question":"A CO states “Evaluate the colour fastness of dyed samples.” Which evidence best supports its attainment?","options":["A list of dyes used","Test reports citing the standard method, grey-scale ratings for each sample, and a rubric-scored evaluation","A photograph of the lab","The supplier's catalogue"],"correctAnswer":1,"explanation":"Method, recorded results and assessed judgment demonstrate the Evaluate-level outcome.","topic":"Evidence"}]},{"id":"m1-l14","title":"Common mistakes in OBE implementation","summary":"Recognise and fix the mistakes that weaken OBE evidence.","body":"\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">Mistake\u003c/th>\u003cth scope=\"col\">Why it matters\u003c/th>\u003cth scope=\"col\">Fix\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>COs written as topic lists\u003c/td>\u003ctd>Nothing to assess\u003c/td>\u003ctd>Start each CO with a measurable verb\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Unmeasurable verbs (understand, know)\u003c/td>\u003ctd>Attainment cannot be shown\u003c/td>\u003ctd>Use observable verbs at a stated level\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Questions not tagged by CO and Bloom level\u003c/td>\u003ctd>CO attainment cannot be computed\u003c/td>\u003ctd>Tag every question and criterion\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>CO–assessment misalignment\u003c/td>\u003ctd>Marks do not evidence the CO\u003c/td>\u003ctd>Match question verbs to CO level\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Over-mapping COs to POs\u003c/td>\u003ctd>Unsupported claims\u003c/td>\u003ctd>Map only what is developed and assessed\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Attainment from total marks, not per CO\u003c/td>\u003ctd>Hides weak COs\u003c/td>\u003ctd>Calculate CO-wise attainment\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>CQI actions not recorded or followed up\u003c/td>\u003ctd>Loop never closes\u003c/td>\u003ctd>Record actions and their measured effect\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Lab and project courses without rubrics\u003c/td>\u003ctd>Inconsistent, unverifiable marking\u003c/td>\u003ctd>Use criteria-based rubrics\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Evidence compiled only before a visit\u003c/td>\u003ctd>No genuine improvement trail\u003c/td>\u003ctd>Maintain course files every semester\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","dept":{"EEE":"","CSE":"","TE":""},"questions":[{"id":"m1l14-a","dept":"ALL","type":"tf","question":"Good OBE practice? “CO attainment is calculated from total course marks rather than from CO-tagged items.” (True = good practice, False = poor practice)","options":["True","False"],"correctAnswer":1,"explanation":"Total marks hide which COs are weak; attainment should be computed per CO.","topic":"Attainment"},{"id":"m1l14-b","dept":"ALL","type":"mcq","question":"Which is a common OBE implementation mistake?","options":["Tagging each exam question by CO and Bloom level","Recording CQI actions and their effect","Mapping every CO to every PO without assessment to support it","Using rubrics for project work"],"correctAnswer":2,"explanation":"Over-mapping without assessment evidence is a common mistake.","topic":"CO-PO mapping"},{"id":"m1l14-c","dept":"ALL","type":"mcq","question":"A teacher identifies a weak CO, plans an action, but never checks whether it worked. Which part of CQI is missing?","options":["Assessment","Analysis","Follow-up on the effect of the action","Mapping"],"correctAnswer":2,"explanation":"Without checking the effect, the loop is not closed.","topic":"CQI"},{"id":"m1l14-eee","dept":"EEE","type":"mcq","question":"An Electrical Machines Lab has the CO “Conduct tests on machines and interpret the results”, assessed only by an unstructured viva with no criteria. What is the main problem?","options":["The CO is too long","Assessment has no rubric or recorded evidence of conducting tests and interpreting data","Labs should not have COs","There are too few machines"],"correctAnswer":1,"explanation":"Use rubric-scored lab reports or observation sheets aligned with the CO.","topic":"Assessment"},{"id":"m1l14-cse","dept":"CSE","type":"mcq","question":"In a CSE capstone, marks are given only for the final demo; no design decisions, tests or individual contributions are documented. What is the main problem?","options":["Demos are not allowed","Evidence is insufficient to show design, testing and individual attainment","The project is too long","Capstones should be exams"],"correctAnswer":1,"explanation":"Document design, testing and contributions, and assess with rubrics.","topic":"Evidence"},{"id":"m1l14-te","dept":"TE","type":"mcq","question":"A Textile Engineering question paper has no CO or Bloom tag on any question. What is the main consequence?","options":["Students cannot answer","CO-wise attainment cannot be calculated from the results","The paper is too short","It cannot be printed"],"correctAnswer":1,"explanation":"Without tags, marks cannot be traced to COs.","topic":"Attainment"}]}],"final":[{"id":"f1-1","dept":"ALL","type":"mcq","question":"OBE designs curriculum, teaching and assessment around:","options":["Available textbooks","Intended outcomes students must demonstrate","Faculty preferences","Exam schedules"],"correctAnswer":1,"explanation":"","topic":"OBE fundamentals"},{"id":"f1-2","dept":"ALL","type":"mcq","question":"Which statement correctly orders time horizons from shortest to longest?","options":["PEO, PO, CO","CO, PO, PEO","PO, CO, PEO","CO, PEO, PO"],"correctAnswer":1,"explanation":"","topic":"OBE fundamentals"},{"id":"f1-3","dept":"ALL","type":"mcq","question":"Which is a well-written CO?","options":["Students will understand control systems","Analyze the stability of a feedback system using root-locus plots","Learn about control","Be familiar with Bode plots"],"correctAnswer":1,"explanation":"","topic":"CO"},{"id":"f1-4","dept":"ALL","type":"tf","question":"True or false: a single course must map to every PO.","options":["True","False"],"correctAnswer":1,"explanation":"","topic":"PO"},{"id":"f1-5","dept":"ALL","type":"mcq","question":"CO–PO mapping is credible when:","options":["Every CO maps to every PO","The CO is assessed and its results feed PO attainment","The course is a core course","The teacher signs it"],"correctAnswer":1,"explanation":"","topic":"CO-PO mapping"},{"id":"f1-6","dept":"ALL","type":"pick","question":"“Justify the selection of a sampling plan for incoming material inspection.” Which Bloom level?","options":["Remember","Understand","Apply","Analyze","Evaluate","Create"],"correctAnswer":4,"explanation":"","topic":"Bloom's Taxonomy"},{"id":"f1-7","dept":"ALL","type":"mcq","question":"Which assessment tool best suits Create-level COs?","options":["Recall quiz","Design project with rubric","True/false test","Attendance"],"correctAnswer":1,"explanation":"","topic":"Assessment"},{"id":"f1-8","dept":"ALL","type":"mcq","question":"50 students; 33 reached the CO threshold; target 60% of students. Result?","options":["66%, achieved","66%, not achieved","60%, achieved","33%, not achieved"],"correctAnswer":0,"explanation":"","topic":"Attainment"},{"id":"f1-9","dept":"ALL","type":"mcq","question":"Which record best shows CQI?","options":["Attainment results only","Results, cause analysis, action taken and measured effect next offering","A new textbook","A full attendance sheet"],"correctAnswer":1,"explanation":"","topic":"CQI"},{"id":"f1-10","dept":"ALL","type":"mcq","question":"Which feedback mainly informs PEO review?","options":["Student course-end feedback","Alumni and employer feedback","Quiz marks","Lab attendance"],"correctAnswer":1,"explanation":"","topic":"CQI"},{"id":"f1-eee1","dept":"EEE","type":"mcq","question":"CO: “Apply numerical methods for the load flow study of a power system.” Which exam question is aligned?","options":["Define a slack bus","Using the Gauss-Seidel method, compute the bus voltages of the given 3-bus system after two iterations","List the types of buses","State the purpose of load flow"],"correctAnswer":1,"explanation":"","topic":"Assessment"},{"id":"f1-eee2","dept":"EEE","type":"pick","question":"“Design an IoT-based energy monitoring node that reports voltage and current every second within a fixed power budget.” Which Bloom level?","options":["Remember","Understand","Apply","Analyze","Evaluate","Create"],"correctAnswer":5,"explanation":"","topic":"Bloom's Taxonomy"},{"id":"f1-eee3","dept":"EEE","type":"mcq","question":"“Analyze symmetrical and unsymmetrical faults in a power system” maps most directly to:","options":["Engineering knowledge","Problem analysis","Design/development of solutions","Investigation","Modern tool usage","Environment and sustainability","Individual and team work","Communication"],"correctAnswer":1,"explanation":"","topic":"CO-PO mapping"},{"id":"f1-eee4","dept":"EEE","type":"mcq","question":"48% of students attained a renewable-energy CO on PV system sizing against a 60% target; errors were mainly in battery sizing. Best action?","options":["Lower the target","Add worked examples and a lab exercise on battery sizing, then re-measure","Remove the CO","Curve the grades"],"correctAnswer":1,"explanation":"","topic":"CQI"},{"id":"f1-eee5","dept":"EEE","type":"mcq","question":"Best evidence for the CO “Implement an embedded speed controller for a DC motor”:","options":["Lecture notes","Code, measured speed-response results and a lab rubric","The motor's datasheet","Attendance"],"correctAnswer":1,"explanation":"","topic":"Evidence"},{"id":"f1-cse1","dept":"CSE","type":"mcq","question":"CO: “Implement tree and graph algorithms for real-world applications.” Which assessment is aligned?","options":["Define a binary tree","Implement shortest-path routing for a given campus map and test it on supplied cases","List graph types","State Dijkstra's year of publication"],"correctAnswer":1,"explanation":"","topic":"Assessment"},{"id":"f1-cse2","dept":"CSE","type":"pick","question":"“Evaluate two database designs for a hospital information system and justify the better one for scalability and integrity.” Which Bloom level?","options":["Remember","Understand","Apply","Analyze","Evaluate","Create"],"correctAnswer":4,"explanation":"","topic":"Bloom's Taxonomy"},{"id":"f1-cse3","dept":"CSE","type":"mcq","question":"“Use Git, CI pipelines and automated tests to develop a cloud-based application” maps most directly to:","options":["Engineering knowledge","Problem analysis","Design/development of solutions","Investigation","Modern tool usage","Environment and sustainability","Individual and team work","Communication"],"correctAnswer":4,"explanation":"","topic":"CO-PO mapping"},{"id":"f1-cse4","dept":"CSE","type":"mcq","question":"A computer-vision CO on image classification was attained by 50% against a 60% target; most errors involved evaluating overfitting. Best action?","options":["Drop model evaluation","Add a guided lab on validation curves and regularisation, then re-measure","Lower the target","Give bonus marks"],"correctAnswer":1,"explanation":"","topic":"CQI"},{"id":"f1-cse5","dept":"CSE","type":"mcq","question":"Best evidence for a cybersecurity CO “Analyze a web application for vulnerabilities and recommend mitigations”:","options":["The course syllabus","Vulnerability assessment report with findings, mitigations and a rubric score","A list of tools installed","Attendance"],"correctAnswer":1,"explanation":"","topic":"Evidence"},{"id":"f1-te1","dept":"TE","type":"mcq","question":"CO: “Calculate dye and chemical recipes for a specified shade and liquor ratio.” Which question is aligned?","options":["Define liquor ratio","For a 2% shade on 150 kg fabric at 1:8 liquor ratio, calculate the dye, salt and alkali quantities","List reactive dye types","Name a dyeing machine"],"correctAnswer":1,"explanation":"","topic":"Assessment"},{"id":"f1-te2","dept":"TE","type":"pick","question":"“Develop a garment quality-control plan for a new knitwear line that meets a buyer's AQL requirements.” Which Bloom level?","options":["Remember","Understand","Apply","Analyze","Evaluate","Create"],"correctAnswer":5,"explanation":"","topic":"Bloom's Taxonomy"},{"id":"f1-te3","dept":"TE","type":"mcq","question":"“Evaluate the environmental impact of a textile dyeing process and propose improvements” maps most directly to:","options":["Engineering knowledge","Problem analysis","Design/development of solutions","Investigation","Modern tool usage","Environment and sustainability","Individual and team work","Communication"],"correctAnswer":5,"explanation":"","topic":"CO-PO mapping"},{"id":"f1-te4","dept":"TE","type":"mcq","question":"A textile machinery CO on loom efficiency calculation was attained by 46% against a 60% target; errors centred on stoppage-time data. Best action?","options":["Remove the CO","Add mill-data case exercises on stoppage analysis, then re-measure","Lower the target","Shorten the exam"],"correctAnswer":1,"explanation":"","topic":"CQI"},{"id":"f1-te5","dept":"TE","type":"mcq","question":"Best evidence for the CO “Analyze fabric shrinkage under different finishing treatments”:","options":["The finishing chemical catalogue","Lab reports with measured shrinkage, analysis of causes and a rubric score","A photo of the stenter","Attendance"],"correctAnswer":1,"explanation":"","topic":"Evidence"}],"certCode":"OBE"},{"id":"m2","number":2,"title":"Complex Engineering Problem (CEP)","description":"WK1–WK9, WP1–WP7, EA1–EA5, identifying CEPs, engineering judgment and documenting evidence.","lessons":[{"id":"m2-l1","title":"Ordinary engineering problem vs Complex Engineering Problem","summary":"A difficult problem is not automatically a CEP. Complexity must be shown with evidence.","body":"\u003cdiv class=\"principle\">\u003cp>A difficult engineering problem is not automatically a Complex Engineering Problem.\u003c/p>\u003csmall>Complexity is demonstrated with evidence from the characteristics of the problem, not from its title or how hard the calculations are.\u003c/small>\u003c/div>\n\u003cp class=\"lead\">BAETE describes complexity with three related tables. Keeping them separate is the most important idea in this module. Select each question.\u003c/p>\n\u003cdiv data-widget=\"hierarchy\">\u003c/div>\n\u003ch3>Ordinary vs complex in your department\u003c/h3>{{DEPT}}\n\u003cdiv class=\"caution\">\u003cstrong>Not evidence on its own:\u003c/strong> an advanced-sounding title, long calculations, expensive software, or a thick report.\u003c/div>","dept":{"EEE":"\u003cdiv class=\"cols\">\u003cdiv class=\"box\">\u003ch4>Ordinary (can still be difficult)\u003c/h4>\u003cp>Calculate the current in each branch of a predefined resistor network with all values given. Clear model, known equations, standard solution, no stakeholders, no conflicting requirements.\u003c/p>\u003c/div>\u003cdiv class=\"box\">\u003ch4>Complex\u003c/h4>\u003cp>Design a campus-wide energy monitoring and anomaly-detection system: several engineering domains, conflicting requirements, uncertain operating conditions, many stakeholders and interconnected subsystems.\u003c/p>\u003c/div>\u003c/div>","CSE":"\u003cdiv class=\"cols\">\u003cdiv class=\"box\">\u003ch4>Ordinary (can still be difficult)\u003c/h4>\u003cp>Implement quicksort for a given array and measure its run time. Known algorithm, defined input, standard solution.\u003c/p>\u003c/div>\u003cdiv class=\"box\">\u003ch4>Complex\u003c/h4>\u003cp>Develop an AI-based emergency triage support system for a hospital: accuracy, privacy and explainability conflict; clinicians, patients and regulators are involved; data, model, API and interface interact.\u003c/p>\u003c/div>\u003c/div>","TE":"\u003cdiv class=\"cols\">\u003cdiv class=\"box\">\u003ch4>Ordinary (can still be difficult)\u003c/h4>\u003cp>Calculate the yarn count from a measured length and weight. Known formula, known data, standard solution.\u003c/p>\u003c/div>\u003cdiv class=\"box\">\u003ch4>Complex\u003c/h4>\u003cp>Redesign a knit-dyeing process to cut water and energy use while meeting shade and compliance targets: conflicting requirements, buyers and auditors, interacting machine, chemistry and effluent systems.\u003c/p>\u003c/div>\u003c/div>"},"questions":[{"id":"m2l1-a","dept":"ALL","type":"tf","question":"True or false: a problem that requires long and difficult calculations is automatically a Complex Engineering Problem.","options":["True","False"],"correctAnswer":1,"explanation":"Difficulty alone does not demonstrate complexity. Evidence of the WP characteristics, starting with WP1, is needed.","topic":"CEP fundamentals"},{"id":"m2l1-b","dept":"ALL","type":"match","question":"Match each question to the attribute group that answers it.","options":["WK","WP","EA"],"correctAnswer":null,"explanation":"WK is knowledge, WP is problem complexity, EA is activity complexity.","topic":"CEP fundamentals","items":[{"prompt":"What engineering knowledge is required?","answer":0},{"prompt":"What makes the engineering problem complex?","answer":1},{"prompt":"What makes the engineering activity or project complex?","answer":2}]},{"id":"m2l1-c","dept":"ALL","type":"mcq","question":"What is the strongest basis for classifying a project as a CEP?","options":["Its title includes 'AI' or 'smart'","Documented evidence of WP1 and further WP characteristics","It uses expensive software","The report is very long"],"correctAnswer":1,"explanation":"Classification rests on documented evidence of the characteristics.","topic":"CEP fundamentals"},{"id":"m2l1-eee","dept":"EEE","type":"triad","question":"Is this sufficiently demonstrated as a CEP? “Calculate the current through each branch of a predefined resistor network with all values given.”","options":["Yes","No","Insufficient evidence"],"correctAnswer":1,"explanation":"Known model, known equations and parameters, standard solution: no WP characteristics.","topic":"CEP identification"},{"id":"m2l1-eee2","dept":"EEE","type":"triad","question":"Is this sufficiently demonstrated as a CEP? A project titled “Smart IoT-Based AI Energy System”, with no further description.","options":["Yes","No","Insufficient evidence"],"correctAnswer":2,"explanation":"A title is not evidence. Without context, requirements or constraints, complexity cannot be judged.","topic":"CEP identification"},{"id":"m2l1-cse","dept":"CSE","type":"triad","question":"Is this sufficiently demonstrated as a CEP? “Implement quicksort for a given integer array and report its run time.”","options":["Yes","No","Insufficient evidence"],"correctAnswer":1,"explanation":"A known algorithm on a defined input has an obvious solution path.","topic":"CEP identification"},{"id":"m2l1-cse2","dept":"CSE","type":"triad","question":"Is this sufficiently demonstrated as a CEP? A project titled “Blockchain-Enabled AI Cloud Platform”, with no further description.","options":["Yes","No","Insufficient evidence"],"correctAnswer":2,"explanation":"Technology names in a title do not demonstrate any WP characteristic.","topic":"CEP identification"},{"id":"m2l1-te","dept":"TE","type":"triad","question":"Is this sufficiently demonstrated as a CEP? “Calculate the yarn count from a measured length and weight.”","options":["Yes","No","Insufficient evidence"],"correctAnswer":1,"explanation":"A standard formula with given data shows no complexity characteristics.","topic":"CEP identification"},{"id":"m2l1-te2","dept":"TE","type":"triad","question":"Is this sufficiently demonstrated as a CEP? A project titled “Smart Sustainable Textile 4.0 System”, with no further description.","options":["Yes","No","Insufficient evidence"],"correctAnswer":2,"explanation":"Without a problem description and evidence, complexity cannot be judged.","topic":"CEP identification"}]},{"id":"m2-l2","title":"Knowledge and Attitude Profile: WK1–WK9","summary":"WK attributes describe areas of knowledge and professional attitude.","body":"\u003cp class=\"lead\">BAETE Table 6.1 lists nine knowledge and attitude attributes. They answer: \u003cstrong>what does an engineer need to know, and how should they conduct themselves?\u003c/strong> Open each card for the BAETE wording and an example from your department.\u003c/p>\n\u003cdiv data-widget=\"wkCards\">\u003c/div>\n\u003cdiv class=\"note\">\u003cstrong>Remember:\u003c/strong> WK attributes describe knowledge and attitude, not problem characteristics. WP1 refers back to WK3, WK4, WK5, WK6 and WK8 to say how deep the knowledge must go.\u003c/div>","dept":{"EEE":"","CSE":"","TE":""},"questions":[{"id":"m2l2-a","dept":"ALL","type":"mcq","question":"Which WK attribute is most directly associated with “Knowledge of professional ethics, responsibilities, and norms of engineering practice”?","options":["WK4","WK6","WK8","WK9"],"correctAnswer":3,"explanation":"WK9 covers ethics, inclusive behavior and conduct.","topic":"WK"},{"id":"m2l2-b","dept":"ALL","type":"tf","question":"True or false: WK attributes describe characteristics of complex engineering problems.","options":["True","False"],"correctAnswer":1,"explanation":"WK describes knowledge and attitude; WP describes problem characteristics.","topic":"WK"},{"id":"m2l2-c","dept":"ALL","type":"mcq","question":"Knowledge of whole-life cost, re-use of resources and net zero carbon belongs to:","options":["WK2","WK5","WK7","WK3"],"correctAnswer":1,"explanation":"These sustainability concepts are WK5.","topic":"WK"},{"id":"m2l2-eee","dept":"EEE","type":"match","question":"Match each EEE situation to the WK attribute it most directly draws on.","options":["WK1","WK2","WK3","WK4","WK5","WK6","WK7","WK8","WK9"],"correctAnswer":null,"explanation":"Load forecasting is WK2, fault analysis WK3, PV lifecycle cost WK5, recent research WK8.","topic":"WK","items":[{"prompt":"Statistical forecasting of campus load from meter data","answer":1},{"prompt":"Applying fault analysis and circuit theory to a protection scheme","answer":2},{"prompt":"Estimating whole-life cost and carbon impact of a rooftop PV plant","answer":4},{"prompt":"Reviewing recent journal papers to choose an AI fault-detection method","answer":7}]},{"id":"m2l2-cse","dept":"CSE","type":"match","question":"Match each CSE situation to the WK attribute it most directly draws on.","options":["WK1","WK2","WK3","WK4","WK5","WK6","WK7","WK8","WK9"],"correctAnswer":null,"explanation":"Model evaluation statistics is WK2, distributed systems WK4, CI/CD practice WK6, privacy and bias WK7.","topic":"WK","items":[{"prompt":"Using precision, recall and confidence intervals to evaluate a model","answer":1},{"prompt":"Specialist knowledge of consensus protocols in distributed systems","answer":3},{"prompt":"Setting up CI/CD pipelines and automated testing","answer":5},{"prompt":"Considering data privacy and algorithmic bias in a public service app","answer":6}]},{"id":"m2l2-te","dept":"TE","type":"match","question":"Match each Textile Engineering situation to the WK attribute it most directly draws on.","options":["WK1","WK2","WK3","WK4","WK5","WK6","WK7","WK8","WK9"],"correctAnswer":null,"explanation":"Fibre chemistry is WK1, SPC is WK2, water and effluent reduction WK5, worker safety and fair labour WK9.","topic":"WK","items":[{"prompt":"Polymer chemistry explaining reactive dye-fibre bonding","answer":0},{"prompt":"Statistical process control of yarn evenness","answer":1},{"prompt":"Reducing water, energy and effluent load in dyeing","answer":4},{"prompt":"Fair labour practices and inclusive workplace conduct","answer":8}]}]},{"id":"m2-l3","title":"Complex problem characteristics: the WP rule and WP1–WP3","summary":"A CEP has WP1 and some or all of WP2 to WP7.","body":"\u003cdiv class=\"rule\" role=\"img\" aria-label=\"Rule: WP1 is required, plus some or all of WP2 to WP7\">\u003cdiv class=\"req\">\u003cspan>Required\u003c/span>\u003cb>WP1\u003c/b>\u003cspan>Depth of knowledge required\u003c/span>\u003c/div>\u003cdiv class=\"plus\" aria-hidden=\"true\">+\u003c/div>\u003cdiv class=\"opt\">\u003cspan>Some or all of\u003c/span>\u003cdiv class=\"chips\">\u003cspan>WP2\u003c/span>\u003cspan>WP3\u003c/span>\u003cspan>WP4\u003c/span>\u003cspan>WP5\u003c/span>\u003cspan>WP6\u003c/span>\u003cspan>WP7\u003c/span>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"principle\">\u003cp>Complex Engineering Problems have characteristic WP1 and some or all of WP2 to WP7.\u003c/p>\u003csmall>There is no rule that a problem must show all seven at once.\u003c/small>\u003c/div>\n\u003cp>Open each card for the BAETE wording, a plain explanation and an example from your department.\u003c/p>\n\u003cdiv data-widget=\"wpCards\" data-range=\"0-2\">\u003c/div>\n\u003cdiv class=\"caution\">\u003cstrong>Software is not WP1.\u003c/strong> Running MATLAB, ETAP, TensorFlow or a dyeing simulator does not by itself show in-depth knowledge. What matters is fundamentals-based analysis to formulate, interpret and justify results.\u003c/div>","dept":{"EEE":"","CSE":"","TE":""},"questions":[{"id":"m2l3-a","dept":"ALL","type":"tf","question":"True or false: to be a CEP, a problem must demonstrate all of WP1 to WP7 simultaneously.","options":["True","False"],"correctAnswer":1,"explanation":"A CEP has WP1 and some or all of WP2–WP7.","topic":"WP"},{"id":"m2l3-b","dept":"ALL","type":"mcq","question":"Which WP characteristic must be present in every CEP?","options":["WP7","WP1","WP5","WP4"],"correctAnswer":1,"explanation":"WP1, depth of knowledge, is required.","topic":"WP"},{"id":"m2l3-c","dept":"ALL","type":"mcq","question":"A student writes: “We used simulation software, so WP1 is satisfied.” Best response?","options":["Correct","Not by itself: WP1 requires in-depth knowledge enabling a fundamentals-based, first-principles approach, which must be shown","Only if the software is commercial","WP1 only applies to hardware"],"correctAnswer":1,"explanation":"WP1 is about depth of knowledge and first-principles analysis, not tool use.","topic":"WP"},{"id":"m2l3-eee","dept":"EEE","type":"mcq","question":"A solar microgrid for a rural health centre must be low cost, keep vaccine refrigerators running reliably, be maintainable by local technicians, comply with regulations and allow ten years of load growth. Which WP is most directly described?","options":["WP2","WP3","WP5","WP7"],"correctAnswer":0,"explanation":"Wide-ranging, conflicting technical and non-technical requirements plus future needs: WP2.","topic":"WP"},{"id":"m2l3-cse","dept":"CSE","type":"mcq","question":"No existing model explains a new pattern of fraudulent transactions, so the team must decide which features matter and formulate its own detection model. Which WP is most directly described?","options":["WP2","WP3","WP6","WP5"],"correctAnswer":1,"explanation":"No obvious solution; a suitable model must be formulated: WP3.","topic":"WP"},{"id":"m2l3-te","dept":"TE","type":"mcq","question":"No published model fits the relationship between knitting-machine settings and defect rates in a mill, so engineers must formulate one from their own data. Which WP is most directly described?","options":["WP3","WP4","WP6","WP7"],"correctAnswer":0,"explanation":"Formulating a model where none is obvious: WP3.","topic":"WP"}]},{"id":"m2-l4","title":"Complex problem characteristics: WP4–WP7","summary":"Novelty, codes, stakeholders and interdependence.","body":"\u003cdiv data-widget=\"wpCards\" data-range=\"3-6\">\u003c/div>\n\u003cdiv class=\"note\">\u003cstrong>Novel to whom?\u003c/strong> WP4 means infrequent or novel in engineering practice, not merely new to a student. \u003cstrong>No standard?\u003c/strong> WP5 needs the problem to extend beyond what codes encompass; lacking a standard alone does not create complexity.\u003c/div>\n\u003ch3>Summary of WP1–WP7\u003c/h3>\u003cdiv data-widget=\"wpMatrix\">\u003c/div>","dept":{"EEE":"","CSE":"","TE":""},"questions":[{"id":"m2l4-a","dept":"ALL","type":"mcq","question":"Which statement about WP5 is correct?","options":["Every problem lacking a dedicated standard is a CEP","WP5 is relevant when the problem extends beyond what standards and codes adequately encompass","WP5 means ignoring standards","WP5 applies whenever a standard is cited"],"correctAnswer":1,"explanation":"Absence of a standard alone does not create complexity.","topic":"WP"},{"id":"m2l4-b","dept":"ALL","type":"tf","question":"True or false: a routine task solved daily in industry demonstrates WP4 if it is new to the student.","options":["True","False"],"correctAnswer":1,"explanation":"WP4 concerns novelty in engineering practice, not personal unfamiliarity.","topic":"WP"},{"id":"m2l4-c","dept":"ALL","type":"mcq","question":"Why does a system with many interacting subsystems call for WP7 thinking?","options":["Because it has many parts","Because a decision in one subsystem changes the behaviour, cost or risk of others","Because the report is long","Because it is expensive"],"correctAnswer":1,"explanation":"Interdependence, not quantity, is the point.","topic":"WP"},{"id":"m2l4-eee","dept":"EEE","type":"mcq","question":"Finance wants lowest cost, safety wants redundant protection, students want dashboards, IT refuses new network exposure and the utility must approve exports. Working across these groups most directly shows:","options":["WP6","WP3","WP5","WP1"],"correctAnswer":0,"explanation":"Diverse stakeholders with widely varying needs: WP6.","topic":"WP"},{"id":"m2l4-cse","dept":"CSE","type":"mcq","question":"Changing the model's input features forced changes to the data pipeline, the API schema, the clinician interface and the privacy review. This is evidence of:","options":["WP4","WP7","WP5","WP1"],"correctAnswer":1,"explanation":"Subsystems constrain each other: WP7.","topic":"WP"},{"id":"m2l4-te","dept":"TE","type":"mcq","question":"A mill must process a new bio-based fibre whose dyeing behaviour has not been documented in the literature or by suppliers. Which WP is most directly highlighted?","options":["WP4","WP6","WP2","WP7"],"correctAnswer":0,"explanation":"An infrequently encountered or novel issue: WP4.","topic":"WP"}]},{"id":"m2-l5","title":"Complex activity characteristics: EA1–EA5","summary":"EA attributes describe what makes an engineering activity or project complex.","body":"\u003cp class=\"lead\">Where WP describes the \u003cstrong>problem\u003c/strong>, EA describes the \u003cstrong>activity or project\u003c/strong>.\u003c/p>\n\u003cdiv class=\"principle\">\u003cp>Complex engineering activities or projects may have some or all of EA1 to EA5.\u003c/p>\u003csmall>No activity is required to show all five.\u003c/small>\u003c/div>\n\u003cdiv data-widget=\"eaCards\">\u003c/div>\n\u003cdiv class=\"principle\">\u003cp>Innovation should have an engineering purpose.\u003c/p>\u003csmall>Simply using a new technology does not make an activity complex (EA3).\u003c/small>\u003c/div>","dept":{"EEE":"","CSE":"","TE":""},"questions":[{"id":"m2l5-a","dept":"ALL","type":"tf","question":"True or false: every complex engineering activity must demonstrate all of EA1 to EA5.","options":["True","False"],"correctAnswer":1,"explanation":"Complex activities may have some or all of EA1–EA5.","topic":"EA"},{"id":"m2l5-b","dept":"ALL","type":"mcq","question":"A team adds a trendy technology to its project with no engineering need identified. Does this demonstrate EA3?","options":["Yes, any new technology counts","No: EA3 needs innovative solutions for a conscious purpose, using engineering principles and research-based knowledge","Yes, if it looks modern","Only if it is expensive"],"correctAnswer":1,"explanation":"Innovation in EA3 must serve a purpose and draw on research-based knowledge.","topic":"EA"},{"id":"m2l5-c","dept":"ALL","type":"mcq","question":"What distinguishes EA2 from WP2?","options":["Nothing","WP2 says conflicting requirements exist; EA2 says the activity must resolve those interactions optimally","EA2 is about money only","WP2 is about people only"],"correctAnswer":1,"explanation":"EA2 focuses on optimal resolution of interacting issues.","topic":"EA"},{"id":"m2l5-eee","dept":"EEE","type":"match","question":"Match each smart-campus activity statement to its EA attribute.","options":["EA1","EA2","EA3","EA4","EA5"],"correctAnswer":null,"explanation":"Resources EA1, research-based method EA3, consequences EA4, new application of principles EA5.","topic":"EA","items":[{"prompt":"Engineers, budget, sensors, test equipment, datasets and simulation software are all needed","answer":0},{"prompt":"A research-based anomaly-detection method is adapted for campus load data","answer":2},{"prompt":"Failure could affect electrical safety and campus operations in hard-to-predict ways","answer":3},{"prompt":"Established control principles are applied to a monitoring type never deployed on campus","answer":4}]},{"id":"m2l5-cse","dept":"CSE","type":"match","question":"Match each triage-system activity statement to its EA attribute.","options":["EA1","EA2","EA3","EA4","EA5"],"correctAnswer":null,"explanation":"Optimal resolution EA2, resources EA1, consequences EA4, new application of principles EA5.","topic":"EA","items":[{"prompt":"Accuracy, latency, privacy and cost must be resolved together for the best overall result","answer":1},{"prompt":"Developers, clinicians, labelled data, cloud credits and GPUs are needed","answer":0},{"prompt":"Under-triage could delay critical care for many patients","answer":3},{"prompt":"Established security principles are applied to a platform the team has never built","answer":4}]},{"id":"m2l5-te","dept":"TE","type":"match","question":"Match each dyeing-project activity statement to its EA attribute.","options":["EA1","EA2","EA3","EA4","EA5"],"correctAnswer":null,"explanation":"Optimal resolution EA2, research-based innovation EA3, consequences EA4, resources EA1.","topic":"EA","items":[{"prompt":"Shade quality, throughput, water use and compliance are resolved together","answer":1},{"prompt":"Published enzymatic pretreatment research is adapted to cut energy use","answer":2},{"prompt":"An effluent breach could pollute the river and harm the community","answer":3},{"prompt":"Chemists, water, chemicals, lab equipment and ETP capacity are all required","answer":0}]}]},{"id":"m2-l6","title":"Engineering judgment, constraints, stakeholders, uncertainty, trade-offs and validation","summary":"The practical elements that turn a hard task into a complex, evidenced engineering problem.","body":"\u003cdiv class=\"cols\">\u003cdiv class=\"box\">\u003ch4>Constraints\u003c/h4>\u003cp>Limits the solution must respect: budget, existing equipment, regulations, time, skills.\u003c/p>\u003c/div>\n\u003cdiv class=\"box\">\u003ch4>Trade-offs\u003c/h4>\u003cp>Improving one requirement worsens another. The conflict and its resolution must be documented.\u003c/p>\u003c/div>\n\u003cdiv class=\"box\">\u003ch4>Stakeholders\u003c/h4>\u003cp>People and groups affected by or influencing the solution, often with conflicting needs.\u003c/p>\u003c/div>\n\u003cdiv class=\"box\">\u003ch4>Uncertainty\u003c/h4>\u003cp>What is unknown or hard to predict: operating conditions, data, material or user behaviour.\u003c/p>\u003c/div>\n\u003cdiv class=\"box\">\u003ch4>Engineering judgment\u003c/h4>\u003cp>Choosing among alternatives under constraints and uncertainty, with recorded reasons.\u003c/p>\u003c/div>\n\u003cdiv class=\"box\">\u003ch4>Validation\u003c/h4>\u003cp>Showing, with tests or trials, that the solution meets its requirements in realistic conditions.\u003c/p>\u003c/div>\u003c/div>\n\u003ch3>Trade-off explorer\u003c/h3>\u003cp>Move each slider towards the requirement you would prioritise and read the consequence.\u003c/p>\n\u003cdiv data-widget=\"tradeoffs\">\u003c/div>\n\u003ch3>Stakeholder map\u003c/h3>\u003cp>Select a stakeholder to see their needs and typical conflict.\u003c/p>\n\u003cdiv data-widget=\"stakeholders\">\u003c/div>","dept":{"EEE":"","CSE":"","TE":""},"questions":[{"id":"m2l6-a","dept":"ALL","type":"mcq","question":"Which best describes engineering judgment in a CEP report?","options":["Choosing the cheapest option","Selecting among documented alternatives under constraints and uncertainty, with recorded reasons","Following the supervisor's preference","Using the newest technology"],"correctAnswer":1,"explanation":"Judgment is a reasoned, recorded choice among alternatives.","topic":"Engineering judgment"},{"id":"m2l6-b","dept":"ALL","type":"tf","question":"True or false: validation means showing, through tests or trials, that the solution meets its requirements.","options":["True","False"],"correctAnswer":0,"explanation":"Validation provides evidence against the stated requirements.","topic":"Engineering judgment"},{"id":"m2l6-c","dept":"ALL","type":"mcq","question":"Which statement describes uncertainty rather than a constraint?","options":["The budget is fixed at BDT 20 lakh","Field behaviour of the system under real operating conditions is not well known","The design must use existing machines","The project must finish in one semester"],"correctAnswer":1,"explanation":"Constraints are known limits; uncertainty is what is unknown or hard to predict.","topic":"Engineering judgment"},{"id":"m2l6-eee","dept":"EEE","type":"match","question":"Match each smart-campus statement to the concept it illustrates.","options":["Constraint","Trade-off","Uncertainty","Validation"],"correctAnswer":null,"explanation":"Fixed IT policy is a constraint; sampling vs battery a trade-off; indoor wireless reliability unknown is uncertainty; pilot comparison is validation.","topic":"Engineering judgment","items":[{"prompt":"Campus IT policy forbids new devices on the main network","answer":0},{"prompt":"Faster sampling shortens sensor battery life","answer":1},{"prompt":"Wireless reliability inside thick-walled buildings is not known","answer":2},{"prompt":"Detection was compared with logged events in a two-building pilot","answer":3}]},{"id":"m2l6-cse","dept":"CSE","type":"match","question":"Match each triage-system statement to the concept it illustrates.","options":["Constraint","Trade-off","Uncertainty","Validation"],"correctAnswer":null,"explanation":"Data-protection rules are a constraint; accuracy vs explainability a trade-off; under-represented groups is uncertainty; testing at a second hospital is validation.","topic":"Engineering judgment","items":[{"prompt":"Data-protection rules prevent patient data leaving the country","answer":0},{"prompt":"The most accurate model is the hardest to explain to clinicians","answer":1},{"prompt":"Model behaviour on under-represented patient groups is unknown","answer":2},{"prompt":"The model was tested on data from a second hospital","answer":3}]},{"id":"m2l6-te","dept":"TE","type":"match","question":"Match each dyeing-project statement to the concept it illustrates.","options":["Constraint","Trade-off","Uncertainty","Validation"],"correctAnswer":null,"explanation":"Existing machines are a constraint; liquor ratio vs levelness a trade-off; effluent variation is uncertainty; pilot batches measured are validation.","topic":"Engineering judgment
