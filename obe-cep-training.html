","items":[{"prompt":"The mill must use its existing dyeing machines","answer":0},{"prompt":"Lower liquor ratio saves water but raises unlevel-dyeing risk","answer":1},{"prompt":"Effluent load varies unpredictably with dye batch","answer":2},{"prompt":"Pilot batches were measured for water, energy and shade difference","answer":3}]}]},{"id":"m2-l7","title":"Identifying CEP characteristics: department case study","summary":"Read the case from your discipline and identify the WP characteristics.","body":"\u003cp class=\"lead\">Read the case, then identify which WP characteristic each statement most directly evidences.\u003c/p>\n\u003cdiv data-widget=\"caseStudy\">\u003c/div>","dept":{"EEE":"","CSE":"","TE":""},"questions":[{"id":"m2l7-a","dept":"ALL","type":"mcq","question":"When identifying WP characteristics in a case, what should you look for?","options":["Advanced keywords","Statements that evidence each characteristic, backed by documents","The number of team members","The project budget only"],"correctAnswer":1,"explanation":"Identification is evidence-based.","topic":"CEP identification"},{"id":"m2l7-e1","dept":"EEE","type":"pick","question":"“The system requires in-depth electrical, embedded, communication and data-analysis knowledge, applied from first principles.”","options":["WP1","WP2","WP3","WP4","WP5","WP6","WP7"],"correctAnswer":0,"explanation":"In-depth knowledge for a first-principles approach: WP1.","topic":"WP"},{"id":"m2l7-e2","dept":"EEE","type":"pick","question":"“The team must balance cost, reliability, accuracy and scalability.”","options":["WP1","WP2","WP3","WP4","WP5","WP6","WP7"],"correctAnswer":1,"explanation":"Conflicting requirements: WP2.","topic":"WP"},{"id":"m2l7-e3","dept":"EEE","type":"pick","question":"“Existing codes cover the wiring, but no standard addresses wireless sensing that triggers protective actions in this configuration.”","options":["WP1","WP2","WP3","WP4","WP5","WP6","WP7"],"correctAnswer":4,"explanation":"Beyond what codes encompass: WP5.","topic":"WP"},{"id":"m2l7-e4","dept":"EEE","type":"pick","question":"“The system requires collaboration between EEE, CSE/IT, facility management and administration.”","options":["WP1","WP2","WP3","WP4","WP5","WP6","WP7"],"correctAnswer":5,"explanation":"Cross-discipline and stakeholder collaboration: WP6.","topic":"WP"},{"id":"m2l7-e5","dept":"EEE","type":"pick","question":"“Sensors, communication, analytics, databases and electrical infrastructure must operate together.”","options":["WP1","WP2","WP3","WP4","WP5","WP6","WP7"],"correctAnswer":6,"explanation":"Interdependent subsystems: WP7.","topic":"WP"},{"id":"m2l7-c1","dept":"CSE","type":"pick","question":"“The system needs in-depth knowledge of machine learning, distributed systems and security, applied from first principles to clinical data.”","options":["WP1","WP2","WP3","WP4","WP5","WP6","WP7"],"correctAnswer":0,"explanation":"In-depth knowledge with a fundamentals-based approach: WP1.","topic":"WP"},{"id":"m2l7-c2","dept":"CSE","type":"pick","question":"“Accuracy, explainability, patient privacy and cloud cost pull in different directions.”","options":["WP1","WP2","WP3","WP4","WP5","WP6","WP7"],"correctAnswer":1,"explanation":"Conflicting technical and non-technical requirements: WP2.","topic":"WP"},{"id":"m2l7-c3","dept":"CSE","type":"pick","question":"“Current regulations and standards do not fully address AI-assisted triage decisions in this hospital setting.”","options":["WP1","WP2","WP3","WP4","WP5","WP6","WP7"],"correctAnswer":4,"explanation":"Not encompassed by standards and codes: WP5.","topic":"WP"},{"id":"m2l7-c4","dept":"CSE","type":"pick","question":"“Doctors, nurses, hospital IT, management and an ethics board must agree on requirements.”","options":["WP1","WP2","WP3","WP4","WP5","WP6","WP7"],"correctAnswer":5,"explanation":"Diverse stakeholders: WP6.","topic":"WP"},{"id":"m2l7-c5","dept":"CSE","type":"pick","question":"“The data pipeline, model, API, clinician interface and monitoring must work as one system.”","options":["WP1","WP2","WP3","WP4","WP5","WP6","WP7"],"correctAnswer":6,"explanation":"Interdependence: WP7.","topic":"WP"},{"id":"m2l7-t1","dept":"TE","type":"pick","question":"“The redesign needs in-depth dye-fibre chemistry, mass transfer and machine knowledge, reasoned from first principles.”","options":["WP1","WP2","WP3","WP4","WP5","WP6","WP7"],"correctAnswer":0,"explanation":"In-depth knowledge with a fundamentals-based approach: WP1.","topic":"WP"},{"id":"m2l7-t2","dept":"TE","type":"pick","question":"“Water saving, energy saving, right-first-time shade and buyer compliance conflict.”","options":["WP1","WP2","WP3","WP4","WP5","WP6","WP7"],"correctAnswer":1,"explanation":"Conflicting requirements: WP2.","topic":"WP"},{"id":"m2l7-t3","dept":"TE","type":"pick","question":"“No existing model predicts shade response at the very low liquor ratio planned, so the team must build one from trials.”","options":["WP1","WP2","WP3","WP4","WP5","WP6","WP7"],"correctAnswer":2,"explanation":"No obvious solution; model formulation: WP3.","topic":"WP"},{"id":"m2l7-t4","dept":"TE","type":"pick","question":"“Buyers, auditors, dyeing masters, environmental engineers and management have different priorities.”","options":["WP1","WP2","WP3","WP4","WP5","WP6","WP7"],"correctAnswer":5,"explanation":"Diverse stakeholders: WP6.","topic":"WP"},{"id":"m2l7-t5","dept":"TE","type":"pick","question":"“Machine settings, chemical dosing, heat recovery and the effluent treatment plant affect each other.”","options":["WP1","WP2","WP3","WP4","WP5","WP6","WP7"],"correctAnswer":6,"explanation":"Interdependence: WP7.","topic":"WP"}]},{"id":"m2-l8","title":"Is this a Complex Engineering Problem?","summary":"Classify a scenario and justify it with WP, WK, EA and evidence.","body":"\u003cdiv class=\"principle\">\u003cp>A difficult engineering problem is not automatically a Complex Engineering Problem.\u003c/p>\u003csmall>Choose \"Insufficient evidence\" when the description does not support a judgment. Justify every classification.\u003c/small>\u003c/div>\n\u003cp class=\"lead\">Read the scenario from your discipline and answer every part.\u003c/p>\n\u003cdiv data-widget=\"cepScenario\">\u003c/div>","dept":{"EEE":"","CSE":"","TE":""},"questions":[{"id":"m2l8-a","dept":"ALL","type":"tf","question":"True or false: a CEP classification should be justified by listing the evidence for each claimed characteristic.","options":["True","False"],"correctAnswer":0,"explanation":"Evidence turns a claim into a demonstration.","topic":"CEP identification"},{"id":"m2l8-e1","dept":"EEE","type":"triad","question":"Part 1: Is the wearable monitoring scenario sufficiently demonstrated as a CEP?","options":["Yes","No","Insufficient evidence"],"correctAnswer":0,"explanation":"WP1 is evidenced (signal processing from first principles), with WP2, WP6 and WP7.","topic":"CEP identification"},{"id":"m2l8-e2","dept":"EEE","type":"multi","question":"Part 2: Which WP characteristics are clearly evidenced? Select all that apply.","options":["WP1","WP2","WP3","WP4","WP5","WP6","WP7"],"correctAnswer":[0,1,5,6],"explanation":"First-principles processing (WP1), battery-accuracy-cost trade-off (WP2), clinicians and ethics committee (WP6), sensor-wireless-firmware-cloud integration (WP7). No evidence is given for WP3–WP5 beyond WP1.","topic":"WP"},{"id":"m2l8-e3","dept":"EEE","type":"multi","question":"Part 3: Which WK areas are most clearly required? Select all that apply.","options":["WK1","WK2","WK3","WK4","WK5","WK6","WK7","WK8","WK9"],"correctAnswer":[1,3,8],"explanation":"Signal processing and statistics (WK2), specialist biomedical and embedded knowledge (WK4), ethics and inclusive design for elderly patients (WK9).","topic":"WK"},{"id":"m2l8-e4","dept":"EEE","type":"multi","question":"Part 4: Which EA characteristics may be involved? Select all that apply.","options":["EA1","EA2","EA3","EA4","EA5"],"correctAnswer":[0,3],"explanation":"Diverse resources (EA1) and significant, hard-to-predict consequences for patients (EA4) are evidenced.","topic":"EA"},{"id":"m2l8-e5","dept":"EEE","type":"mcq","question":"Part 5: Which evidence would best support the WP2 claim?","options":["The project title","A documented trade-off study of battery life, accuracy and cost with the chosen balance justified","A photo of the device","A list of components"],"correctAnswer":1,"explanation":"A documented trade-off with justification demonstrates WP2.","topic":"Evidence"},{"id":"m2l8-c1","dept":"CSE","type":"triad","question":"Part 1: Is the bank intrusion detection scenario sufficiently demonstrated as a CEP?","options":["Yes","No","Insufficient evidence"],"correctAnswer":0,"explanation":"WP1 is evidenced, with WP2, WP3, WP6 and WP7.","topic":"CEP identification"},{"id":"m2l8-c2","dept":"CSE","type":"multi","question":"Part 2: Which WP characteristics are clearly evidenced? Select all that apply.","options":["WP1","WP2","WP3","WP4","WP5","WP6","WP7"],"correctAnswer":[0,1,2,5,6],"explanation":"In-depth security and ML knowledge (WP1), conflicting sensitivity, cost and privacy (WP2), self-formulated models (WP3), multiple stakeholders (WP6), integrated pipeline (WP7).","topic":"WP"},{"id":"m2l8-c3","dept":"CSE","type":"multi","question":"Part 3: Which WK areas are most clearly required? Select all that apply.","options":["WK1","WK2","WK3","WK4","WK5","WK6","WK7","WK8","WK9"],"correctAnswer":[1,3,6],"explanation":"Statistics and ML evaluation (WK2), specialist security knowledge (WK4), societal impact of financial data protection (WK7).","topic":"WK"},{"id":"m2l8-c4","dept":"CSE","type":"multi","question":"Part 4: Which EA characteristics may be involved? Select all that apply.","options":["EA1","EA2","EA3","EA4","EA5"],"correctAnswer":[1,3],"explanation":"Optimal resolution of sensitivity, latency, cost and privacy (EA2) and severe consequences of a missed intrusion (EA4).","topic":"EA"},{"id":"m2l8-c5","dept":"CSE","type":"mcq","question":"Part 5: Which evidence would best support the WP3 claim?","options":["The tools installed","A record showing why public datasets were insufficient and how features and models were formulated and validated","The team's GitHub profile pictures","The project budget"],"correctAnswer":1,"explanation":"Showing why no ready model fits, and how one was formulated, evidences WP3.","topic":"Evidence"},{"id":"m2l8-t1","dept":"TE","type":"triad","question":"Part 1: Is the garment quality-control scenario sufficiently demonstrated as a CEP?","options":["Yes","No","Insufficient evidence"],"correctAnswer":0,"explanation":"WP1 is evidenced, with WP2, WP3, WP5, WP6 and WP7.","topic":"CEP identification"},{"id":"m2l8-t2","dept":"TE","type":"multi","question":"Part 2: Which WP characteristics are clearly evidenced? Select all that apply.","options":["WP1","WP2","WP3","WP4","WP5","WP6","WP7"],"correctAnswer":[0,1,2,4,5,6],"explanation":"Deep knowledge of fabrics and vision (WP1), speed-accuracy-cost conflict (WP2), formulated inspection model (WP3), standards assume manual inspection (WP5), many stakeholders (WP6), integrated line system (WP7).","topic":"WP"},{"id":"m2l8-t3","dept":"TE","type":"multi","question":"Part 3: Which WK areas are most clearly required? Select all that apply.","options":["WK1","WK2","WK3","WK4","WK5","WK6","WK7","WK8","WK9"],"correctAnswer":[2,3,5],"explanation":"Fabric and garment fundamentals (WK3), specialist vision and quality knowledge (WK4), production-line technology practice (WK6).","topic":"WK"},{"id":"m2l8-t4","dept":"TE","type":"multi","question":"Part 4: Which EA characteristics may be involved? Select all that apply.","options":["EA1","EA2","EA3","EA4","EA5"],"correctAnswer":[0,1],"explanation":"Diverse resources (EA1) and optimal resolution of speed, accuracy and cost (EA2) are evidenced.","topic":"EA"},{"id":"m2l8-t5","dept":"TE","type":"mcq","question":"Part 5: Which evidence would best support the WP5 claim?","options":["The factory's logo","An analysis showing which inspection standard clauses assume manual inspection and how the team justified its approach beyond them","A list of cameras","Line speed alone"],"correctAnswer":1,"explanation":"Showing where standards stop and how decisions were justified evidences WP5.","topic":"Evidence"}]},{"id":"m2-l9","title":"Developing evidence and CEP documentation","summary":"Document context, knowledge, characteristics, judgment and validation.","body":"\u003cp class=\"lead\">Students should document the following in a course project, FYDP or thesis. Open each item to see what to write and an example from your discipline.\u003c/p>\n\u003cdiv data-widget=\"evidenceDocs\">\u003c/div>\n\u003ch3>CEP evidence table\u003c/h3>\n\u003cdiv class=\"caution\">\u003cstrong>Illustrative only.\u003c/strong> This shows how evidence maps to attributes. It is not a requirement that every project satisfies every attribute. A CEP needs WP1 and some or all of WP2–WP7.\u003c/div>\n\u003cdiv data-widget=\"evidenceTable\">\u003c/div>","dept":{"EEE":"","CSE":"","TE":""},"questions":[{"id":"m2l9-a","dept":"ALL","type":"tf","question":"True or false: a project must document evidence for all twelve attributes in the evidence table to be accepted as a CEP.","options":["True","False"],"correctAnswer":1,"explanation":"The table is illustrative; WP1 plus some or all of WP2–WP7 is needed.","topic":"Evidence"},{"id":"m2l9-b","dept":"ALL","type":"mcq","question":"Which is the strongest evidence of conflicting requirements (WP2)?","options":["The title includes 'smart'","A trade-off table comparing alternatives on the conflicting criteria, with justification","An abstract claiming complexity","A list of software used"],"correctAnswer":1,"explanation":"A documented trade-off with justification demonstrates WP2.","topic":"Evidence"},{"id":"m2l9-c","dept":"ALL","type":"mcq","question":"Which documentation item records why one solution was chosen over others?","options":["Problem context","Stakeholders","Engineering judgment","Consequences"],"correctAnswer":2,"explanation":"Engineering judgment explains the reasoning behind the choice.","topic":"Evidence"},{"id":"m2l9-eee","dept":"EEE","type":"mcq","question":"“Pilot in two buildings; anomaly detection compared with logged electrical events.” Which documentation item is this?","options":["Alternatives","Validation","Constraints","Problem context"],"correctAnswer":1,"explanation":"Testing the solution against reality is validation.","topic":"Evidence"},{"id":"m2l9-cse","dept":"CSE","type":"mcq","question":"“Considered rule-based scoring, gradient boosting and a deep-learning model.” Which documentation item is this?","options":["Alternatives","Validation","Consequences","Stakeholders"],"correctAnswer":0,"explanation":"Listing candidate solutions documents alternatives.","topic":"Evidence"},{"id":"m2l9-te","dept":"TE","type":"mcq","question":"“Effluent COD varies with dye batch in ways the team cannot fully predict.” Which documentation item is this?","options":["Uncertainty","Requirements","Engineering judgment","Validation"],"correctAnswer":0,"explanation":"An unknown, hard-to-predict factor is uncertainty.","topic":"Evidence"}]}],"final":[{"id":"f2-1","dept":"ALL","type":"tf","question":"True or false: a CEP must demonstrate all seven WP characteristics.","options":["True","False"],"correctAnswer":1,"explanation":"","topic":"WP"},{"id":"f2-2","dept":"ALL","type":"mcq","question":"Which statement correctly describes WP1?","options":["The problem uses advanced software","The problem cannot be resolved without in-depth engineering knowledge at the level of WK3, WK4, WK5, WK6 or WK8, allowing a fundamentals-based, first-principles approach","The problem has many stakeholders","The problem is not covered by codes"],"correctAnswer":1,"explanation":"","topic":"WP"},{"id":"f2-3","dept":"ALL","type":"mcq","question":"Professional responsibility to public safety and sustainable development is described in:","options":["WK6","WK7","WK3","WK1"],"correctAnswer":1,"explanation":"","topic":"WK"},{"id":"f2-4","dept":"ALL","type":"mcq","question":"Engagement with current research literature and critical evaluation of emerging issues is:","options":["WK8","WK2","WK5","WK9"],"correctAnswer":0,"explanation":"","topic":"WK"},{"id":"f2-5","dept":"ALL","type":"mcq","question":"Which best demonstrates WP3?","options":["A long standard calculation with given data","Formulating a new model because existing models do not fit observed data","Choosing a part from a catalogue","Re-running a textbook example"],"correctAnswer":1,"explanation":"","topic":"WP"},{"id":"f2-6","dept":"ALL","type":"mcq","question":"When is WP5 relevant?","options":["Whenever no dedicated standard exists","When the problem extends beyond what standards and codes adequately encompass","Whenever a standard is cited","Never in practice"],"correctAnswer":1,"explanation":"","topic":"WP"},{"id":"f2-7","dept":"ALL","type":"mcq","question":"Using people, data, financial and physical resources and design software demonstrates:","options":["EA1","EA3","EA4","EA5"],"correctAnswer":0,"explanation":"","topic":"EA"},{"id":"f2-8","dept":"ALL","type":"mcq","question":"Applying principles-based approaches to extend beyond previous experience is:","options":["EA2","EA3","EA4","EA5"],"correctAnswer":3,"explanation":"","topic":"EA"},{"id":"f2-9","dept":"ALL","type":"triad","question":"Is this sufficiently demonstrated as a CEP? “We used Python and a deep-learning library to build a model.” No context, requirements or stakeholders are given.","options":["Yes","No","Insufficient evidence"],"correctAnswer":2,"explanation":"","topic":"CEP identification"},{"id":"f2-10","dept":"ALL","type":"mcq","question":"Which documentation item explains why a solution was selected?","options":["Engineering judgment","Problem context","Stakeholders","Consequences"],"correctAnswer":0,"explanation":"","topic":"Evidence"},{"id":"f2-eee1","dept":"EEE","type":"mcq","question":"Retrofitting motor drives in an industrial plant: harmonic limits, efficiency and cost conflict, and future load growth must be planned. Which WP?","options":["WP2","WP4","WP5","WP7"],"correctAnswer":0,"explanation":"","topic":"WP"},{"id":"f2-eee2","dept":"EEE","type":"mcq","question":"An IoT electrical monitoring network: changing the radio protocol forced redesign of sensor power budgets and database schema. This shows:","options":["WP7","WP4","WP1","WP5"],"correctAnswer":0,"explanation":"","topic":"WP"},{"id":"f2-eee3","dept":"EEE","type":"mcq","question":"A protection-setting error could black out a hospital and a water-pumping station with cascading effects. This is:","options":["EA1","EA2","EA4","EA5"],"correctAnswer":2,"explanation":"","topic":"EA"},{"id":"f2-eee4","dept":"EEE","type":"triad","question":"Is this a CEP? “Replace a failed circuit breaker with an identical one of the same rating from the manufacturer's table.”","options":["Yes","No","Insufficient evidence"],"correctAnswer":1,"explanation":"","topic":"CEP identification"},{"id":"f2-eee5","dept":"EEE","type":"mcq","question":"A wearable ECG monitor: (i) specialist biomedical signal-processing knowledge; (ii) a missed arrhythmia could harm a patient; (iii) battery life conflicts with sampling accuracy. Correct classification?","options":["(i) WP7, (ii) WK7, (iii) EA1","(i) WK4, (ii) EA4, (iii) WP2","(i) EA3, (ii) WP4, (iii) WK2","(i) WK9, (ii) EA5, (iii) WP6"],"correctAnswer":1,"explanation":"","topic":"CEP identification"},{"id":"f2-cse1","dept":"CSE","type":"mcq","question":"A cloud information system must balance availability, cost, data-protection law and future growth. Which WP?","options":["WP2","WP3","WP4","WP7"],"correctAnswer":0,"explanation":"","topic":"WP"},{"id":"f2-cse2","dept":"CSE","type":"mcq","question":"Securing an application against a newly emerging class of attack with little documented practice most directly shows:","options":["WP4","WP6","WP1","WP7"],"correctAnswer":0,"explanation":"","topic":"WP"},{"id":"f2-cse3","dept":"CSE","type":"mcq","question":"A computer-vision system for traffic enforcement could wrongly fine thousands of drivers, with effects hard to foresee. This is:","options":["EA1","EA4","EA3","EA5"],"correctAnswer":1,"explanation":"","topic":"EA"},{"id":"f2-cse4","dept":"CSE","type":"triad","question":"Is this a CEP? “Write a SQL query to list customers with orders above BDT 10,000 from a given table.”","options":["Yes","No","Insufficient evidence"],"correctAnswer":1,"explanation":"","topic":"CEP identification"},{"id":"f2-cse5","dept":"CSE","type":"mcq","question":"A healthcare AI system: (i) specialist deep-learning knowledge; (ii) accuracy conflicts with explainability; (iii) misdiagnosis could harm many patients. Correct classification?","options":["(i) WK4, (ii) WP2, (iii) EA4","(i) WP6, (ii) WK2, (iii) EA1","(i) EA3, (ii) WP7, (iii) WK7","(i) WK1, (ii) EA5, (iii) WP4"],"correctAnswer":0,"explanation":"","topic":"CEP identification"},{"id":"f2-te1","dept":"TE","type":"mcq","question":"Selecting sustainable materials for a garment line requires balancing cost, durability, recyclability and buyer certification. Which WP?","options":["WP2","WP4","WP5","WP3"],"correctAnswer":0,"explanation":"","topic":"WP"},{"id":"f2-te2","dept":"TE","type":"mcq","question":"Optimising a weaving shed: changing loom speed affected warp breakage, air-conditioning load and power demand. This shows:","options":["WP7","WP4","WP5","WP1"],"correctAnswer":0,"explanation":"","topic":"WP"},{"id":"f2-te3","dept":"TE","type":"mcq","question":"An effluent treatment failure could pollute a river used by several communities, with effects hard to mitigate. This is:","options":["EA1","EA2","EA4","EA5"],"correctAnswer":2,"explanation":"","topic":"EA"},{"id":"f2-te4","dept":"TE","type":"triad","question":"Is this a CEP? “Calculate the GSM of a fabric sample from its weight and dimensions.”","options":["Yes","No","Insufficient evidence"],"correctAnswer":1,"explanation":"","topic":"CEP identification"},{"id":"f2-te5","dept":"TE","type":"mcq","question":"An energy-efficient dyeing project: (i) dye-fibre chemistry knowledge; (ii) water saving conflicts with levelness; (iii) adapted research on enzymatic pretreatment. Correct classification?","options":["(i) WK1, (ii) WP2, (iii) EA3","(i) WP7, (ii) WK5, (iii) EA1","(i) EA4, (ii) WP6, (iii) WK8","(i) WK9, (ii) EA2, (iii) WP3"],"correctAnswer":0,"explanation":"","topic":"CEP identification"}],"certCode":"CEP"}]}</script>
<script>
/* =====================================================================
   Basic OBE & CEP Self-Paced Training: application engine
   Content lives in <script id="content-data"> (JSON) and can be edited
   from Admin mode. Normally no need to edit this code.
   ===================================================================== */
'use strict';
const PRISTINE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
const LS_CONTENT = 'obecep_content_v2', LS_PROG = 'obecep_progress_v2', SS_ADMIN = 'obecep_admin_session';
const DEPTS = ['EEE','CSE','TE'];
const TYPE_LABEL = {mcq:'Multiple choice', tf:'True or false', multi:'Multiple select: choose all that apply', match:'Matching', pick:'Identify the level or attribute', triad:'Is it a CEP?'};
const DEFAULT_CONTENT = JSON.parse(document.getElementById('content-data').textContent);

/* ---------- storage ---------- */
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); return true; } catch(e){ return false; } }
function lsDel(k){ try { localStorage.removeItem(k); } catch(e){} }
function ssGet(k){ try { return sessionStorage.getItem(k); } catch(e){ return null; } }
function ssSet(k,v){ try { sessionStorage.setItem(k,v); } catch(e){} }
function ssDel(k){ try { sessionStorage.removeItem(k); } catch(e){} }

let contentSavedAt = null;
function loadContent(){
  const raw = lsGet(LS_CONTENT);
  if (raw){ try { const o = JSON.parse(raw); if (o && o.content && Array.isArray(o.content.modules)){ contentSavedAt = o.savedAt; return o.content; } } catch(e){} }
  return clone(DEFAULT_CONTENT);
}
function saveContent(){ contentSavedAt = new Date().toISOString(); const ok = lsSet(LS_CONTENT, JSON.stringify({savedAt:contentSavedAt, content})); toast(ok ? 'Saved' : 'Could not save: browser storage is full or blocked'); }
function newProfile(){ return {name:'', dept:'', email:'', lessons:{}, q:{}, finals:{}, combinedCertId:null}; }
function loadProg(){
  const raw = lsGet(LS_PROG);
  if (raw){ try { const p = JSON.parse(raw); if (p && p.profiles){ ['user','preview'].forEach(k=>{ if(!p.profiles[k]) p.profiles[k]=newProfile(); }); return p; } } catch(e){} }
  return {profiles:{user:newProfile(), preview:newProfile()}};
}
function saveProg(){ lsSet(LS_PROG, JSON.stringify(prog)); }

let content = loadContent();
let prog = loadProg();
let mode = ssGet(SS_ADMIN) ? (ssGet(SS_ADMIN)==='preview' ? 'admin-preview' : 'admin-edit') : 'user';
let view = {name:'welcome'};
const exam = {};
const adm = {tab:'overview', mod:'m1', li:0, editQ:null, qScope:'lesson', finalMod:'m1'};

/* ---------- helpers ---------- */
function $(s,r){ return (r||document).querySelector(s); }
function $all(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function announce(m){ const el=$('#srLive'); el.textContent=''; setTimeout(()=>{ el.textContent=m; },40); }
let toastTimer=null;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200); }
function fmtDate(iso){ try { return new Date(iso).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}); } catch(e){ return iso; } }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function rand6(){ const ch='ABCDEFGHJKLMNPQRSTUVWXYZ23456789', a=new Uint32Array(6); if(window.crypto&&crypto.getRandomValues) crypto.getRandomValues(a); else for(let i=0;i<6;i++) a[i]=Math.floor(Math.random()*4e9); let s=''; for(let i=0;i<6;i++) s+=ch[a[i]%ch.length]; return s; }
function download(name, text, type){ const b=new Blob([text],{type:type||'text/plain'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); }

/* Pure-JS SHA-256 (works on file:// where crypto.subtle may be unavailable) */
function sha256(str){
  const ascii = unescape(encodeURIComponent(str));
  function rr(v,a){ return (v>>>a)|(v<<(32-a)); }
  const maxWord=Math.pow(2,32); let result=''; const words=[]; const bitLen=ascii.length*8;
  let hash=[]; const k=[]; let pc=0; const comp={};
  for(let c=2;pc<64;c++){ if(!comp[c]){ for(let i=0;i<313;i+=c) comp[i]=c; hash[pc]=(Math.pow(c,.5)*maxWord)|0; k[pc++]=(Math.pow(c,1/3)*maxWord)|0; } }
  let s=ascii+'\x80'; while(s.length%64-56) s+='\x00';
  for(let i=0;i<s.length;i++){ const j=s.charCodeAt(i); words[i>>2]|=j<<((3-i)%4)*8; }
  words[words.length]=((bitLen/maxWord)|0); words[words.length]=bitLen;
  for(let j=0;j<words.length;){
    const w=words.slice(j,j+=16), old=hash; hash=hash.slice(0,8);
    for(let i=0;i<64;i++){
      const w15=w[i-15], w2=w[i-2], a=hash[0], e=hash[4];
      const t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash); hash[4]=(hash[4]+t1)|0;
    }
    for(let i=0;i<8;i++) hash[i]=(hash[i]+old[i])|0;
  }
  for(let i=0;i<8;i++) for(let j=3;j+1;j--){ const b=(hash[i]>>(j*8))&255; result+=((b<16)?'0':'')+b.toString(16); }
  return result;
}

/* ---------- profile & progress ---------- */
function P(){ return prog.profiles[mode==='user' ? 'user' : 'preview']; }
function dept(){ return P().dept || 'EEE'; }
function deptName(d){ const x=content.departments[d||dept()]; return x ? x.name : ''; }
function registered(){ return !!(P().name && P().dept); }
function mod(id){ return content.modules.find(m=>m.id===id); }
function qsFor(list){ const d=dept(); return (list||[]).filter(q=>q.dept==='ALL'||q.dept===d); }
function qst(id){ const p=P(); if(!p.q[id]) p.q[id]={a:0,f:false,s:false}; return p.q[id]; }
function ls(id){ const p=P(); if(!p.lessons[id]) p.lessons[id]={complete:false,best:null,last:null,retakes:0}; return p.lessons[id]; }
function lessonDone(id){ const x=P().lessons[id]; return !!(x && x.complete); }
function fin(mid){ const p=P(); if(!p.finals[mid]) p.finals[mid]={attempts:0,history:[],passed:false,score:null,best:null,date:null,certId:null,lastResult:null}; return p.finals[mid]; }
function gated(){ return mode!=='admin-edit' && !!content.settings.gateLessons; }
function canOpenLesson(m,i){ return !gated() || i===0 || lessonDone(m.lessons[i-1].id); }
function allLessonsDone(m){ return m.lessons.every(l=>lessonDone(l.id)); }
function canOpenFinal(m){ return mode==='admin-edit' || !content.settings.requireLessonsBeforeFinal || allLessonsDone(m); }
function modulePct(m){ const done=m.lessons.filter(l=>lessonDone(l.id)).length + (fin(m.id).passed?1:0); return Math.round(done/(m.lessons.length+1)*100); }
function passMark(mid){ return Number((content.settings.finalPass||{})[mid]) || 80; }
function lessonEval(l){
  const qs=qsFor(l.questions); let solved=0, first=0;
  qs.forEach(q=>{ const s=qst(q.id); if(s.s) solved++; if(s.f) first++; });
  return {qs, total:qs.length, solved, first, allSolved: solved===qs.length, pct: qs.length ? Math.round(first/qs.length*100) : 100};
}
function finalizeLesson(l){
  const e=lessonEval(l); if(!e.allSolved) return e;
  const x=ls(l.id); x.last=e.pct; x.best=Math.max(x.best==null?0:x.best, e.pct);
  if(e.pct >= Number(content.settings.kcPassPercent)) x.complete=true;
  saveProg(); return e;
}

/* ---------- questions ---------- */
function questionHTML(q, prefix, o){
  o=o||{};
  const name=prefix+q.id;
  const label=(q.type==='mcq'&&q.scenario)?'Scenario question':(TYPE_LABEL[q.type]||'Question');
  const num=o.number?`<span class="qnum">Question ${o.number} of ${o.total}. </span>`:'';
  let h=`<div class="q${o.exam?' exam-q':''}" data-qid="${esc(q.id)}"><fieldset><legend><span class="qtype">${num}${label}</span>${esc(q.question)}</legend>`;
  if(q.scenario) h+=`<div class="scenario">${q.scenario}</div>`;
  if(q.type==='match'){
    (q.items||[]).forEach((it,i)=>{
      h+=`<div class="match-row"><label for="${name}-m${i}">${esc(it.prompt)}</label><select id="${name}-m${i}"><option value="">Choose\u2026</option>${q.options.map((op,j)=>`<option value="${j}">${esc(op)}</option>`).join('')}</select></div>`;
    });
  } else {
    const type=q.type==='multi'?'checkbox':'radio';
    const short=q.options.every(op=>op.length<=22);
    const letters=(q.type==='mcq')&&!short;
    h+=`<div class="${(q.type==='pick'||q.type==='triad'||(q.type==='multi'&&short)||(q.type==='mcq'&&short))?'chips-row':'opts'}">`;
    q.options.forEach((op,j)=>{ h+=`<label class="opt"><input type="${type}" name="${name}" value="${j}"><span>${letters?String.fromCharCode(65+j)+'. ':''}${esc(op)}</span></label>`; });
    h+='</div>';
  }
  h+='</fieldset>';
  h+= o.exam ? '<div class="mark-res"></div>' : '<div class="q-actions"><button type="button" class="btn small" data-check>Check answer</button><span class="attempts"></span></div><div class="fb" role="status" aria-live="polite"></div>';
  return h+'</div>';
}
function readAnswer(q,root){
  if(q.type==='match') return $all('select',root).map(s=>s.value===''?null:Number(s.value));
  if(q.type==='multi') return $all('input:checked',root).map(i=>Number(i.value));
  const c=$('input:checked',root); return c?Number(c.value):null;
}
function isAnswered(q,a){ if(q.type==='match') return a.every(v=>v!==null); if(q.type==='multi') return a.length>0; return a!==null; }
function isCorrect(q,a){
  if(q.type==='match') return (q.items||[]).every((it,i)=>a[i]===Number(it.answer));
  if(q.type==='multi') return q.correctAnswer.slice().sort().join(',')===a.slice().sort().join(',');
  return a===Number(q.correctAnswer);
}
function setAnswer(q,root){
  if(q.type==='match'){ $all('select',root).forEach((s,i)=>{ s.value=String(q.items[i].answer); }); return; }
  const arr=q.type==='multi'?q.correctAnswer:[Number(q.correctAnswer)];
  $all('input',root).forEach(inp=>{ inp.checked=arr.indexOf(Number(inp.value))>-1; });
}
function showSolved(q,root){
  setAnswer(q,root);
  $all('input,select,button[data-check]',root).forEach(el=>el.disabled=true);
  $all('input:checked',root).forEach(i=>i.closest('.opt').classList.add('picked-ok'));
  root.classList.add('solved');
  const s=qst(q.id), fb=$('.fb',root);
  fb.className='fb show ok';
  fb.innerHTML=`<span class="verdict">\u2713 Correct</span>${q.explanation?`<p>${esc(q.explanation)}</p>`:''}`;
  $('.attempts',root).textContent = s.f ? 'Correct on first attempt.' : `Correct after ${s.a} attempts (not counted in the score).`;
}
function wirePractice(q,root,onChange){
  if(qst(q.id).s){ showSolved(q,root); return; }
  if(qst(q.id).a>0) $('.attempts',root).textContent=`Attempts: ${qst(q.id).a}`;
  $('[data-check]',root).addEventListener('click',()=>{
    const a=readAnswer(q,root), fb=$('.fb',root);
    if(!isAnswered(q,a)){ fb.className='fb show info'; fb.innerHTML=`<span class="verdict">${q.type==='match'?'Choose an option for every item before checking.':'Select an answer before checking.'}</span>`; return; }
    const s=qst(q.id); s.a++;
    if(isCorrect(q,a)){ if(s.a===1) s.f=true; s.s=true; saveProg(); showSolved(q,root); announce('Correct. '+(q.explanation||'')); }
    else {
      saveProg();
      fb.className='fb show bad';
      fb.innerHTML=`<span class="verdict">\u2717 Incorrect \u2014 try again</span><div class="reason"><b>Correct reasoning:</b> ${esc(q.explanation||'Review the lesson content above.')}</div><p>Change your answer and select Check answer again.</p>`;
      $('.attempts',root).textContent=`Attempts: ${s.a}`;
      announce('Incorrect. Correct reasoning: '+(q.explanation||''));
    }
    onChange();
  });
}

function matrix(el, data, src){

function mountWidgets(root){ $all('[data-widget]',root).forEach(el=>{ const w=WIDGETS[el.dataset.widget]; if(w){ try { w(el); } catch(e){ el.innerHTML='<p class="err-text">This interactive element could not be displayed.</p>'; console.warn(e); } } }); }

function go(v){ view=v; render(true); }

  else if(mode==='admin-edit'){ pb.hidden=false; pb.innerHTML=`<div class="bar"><span><strong>Admin edit mode.</strong> All lessons and assessments are open. Use the Admin console to edit content.</span><button type="button" class="btn small ghost" data-nav="admin-previewmode">Preview as participant</button></div>`; }

function setFooter(html){ const f=$('#footer'); if(html){ f.hidden=false; $('#footerBar').innerHTML=html; } else f.hidden=true; }
function render(focus){
  if(mode==='user' && view.name==='admin') view={name:registered()?'dashboard':'welcome'};
  if(mode!=='user' && !registered()){ const pp=P(); pp.name=pp.name||'Admin Preview'; pp.dept=pp.dept||'EEE'; saveProg(); }
  if(!registered() && ['dashboard','lesson','final','certificate'].indexOf(view.name)>-1) view={name:'register', then:view};
  renderHeader();
  const app=$('#app'); let h='';
  setFooter('');
  switch(view.name){
    case 'welcome': h=vWelcome(); break;
    case 'register': h=vRegister(); break;
    case 'dashboard': h=vDashboard(); break;
    case 'lesson': h=vLesson(); break;
    case 'final': h=vFinal(); break;
    case 'certificate': h=vCertificate(); break;
    case 'admin': h=vAdmin(); break;
    default: h=vWelcome();
  }
  app.innerHTML=h;
  const wire={register:wRegister, dashboard:wDashboard, lesson:wLesson, final:wFinal, certificate:wCertificate, admin:wAdmin}[view.name];
  if(wire) wire();
  document.title=(view.title||'Basic OBE and CEP Self-Paced Training');
  if(focus){ window.scrollTo(0,0); const t=$('#viewTitle'); if(t) t.focus({preventScroll:true}); }
}

function wRegister(){
  $('#regForm').addEventListener('submit',e=>{
    e.preventDefault();
    const n=$('#rName').value.trim(), d=($('input[name=rDept]:checked')||{}).value;
    $('#rNameErr').hidden = n.length>=2; $('#rDeptErr').hidden = !!d;
    if(n.length<2){ $('#rName').focus(); return; }

    const p=P(); p.name=n; p.dept=d; p.email=$('#rEmail').value.trim(); saveProg();

/* ---------- dashboard ---------- */
function lessonStatus(m,i){ const l=m.lessons[i]; if(lessonDone(l.id)) return 'done'; return canOpenLesson(m,i)?'open':'locked'; }
function vDashboard(){
  const p=P(), overall=Math.round(content.modules.reduce((s,m)=>s+modulePct(m),0)/content.modules.length);
  const certs=availableCerts();
  let h=`<div class="wrap"><div class="panel"><h1 id="viewTitle" tabindex="-1">My training dashboard</h1>
  <div class="profile-line"><span><strong>${esc(p.name)}</strong></span><span>${esc(deptName())}</span>${p.email?`<span>${esc(p.email)}</span>`:''}<button type="button" class="btn ghost small" data-nav="register">Edit details</button></div>
  <h2 style="margin-top:1rem">Overall progress: ${overall}%</h2><div class="bigbar" role="progressbar" aria-label="Overall progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${overall}"><span style="width:${overall}%"></span></div>
  <p class="adm-note">The modules are independent. Work on either one in any order.</p>
  ${certs.length?`<h2>Certificates</h2><div class="cert-list">${certs.map(c=>`<button type="button" class="btn ghost small" data-cert="${c}">${c==='both'?'Full training certificate':'Module '+mod(c).number+' certificate'}</button>`).join('')}</div>`:''}
  </div><div class="dash-grid">`;
  content.modules.forEach(m=>{
    const pc=modulePct(m), f=fin(m.id), done=m.lessons.filter(l=>lessonDone(l.id)).length;
    const nextIdx=m.lessons.findIndex(l=>!lessonDone(l.id));
    h+=`<section class="mod-card" aria-labelledby="mh-${m.id}"><h2 id="mh-${m.id}">Module ${m.number}: ${esc(m.title)}</h2>
    <p><span class="pct">${pc}% complete</span></p><div class="bigbar" role="progressbar" aria-label="Module ${m.number} progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pc}"><span style="width:${pc}%"></span></div>
    <div class="stats"><div><span>Lessons completed</span><b>${done} of ${m.lessons.length}</b></div><div><span>Final assessment</span><b>${f.passed?'Passed, '+f.score+'%':(f.attempts?'Best '+f.best+'%, not yet passed':'Not attempted')}</b></div></div>
    <div class="btn-row"><button type="button" class="btn" data-lesson="${m.id}:${nextIdx<0?0:nextIdx}">${done===0?'Start module':(nextIdx<0?'Review lessons':'Continue')}</button><button type="button" class="btn ghost" data-final="${m.id}"${canOpenFinal(m)?'':' disabled'}>Final assessment</button></div>
    ${canOpenFinal(m)?'':'<p class="adm-note">The final assessment opens when all lessons in this module are complete.</p>'}
    <ol class="lesson-list" aria-label="Module ${m.number} lessons">${m.lessons.map((l,i)=>{ const st=lessonStatus(m,i), x=p.lessons[l.id]; return `<li><span class="st ${st==='done'?'done':''}" aria-hidden="true">${st==='done'?'\u2713':(st==='locked'?'\uD83D\uDD12':'\u25CB')}</span><button type="button" class="linkish" data-lesson="${m.id}:${i}"${st==='locked'?' disabled':''}>${i+1}. ${esc(l.title)}<span class="sr-only"> (${st==='done'?'completed':st})</span></button><span class="score-chip">${x&&x.best!=null?'Check: '+x.best+'%':'Not attempted'}</span></li>`; }).join('')}</ol></section>`;
  });
  return h+'</div></div>';
}
function wDashboard(){}

/* ---------- lesson ---------- */
function curLesson(){ const m=mod(view.mod); return {m, l:m.lessons[view.idx], i:view.idx}; }
function outlineHTML(m, activeIdx, finalActive){
  return `<p class="mod-title">Module ${m.number}: ${esc(m.title)}</p><ol>${m.lessons.map((l,i)=>{ const st=lessonStatus(m,i); return `<li><button type="button" data-lesson="${m.id}:${i}"${st==='locked'?' disabled':''}${i===activeIdx?' aria-current="step"':''}><span class="mark${st==='done'?' done':''}" aria-hidden="true">${st==='done'?'\u2713':(st==='locked'?'\uD83D\uDD12':'\u25CB')}</span><span>${esc(l.title)}<span class="sr-only"> (${st==='done'?'completed':st})</span></span></button></li>`; }).join('')}
  <li><button type="button" data-final="${m.id}"${canOpenFinal(m)?'':' disabled'}${finalActive?' aria-current="step"':''}><span class="mark${fin(m.id).passed?' done':''}" aria-hidden="true">${fin(m.id).passed?'\u2713':(canOpenFinal(m)?'\u25CB':'\uD83D\uDD12')}</span><span>Final assessment</span></button></li></ol>`;
}
function layoutWrap(inner, m, activeIdx, finalActive){
  return `<div class="layout"><div class="outline-col"><button type="button" class="btn ghost small outline-toggle" id="outlineToggle" aria-expanded="false" aria-controls="outline">Show module outline</button><nav class="outline" id="outline" aria-label="Module outline">${outlineHTML(m,activeIdx,finalActive)}</nav></div><main id="main" tabindex="-1"><div class="panel">${inner}</div></main></div>`;
}
function vLesson(){
  const {m,l,i}=curLesson();
  if(!l) return vDashboard();
  if(!canOpenLesson(m,i)){ view={name:'dashboard'}; return vDashboard(); }
  view.title=l.title;
  const qs=qsFor(l.questions);
  if(qs.length===0 && !lessonDone(l.id)){ ls(l.id).complete=true; saveProg(); }
  const body=(l.body||'').replace('{{DEPT}}', (l.dept&&l.dept[dept()])||'');
  let h=`<p class="crumb">Module ${m.number}, lesson ${i+1} of ${m.lessons.length}</p><h1 id="viewTitle" tabindex="-1">${esc(l.title)}</h1>`;
  if(mode==='admin-edit') h+=`<p><button type="button" class="btn ghost small" data-edit-lesson="${m.id}:${i}">Edit this lesson</button></p>`;
  h+=body;
  if(qs.length){ h+=`<section class="checks" aria-labelledby="kcHead"><h2 id="kcHead">Knowledge check</h2><p class="counter">${qs.length} questions. Your first attempt on each question counts towards your score; you can then retry with the correct reasoning shown.</p>${qs.map(q=>questionHTML(q,'p-',{})).join('')}<div id="perf" aria-live="polite"></div></section>`; }
  return layoutWrap(h, m, i, false);
}
function perfHTML(l){
  const e=lessonEval(l), x=ls(l.id), pass=Number(content.settings.kcPassPercent);
  if(!e.total) return '';
  if(!e.allSolved) return `<div class="perf"><p><strong>Lesson performance:</strong> ${e.solved} of ${e.total} questions answered correctly so far. First-attempt correct: ${e.first}.</p><p>Answer every question correctly to finish the check. Pass mark: ${pass}% on first attempts.</p></div>`;
  if(x.complete && e.pct>=pass) return `<div class="perf pass"><p><strong>\u2713 Knowledge check passed.</strong> First-attempt score: ${e.first} of ${e.total} (${e.pct}%). Pass mark ${pass}%.</p>${x.retakes?`<p>Retakes: ${x.retakes}. Best score: ${x.best}%.</p>`:''}</div>`;
  if(x.complete) return `<div class="perf pass"><p>This lesson is already complete (best score ${x.best}%). Latest first-attempt score: ${e.pct}%.</p></div>`;
  return `<div class="perf fail"><p><strong>First-attempt score: ${e.first} of ${e.total} (${e.pct}%).</strong> The pass mark is ${pass}%.</p><p>Review the lesson and the correct reasoning above, then retake the knowledge check.</p><button type="button" class="btn small" id="btnRetake">Retake knowledge check</button></div>`;
}
function lessonFooter(){
  const {m,l,i}=curLesson(), done=lessonDone(l.id), last=i===m.lessons.length-1;
  const nextOk = !gated() || done;
  const nextLabel = last ? 'Go to final assessment' : 'Next lesson';
  const nextDisabled = last ? (!canOpenFinal(m) || !nextOk) : !nextOk;
  setFooter(`<button type="button" class="btn ghost" id="fPrev"${i===0?' disabled':''}>Previous</button><button type="button" class="btn ghost small" data-nav="dashboard">Dashboard</button><span class="hint">${nextDisabled?(gated()?'Pass the knowledge check to continue.':'Complete all lessons to open the final assessment.'):''}</span><button type="button" class="btn" id="fNext"${nextDisabled?' disabled':''}>${nextLabel}</button>`);
  $('#fPrev').addEventListener('click',()=>{ if(i>0) go({name:'lesson',mod:m.id,idx:i-1}); });
  $('#fNext').addEventListener('click',()=>{ if(last) go({name:'final',mod:m.id}); else go({name:'lesson',mod:m.id,idx:i+1}); });
}
function wLesson(){
  const {m,l}=curLesson(); if(!l) return;
  mountWidgets($('#app'));
  wireOutline();
  const refresh=()=>{ finalizeLesson(l); $('#perf').innerHTML=perfHTML(l); const r=$('#btnRetake'); if(r) r.addEventListener('click',()=>retake(l)); lessonFooter(); renderHeader(); refreshOutline(m, view.idx, false); };
  qsFor(l.questions).forEach(q=>{ const root=$(`.q[data-qid="${CSS.escape(q.id)}"]`); if(root) wirePractice(q,root,refresh); });
  if($('#perf')){ $('#perf').innerHTML=perfHTML(l); const r=$('#btnRetake'); if(r) r.addEventListener('click',()=>retake(l)); }
  lessonFooter();
}
function retake(l){ qsFor(l.questions).forEach(q=>{ delete P().q[q.id]; }); ls(l.id).retakes++; saveProg(); render(false); const k=$('#kcHead'); if(k){ k.setAttribute('tabindex','-1'); k.focus(); } }
function wireOutline(){
  const t=$('#outlineToggle'), o=$('#outline'); if(!t) return;
  t.addEventListener('click',()=>{ const op=!o.classList.contains('open'); o.classList.toggle('open',op); t.setAttribute('aria-expanded',String(op)); t.textContent=op?'Hide module outline':'Show module outline'; });
}
function refreshOutline(m,idx,fa){ const o=$('#outline'); if(o) o.innerHTML=outlineHTML(m,idx,fa); }

/* ---------- final assessment ---------- */
function vFinal(){
  const m=mod(view.mod); if(!m) return vDashboard();
  if(!canOpenFinal(m)){ view={name:'dashboard'}; return vDashboard(); }
  view.title='Module '+m.number+' final assessment';
  const f=fin(m.id), qs=qsFor(m.final), pm=passMark(m.id);
  let h=`<p class="crumb">Module ${m.number}: ${esc(m.title)}</p><h1 id="viewTitle" tabindex="-1">Final assessment</h1>`;
  if(f.lastResult && !exam[m.id]){
    const r=f.lastResult;
    h+= r.passed ? `<div class="result pass" role="status"><p class="score">${r.score}%</p><p><strong>\u2713 Congratulations. You have passed the Module ${m.number} final assessment.</strong></p><p>${r.correct} of ${r.total} correct. Pass mark ${pm}%. Completed ${fmtDate(f.date)}.</p><div class="btn-row"><button type="button" class="btn" data-cert="${m.id}">View certificate</button><button type="button" class="btn ghost" data-nav="dashboard">Dashboard</button></div></div>`
      : `<div class="result fail" role="status"><p class="score">${r.score}%</p><p><strong>\u2717 You have not yet achieved the required passing score (${pm}%). Review the relevant lessons and retry the assessment.</strong></p><p>${r.correct} of ${r.total} correct.</p></div>`;
    h+=`<h2>Performance by topic</h2><div class="table-scroll"><table><thead><tr><th scope="col">Topic</th><th scope="col">Correct</th></tr></thead><tbody>${Object.keys(r.topics).map(t=>`<tr><td>${esc(t)}</td><td>${r.topics[t][0]} of ${r.topics[t][1]}${r.topics[t][0]<r.topics[t][1]?' (review)':''}</td></tr>`).join('')}</tbody></table></div>`;
    if(!r.passed){ const rev=reviewLessons(m,r); if(rev.length) h+=`<p><strong>Suggested lessons to review:</strong></p><ul class="review-list">${rev.map(i=>`<li><button type="button" class="btn ghost small" data-lesson="${m.id}:${i}">${esc(m.lessons[i].title)}</button></li>`).join('')}</ul>`; }
    h+=`<div class="btn-row"><button type="button" class="btn${r.passed?' ghost':''}" id="btnRetry">${r.passed?'Take the assessment again':'Retry assessment'}</button></div>`;
    if(r.passed) h+='<p class="adm-note">Retaking does not remove your pass or certificate; your best score is kept.</p>';
    return layoutWrap(h,m,-1,true);
  }
  if(!exam[m.id]) exam[m.id]=shuffle(qs.map(q=>q.id));
  h+=`<p class="lead">${qs.length} questions. Pass mark: ${pm}%. Answer every question, then submit. Feedback by topic is shown after you submit.</p><p class="counter">Attempts so far: ${f.attempts}${f.best!=null?'. Best score: '+f.best+'%':''}.</p>`;
  exam[m.id].forEach((id,n)=>{ const q=qs.find(x=>x.id===id); if(q) h+=questionHTML(q,'f-',{exam:true,number:n+1,total:qs.length}); });
  h+=`<div class="q-actions"><button type="button" class="btn" id="btnSubmit">Submit assessment</button></div><div class="fb" id="submitMsg" role="alert"></div>`;
  return layoutWrap(h,m,-1,true);
}
function reviewLessons(m,r){ const bad=Object.keys(r.topics).filter(t=>r.topics[t][0]<r.topics[t][1]); const out=[]; m.lessons.forEach((l,i)=>{ if(qsFor(l.questions).some(q=>bad.indexOf(q.topic)>-1)) out.push(i); }); return out.slice(0,6); }
function wFinal(){
  const m=mod(view.mod); if(!m) return; wireOutline();
  const retry=$('#btnRetry'); if(retry) retry.addEventListener('click',()=>{ fin(m.id).lastResult=null; delete exam[m.id]; saveProg(); render(true); });
  const sub=$('#btnSubmit'); if(!sub) return;
  sub.addEventListener('click',()=>{
    const qs=qsFor(m.final), order=exam[m.id], miss=[]; let correct=0; const topics={};
    order.forEach((id,n)=>{ const q=qs.find(x=>x.id===id); if(!q) return; const root=$(`.q[data-qid="${CSS.escape(id)}"]`), a=readAnswer(q,root); root.classList.remove('missing');
      const t=q.topic||'General'; topics[t]=topics[t]||[0,0]; topics[t][1]++;
      if(!isAnswered(q,a)){ miss.push(n+1); root.classList.add('missing'); return; }
      if(isCorrect(q,a)){ correct++; topics[t][0]++; } });
    const msg=$('#submitMsg');
    if(miss.length){ msg.className='fb show info'; msg.innerHTML=`<span class="verdict">Answer all questions before submitting. Unanswered: ${miss.join(', ')}.</span>`; const fq=$('.q.missing'); if(fq) $('input,select',fq).focus(); return; }
    const total=order.length, score=Math.round(correct/total*100), f=fin(m.id), now=new Date(), passed=score>=passMark(m.id);
    f.attempts++; f.history.push({score, date:now.toISOString()}); f.best=Math.max(f.best==null?0:f.best, score);
    if(passed){ if(!f.passed){ f.passed=true; f.date=now.toISOString(); } f.score=Math.max(f.score||0,score); if(!f.certId) f.certId=`${content.certificate.idPrefix}-${m.certCode}-${now.getFullYear()}-${rand6()}`; }
    f.lastResult={score,correct,total,topics,passed};
    delete exam[m.id]; saveProg(); render(true);
    announce(passed?`Passed with ${score} percent.`:`Score ${score} percent. Not yet passed.`);
  });
}

function saveQForm(form){
  const err=$('#qfErr'), type=$('#qfType').value, opts=$('#qfOpts').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const question=$('#qfQ').value.trim();
  if(!question){ err.textContent='Enter the question text.'; return; }
  if(opts.length<2){ err.textContent='Enter at least two options.'; return; }
  const q={id:form.dataset.new==='true' ? 'q-'+Date.now().toString(36) : form.dataset.qid, dept:$('#qfDept').value, type, question, options:opts, explanation:$('#qfExp').value.trim()};
  const topic=$('#qfTopic').value.trim(); if(topic) q.topic=topic;
  const sc=$('#qfSc').value.trim(); if(sc) q.scenario=sc;
  const nums=$('#qfCorr').value.split(/[,\s]+/).filter(Boolean).map(Number);
  if(type==='match'){
    const items=$('#qfItems').value.split('\n').map(s=>s.trim()).filter(Boolean).map(line=>{ const k=line.lastIndexOf('|'); return k<0?null:{prompt:line.slice(0,k).trim(), answer:Number(line.slice(k+1).trim())-1}; });
    if(!items.length || items.some(it=>!it||!it.prompt||!(it.answer>=0&&it.answer<opts.length))){ err.textContent='Each matching item needs "text | option number" with a valid option number.'; return; }
    q.items=items; q.correctAnswer=null;
  } else if(type==='multi'){
    if(!nums.length || nums.some(n=>!(n>=1&&n<=opts.length))){ err.textContent='Enter valid correct option numbers, e.g. 1, 3.'; return; }
    q.correctAnswer=Array.from(new Set(nums.map(n=>n-1))).sort();
  } else {
    if(nums.length!==1 || !(nums[0]>=1&&nums[0]<=opts.length)){ err.textContent='Enter one valid correct option number.'; return; }
    q.correctAnswer=nums[0]-1;
  }
  const list=qList(form.dataset.scope);
  if(form.dataset.new==='true') list.push(q); else { const i=list.findIndex(x=>x.id===q.id); if(i>-1) list[i]=q; }
  adm.editQ=null; saveContent(); render(false);
}

  <div><label for="cDis">Disclaimer</label><textarea id="cDis">${esc(C.disclaimer)}</textarea></div>
  <div class="btn-row"><button type="submit" class="btn">Save</button></div></form>`;
}
function aFile(){
  return `<div class="cols"><div class="box"><h3>Distribute your edits</h3><p>Download a new <code>index.html</code> with all current content and settings built in. Give that file to participants.</p><button type="button" class="btn" data-act="dlHtml">Download updated index.html</button></div>
  <div class="box"><h3>Back up or transfer</h3><p>Export the content as JSON, or import a JSON file exported earlier.</p><div class="btn-row"><button type="button" class="btn ghost" data-act="export">Export content (JSON)</button><label class="btn ghost" for="impFile" style="display:inline-flex;align-items:center">Import content (JSON)</label><input type="file" id="impFile" accept="application/json,.json" class="sr-only"></div><p class="err-text" id="impErr" role="alert"></p></div>
  <div class="box"><h3>Restore defaults</h3><p>Discard all local edits and return to the content built into this file.</p><button type="button" class="btn danger" data-act="restore">Restore built-in content</button></div></div>`;
}
function wAdmin(){
  const app=$('#app');
  const modSel=$('#admMod'); if(modSel) modSel.addEventListener('change',()=>{ adm.mod=modSel.value; adm.li=0; adm.editQ=null; render(false); });
  const fm=$('#admFinMod'); if(fm) fm.addEventListener('change',()=>{ adm.finalMod=fm.value; adm.editQ=null; render(false); });
  const pv=$('#pvDept'); if(pv) pv.addEventListener('change',()=>{ prog.profiles.preview.dept=pv.value; saveProg(); toast('Preview department set'); });
  const lf=$('#lessonForm'); if(lf) lf.addEventListener('submit',e=>{ e.preventDefault(); const l=mod(adm.mod).lessons[adm.li]; l.title=$('#lTitle').value.trim()||l.title; l.summary=$('#lSum').value.trim(); l.body=$('#lBody').value; l.dept=l.dept||{}; DEPTS.forEach(d=>l.dept[d]=$('#lDept'+d).value); saveContent(); render(false); });
  const qf=$('#qForm'); if(qf){ qf.addEventListener('submit',e=>{ e.preventDefault(); saveQForm(qf); }); $('#qfType').addEventListener('change',()=>{ const t=$('#qfType').value, o=$('#qfOpts'); if(t==='tf') o.value='True\nFalse'; if(t==='triad') o.value='Yes\nNo\nInsufficient evidence'; }); $('#qfQ').focus(); }
  const bf=$('#bloomForm'); if(bf) bf.addEventListener('submit',e=>{ e.preventDefault(); const B=content.bloom; B.levels.forEach((L,i)=>{ L.def=$('#bd'+i).value.trim(); L.verbs=$('#bv'+i).value.split(',').map(s=>s.trim()).filter(Boolean); B.kvl[i]=$('#bk'+i).value.trim(); DEPTS.forEach(d=>{ B.examples[d]=B.examples[d]||[]; B.examples[d][i]=$('#be'+d+i).value.trim(); }); }); B.weakVerbs=$('#bWeak').value.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean); saveContent(); });
  const cf=$('#cepForm'); if(cf) cf.addEventListener('submit',e=>{ e.preventDefault(); DEPTS.forEach(d=>{ content.cases[d]={title:$('#caT'+d).value.trim(), html:$('#caH'+d).value}; content.cepScenarios[d]={title:$('#scT'+d).value.trim(), html:$('#scH'+d).value}; }); saveContent(); });
  const sf=$('#setForm'); if(sf) sf.addEventListener('submit',e=>{ e.preventDefault(); const S=content.settings; const clamp=(v,lo,d)=>{ v=Number(v); return isFinite(v)?Math.min(100,Math.max(lo,Math.round(v))):d; }; S.kcPassPercent=clamp($('#sKc').value,0,60); S.finalPass=S.finalPass||{}; content.modules.forEach(m=>S.finalPass[m.id]=clamp($('#sF'+m.id).value,1,80)); S.gateLessons=$('#sGate').checked; S.requireLessonsBeforeFinal=$('#sReq').checked; saveContent(); render(false); });
  const pw=$('#pwForm'); if(pw) pw.addEventListener('submit',e=>{ e.preventDefault(); const a=$('#pw1').value, b=$('#pw2').value; if(a.length<6){ $('#pwErr').textContent='Use at least 6 characters.'; return; } if(a!==b){ $('#pwErr').textContent='The passwords do not match.'; return; } content.settings.adminPasswordHash=sha256(a); saveContent(); $('#pw1').value=$('#pw2').value=''; $('#pwErr').textContent=''; toast('Password changed'); });
  const ctf=$('#certForm'); if(ctf) ctf.addEventListener('submit',e=>{ e.preventDefault(); const M=content.meta, C=content.certificate, lines=id=>$(id).value.split('\n').map(s=>s.trim()).filter(Boolean);
    M.title=$('#mT').value.trim()||M.title; M.description=$('#mD').value.trim(); M.developerName=$('#mN').value.trim(); M.developerLines=lines('#mL'); M.sourceNote=$('#mS').value.trim();
    C.heading=$('#cH').value.trim()||C.heading; C.idPrefix=$('#cP').value.trim()||C.idPrefix; C.issuerLines=lines('#cI'); C.signatoryName=$('#cSn').value.trim(); C.signatoryTitle=$('#cSt').value.trim(); C.showDeveloper=$('#cDev').checked; C.disclaimer=$('#cDis').value.trim(); saveContent(); });
  const imp=$('#impFile'); if(imp) imp.addEventListener('change',()=>{ const f=imp.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try { const o=JSON.parse(r.result); const c=o.content||o; if(!Array.isArray(c.modules)||!c.settings||!c.bloom) throw new Error('missing parts'); if(!c.settings.adminPasswordHash) c.settings.adminPasswordHash=content.settings.adminPasswordHash; content=c; saveContent(); render(false); toast('Content imported'); } catch(err){ $('#impErr').textContent='This file is not a valid training content export.'; } }; r.readAsText(f); });
}
function adminAct(btn){
  const a=btn.dataset.act;
  if(a==='preview'){ const pv=prog.profiles.preview; if(!pv.name) pv.name='Admin Preview'; if(!pv.dept) pv.dept=($('#pvDept')||{}).value||'EEE'; saveProg(); mode='admin-preview'; ssSet(SS_ADMIN,'preview'); go({name:'dashboard'}); return; }
  if(a==='browse'){ go({name:'dashboard'}); return; }
  if(a==='resetUser'){ confirmDlg('Reset participant progress?','This clears the participant\u2019s name, department, lesson progress, scores and certificates in this browser.','Reset progress',()=>{ prog.profiles.user=newProfile(); saveProg(); render(false); toast('Participant progress reset'); }); return; }
  if(a==='resetPreview'){ prog.profiles.preview=newProfile(); saveProg(); render(false); toast('Preview profile reset'); return; }
  if(a==='addLesson'){ const m=mod(adm.mod); const nl={id:m.id+'-x'+Date.now().toString(36), title:'New lesson', summary:'', body:'<p class="lead">Write the lesson content here.</p>{{DEPT}}', dept:{EEE:'',CSE:'',TE:''}, questions:[]}; m.lessons.splice(adm.li+1,0,nl); adm.li=Math.min(adm.li+1,m.lessons.length-1); if(m.lessons.length===1) adm.li=0; saveContent(); render(false); return; }
  if(a==='delLesson'){ const m=mod(adm.mod), l=m.lessons[adm.li]; confirmDlg('Delete this lesson?','\u201c'+l.title+'\u201d and its questions will be removed.','Delete lesson',()=>{ m.lessons.splice(adm.li,1); adm.li=Math.max(0,adm.li-1); saveContent(); render(false); }); return; }
  if(a==='moveLesson'){ const m=mod(adm.mod), d=+btn.dataset.dir, j=adm.li+d; if(j<0||j>=m.lessons.length) return; [m.lessons[adm.li],m.lessons[j]]=[m.lessons[j],m.lessons[adm.li]]; adm.li=j; saveContent(); render(false); return; }
  if(a==='openLesson'){ go({name:'lesson',mod:adm.mod,idx:adm.li}); return; }
  if(a==='newQ'){ adm.editQ='new'; render(false); return; }
  if(a==='cancelQ'){ adm.editQ=null; render(false); return; }
  if(a==='editQ'){ const list=qList(btn.dataset.scope); adm.editQ=list[+btn.dataset.qi].id; render(false); return; }
  if(a==='moveQ'){ const list=qList(btn.dataset.scope), i=+btn.dataset.qi; if(i>0){ [list[i-1],list[i]]=[list[i],list[i-1]]; saveContent(); render(false); } return; }
  if(a==='delQ'){ const list=qList(btn.dataset.scope), i=+btn.dataset.qi; confirmDlg('Delete this question?','\u201c'+list[i].question.slice(0,90)+'\u201d','Delete question',()=>{ list.splice(i,1); adm.editQ=null; saveContent(); render(false); }); return; }
  if(a==='export'){ download('obe-cep-training-content.json', JSON.stringify({exportedAt:new Date().toISOString(), content},null,1), 'application/json'); return; }
  if(a==='dlHtml'){ const json=JSON.stringify(content).replace(/</g,'\\u003c'); const out=PRISTINE.replace(/(<script id="content-data" type="application\/json">)[\s\S]*?(<\/script>)/, (m0,p1,p2)=>p1+json+p2); download('index.html', out, 'text/html'); toast('Updated index.html downloaded'); return; }
  if(a==='restore'){ confirmDlg('Restore built-in content?','All local edits to lessons, questions and settings will be discarded. Participant progress is kept.','Restore',()=>{ lsDel(LS_CONTENT); content=clone(DEFAULT_CONTENT); contentSavedAt=null; render(false); toast('Built-in content restored'); }); return; }
}

/* ---------- dialogs ---------- */
let dlgCb=null;
function confirmDlg(title, text, okLabel, cb){ const d=$('#dlgConfirm'); $('#dcTitle').textContent=title; $('#dcText').textContent=text; $('#dcOk').textContent=okLabel; dlgCb=cb; if(d.showModal) d.showModal(); else if(window.confirm(title+'\n'+text)) cb(); }
function openLogin(){ const d=$('#dlgLogin'); $('#lgPw').value=''; $('#lgErr').textContent=''; d.showModal(); $('#lgPw').focus(); }

/* ---------- global events & boot ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-nav]'); if(!t || t.disabled) return;
  if(t.dataset.nav){ const n=t.dataset.nav;
    if(n==='admin-login') return openLogin();
    if(n==='admin-exit'){ ssDel(SS_ADMIN); mode='user'; go({name:registered()?'dashboard':'welcome'}); toast('Signed out of admin'); return; }
    if(n==='admin-editmode'){ mode='admin-edit'; ssSet(SS_ADMIN,'edit'); adm.tab='overview'; go({name:'admin'}); return; }
    if(n==='admin-previewmode'){ adminAct({dataset:{act:'preview'}}); return; }
    if(n==='admin'){ if(mode==='admin-preview'){ mode='admin-edit'; ssSet(SS_ADMIN,'edit'); } go({name:'admin'}); return; }
    go({name:n}); return; }
  if(t.dataset.start){ go(registered()?{name:'lesson',mod:t.dataset.start,idx:firstOpen(t.dataset.start)}:{name:'register',then:{name:'lesson',mod:t.dataset.start,idx:0}}); return; }
  if(t.dataset.lesson){ const [mid,i]=t.dataset.lesson.split(':'); go({name:'lesson',mod:mid,idx:+i}); return; }
  if(t.dataset.final){ go({name:'final',mod:t.dataset.final}); return; }
  if(t.dataset.cert){ go({name:'certificate',which:t.dataset.cert}); return; }
  if(t.dataset.tab){ adm.tab=t.dataset.tab; adm.editQ=null; render(false); return; }
  if(t.dataset.li!==undefined){ adm.li=+t.dataset.li; adm.editQ=null; render(false); return; }
  if(t.dataset.editLesson){ const [mid,i]=t.dataset.editLesson.split(':'); adm.tab='lessons'; adm.mod=mid; adm.li=+i; adm.editQ=null; go({name:'admin'}); return; }
  if(t.dataset.act && view.name==='admin') adminAct(t);
});
function firstOpen(mid){ const m=mod(mid), i=m.lessons.findIndex(l=>!lessonDone(l.id)); return i<0?0:i; }
document.addEventListener('DOMContentLoaded',()=>{
  $('#dcCancel').addEventListener('click',()=>$('#dlgConfirm').close());
  $('#dcOk').addEventListener('click',()=>{ $('#dlgConfirm').close(); if(dlgCb) dlgCb(); dlgCb=null; });
  $('#lgCancel').addEventListener('click',()=>$('#dlgLogin').close());
  $('#lgForm').addEventListener('submit',e=>{ e.preventDefault(); if(sha256($('#lgPw').value)===content.settings.adminPasswordHash){ $('#dlgLogin').close(); mode='admin-edit'; ssSet(SS_ADMIN,'edit'); adm.tab='overview'; go({name:'admin'}); toast('Signed in as admin'); } else { $('#lgErr').textContent='Incorrect password.'; $('#lgPw').select(); } });
  view = mode!=='user' ? {name:'admin'} : {name: registered() ? 'dashboard' : 'welcome'};
  render(false);
});
window.__training={getState:()=>({mode, view, prog, content})};

</script>
